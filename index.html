RS2(3,['Researcher Dr. Mira Chen studies bird migration.','She tracked 40 Arctic terns with small tags in 2022.','The terns flew an average of 70,000 kilometers in a year.','This is the longest known migration of any animal.'],'to introduce the study to readers who know little about bird migration.',['In 2022, researcher Dr. Mira Chen tracked 40 Arctic terns with small tags and found that they flew an average of 70,000 kilometers in a year, the longest known migration of any animal.','Dr. Mira Chen studies bird migration.','The terns flew 70,000 kilometers.','This is the longest known migration of any animal.'],'The goal is to introduce the study to novices, so the sentence should say who did what, how, and what was found. The first choice does this; the others omit context.','เป้าหมายคือแนะนำงานวิจัยให้ผู้อ่านมือใหม่ จึงควรบอกว่าใครทำอะไร อย่างไร และพบอะไร ตัวเลือกแรกทำครบ ส่วนอื่นขาดบริบท');
RS2(1,['The tallest tree in the world is a coast redwood named Hyperion.','Hyperion is about 116 meters tall.','It grows in a protected area of California.','Its exact location is kept secret.'],'to state the height of the tallest tree.',['The coast redwood named Hyperion, the tallest tree in the world, is about 116 meters tall.','Hyperion grows in a protected area of California.','Hyperion’s exact location is kept secret.','Hyperion is a coast redwood.'],'Only the first choice states the height.','มีเพียงตัวเลือกแรกที่บอกความสูง');
RS2(2,['The Silk Road was a network of trade routes.','It connected China with the Mediterranean.','Merchants traded silk, spices, and paper.','Ideas and religions also spread along its routes.'],'to explain that the Silk Road carried more than goods.',['Along with silk, spices, and paper, ideas and religions also spread along the Silk Road.','The Silk Road was a network of trade routes.','The Silk Road connected China with the Mediterranean.','Merchants traded silk, spices, and paper.'],'The goal is that it carried more than goods, so the sentence must mention ideas and religions in addition to goods.','เป้าหมายคือสื่อว่าไม่ได้ขนส่งแต่สินค้า จึงต้องพูดถึงความคิดและศาสนาควบคู่กับสินค้า');
RS2(3,['Solar panel A converts 18 percent of sunlight to electricity and costs $200.','Solar panel B converts 22 percent of sunlight to electricity and costs $320.','Both panels have a 25-year warranty.'],'to compare the two panels’ efficiency and cost.',['Panel B converts more sunlight to electricity than Panel A (22 percent versus 18 percent) but costs more ($320 versus $200).','Both panels have a 25-year warranty.','Panel A converts 18 percent of sunlight to electricity.','Panel B costs $320.'],'A comparison of efficiency and cost needs both figures for both panels. Only the first choice provides them.','การเปรียบเทียบต้องมีทั้งประสิทธิภาพและราคาของทั้งสองแผง มีเพียงตัวเลือกแรกที่ให้ครบ');
RS2(2,['Author Tanya Ruiz wrote the novel Salt Roads.','It was published in 2018.','The novel is set in a coastal village in Mexico.','It won a national literary prize.'],'to introduce the author’s novel and its significance to readers.',['Tanya Ruiz’s 2018 novel Salt Roads, set in a coastal Mexican village, won a national literary prize.','Author Tanya Ruiz wrote a novel.','The novel was published in 2018.','Salt Roads is set in Mexico.'],'To show significance, the sentence should mention the prize and give basic identifying details.','เพื่อแสดงความสำคัญควรกล่าวถึงรางวัลและรายละเอียดระบุตัวตนพื้นฐาน');
RS2(1,['The Amazon rainforest covers parts of nine countries.','It contains about 10 percent of the world’s known species.','Much of it lies in Brazil.'],'to emphasize the rainforest’s biodiversity.',['The Amazon rainforest contains about 10 percent of the world’s known species.','The Amazon rainforest covers parts of nine countries.','Much of the Amazon rainforest lies in Brazil.','The Amazon is a rainforest.'],'Biodiversity relates to the number of species. Only the first choice mentions species.','ความหลากหลายทางชีวภาพเกี่ยวกับจำนวนชนิดพันธุ์ มีเพียงตัวเลือกแรกที่พูดถึง');
RS2(3,['In 1990, the town’s river was too polluted for fish to survive.','A cleanup program began in 1995.','By 2015, 20 species of fish had returned to the river.','The program was funded by a mix of local taxes and federal grants.'],'to show that the cleanup program succeeded.',['After a cleanup program began in 1995, 20 species of fish had returned to the river by 2015, a river that once could not support fish.','The cleanup program was funded by local taxes and federal grants.','In 1990, the river was too polluted for fish to survive.','A cleanup program began in 1995.'],'Success means a before-and-after contrast. The first choice shows the cleanup and the results.','ความสำเร็จคือการเปรียบเทียบก่อนและหลัง ตัวเลือกแรกแสดงการทำความสะอาดและผลลัพธ์');
RS2(2,['Origami is the Japanese art of folding paper.','A traditional origami crane takes about 20 folds.','In Japan, a thousand folded cranes are said to grant a wish.','Some modern artists use metal sheets for origami.'],'to explain a cultural meaning of the origami crane.',['In Japan, a thousand folded origami cranes are said to grant a wish.','A traditional origami crane takes about 20 folds.','Some modern artists use metal sheets for origami.','Origami is the Japanese art of folding paper.'],'Cultural meaning relates to the wish tradition, which only the first choice mentions.','ความหมายเชิงวัฒนธรรมเกี่ยวกับความเชื่อเรื่องขอพร ซึ่งมีเพียงตัวเลือกแรก');
RS2(3,['Researchers measured reaction times of drivers who talked on a phone and drivers who did not.','Drivers on phones took an average of 0.3 seconds longer to react.','Hands-free and handheld phones produced similar delays.','The study included 120 participants.'],'to argue that hands-free phones do not make driving safer.',['In the study, drivers using hands-free phones were slowed by about the same amount as drivers using handheld phones, reacting an average of 0.3 seconds later than drivers not on the phone.','The study included 120 participants.','Researchers measured reaction times of drivers.','Drivers on phones took longer to react.'],'To argue that hands-free is no safer, the sentence must compare hands-free and handheld delays, which only the first choice does.','เพื่อโต้ว่า hands-free ไม่ปลอดภัยกว่า ต้องเทียบความล่าช้าของ hands-free กับถือโทรศัพท์ ซึ่งมีเพียงข้อแรก');
RS2(2,['Bees pollinate about one-third of the food people eat.','In recent years, bee populations have declined in many regions.','Scientists point to pesticides and habitat loss as causes.'],'to explain why declining bee populations concern scientists.',['Because bees pollinate about one-third of the food people eat, their decline in many regions is a concern.','Scientists point to pesticides and habitat loss as causes.','Bee populations have declined in many regions.','Bees are insects.'],'The concern comes from bees’ importance to food; the first choice links importance and decline.','ความกังวลมาจากความสำคัญของผึ้งต่ออาหาร ตัวเลือกแรกเชื่อมความสำคัญกับการลดลง');
RS2(1,['Mount Everest is the highest mountain above sea level.','It lies on the border between Nepal and China.','Its summit is 8,849 meters above sea level.'],'to give the location of Mount Everest.',['Mount Everest lies on the border between Nepal and China.','Mount Everest’s summit is 8,849 meters above sea level.','Mount Everest is the highest mountain above sea level.','Mount Everest is a mountain.'],'The goal is location. Only the first choice names where it is.','เป้าหมายคือที่ตั้ง มีเพียงตัวเลือกแรกที่บอกว่าอยู่ที่ไหน');
RS2(3,['Jazz musician Alma Torres grew up in a family of classical pianists.','She began playing in clubs at age 16.','Her 2020 album blends jazz with traditional Colombian rhythms.','The album received two award nominations.'],'to describe how Torres’s background shaped her music, for readers unfamiliar with her.',['Alma Torres, who grew up in a family of classical pianists, blends jazz with traditional Colombian rhythms on her 2020 album.','She began playing in clubs at age 16.','The album received two award nominations.','Alma Torres is a jazz musician.'],'The goal links background to music. The first choice connects her family background to the style of her album.','เป้าหมายคือเชื่อมภูมิหลังกับดนตรี ตัวเลือกแรกเชื่อมครอบครัวกับสไตล์อัลบั้ม');

L('Systems of linear equations',
 'Solve by elimination (add or subtract the equations so one variable cancels) or by substitution. Two lines with the same slope and different intercepts have no solution; the same line twice has infinitely many.',

 'Subtracting a whole equation and forgetting to flip every sign, or answering with x when the question asks for x + y.',
 'ลบสมการแล้วลืมเปลี่ยนเครื่องหมายทุกพจน์ หรือตอบค่า x ทั้งที่โจทย์ถามค่า x + y',
 'If the question asks for x + y or 2x + 2y, try adding the equations first. It often gives the answer without solving for each variable.',

 'Type both equations in Desmos and tap the intersection point.','พิมพ์ทั้งสองสมการใน Desmos แล้วแตะจุดตัด');
L('Linear models and interpretation',
 'In y = mx + b, the slope m is the change in y for each 1-unit increase in x, and b is the value of y when x = 0. In context, say both with units.',
 'ใน y = mx + b ความชัน m คือค่า y ที่เปลี่ยนต่อ x ที่เพิ่มขึ้น 1 หน่วย ส่วน b คือค่า y เมื่อ x = 0 เวลาตอบในโจทย์ให้ใส่หน่วยทั้งสองค่า',
 'Reading the slope as the total instead of the rate, or mixing up which quantity is x and which is y.',
 'ตีความความชันเป็นค่ารวมแทนที่จะเป็นอัตรา หรือสลับว่าตัวไหนคือ x ตัวไหนคือ y',

L('Solving linear equations',
 'Distribute, collect like terms, then isolate the variable. If the variable cancels and the statement is false, there is no solution; if it is true, there are infinitely many.',
 'กระจายวงเล็บ รวมพจน์ที่คล้ายกัน แล้วแยกตัวแปรให้อยู่ลำพัง ถ้าตัวแปรหายไปหมดแล้วประโยคเป็นเท็จ แปลว่าไม่มีคำตอบ ถ้าเป็นจริง แปลว่ามีคำตอบมากมายไม่จำกัด',
 'Dropping a negative when distributing, e.g. −3(x − 2) = −3x + 6, not −3x − 6.',

L('Absolute value equations',

L('Linear functions',

 'ใช้จุดสลับลำดับระหว่างเศษกับส่วน',

 'Name two unknowns, write one equation for the count (items) and one for the value (money), then solve. Check the answer against the story.',

L('Discriminant and number of solutions',

 'Solving for x but forgetting the question wants y or a sum of coordinates.',

L('Quadratic functions: vertex and extremes',

L('Quadratic models',

 'ใช้ร้อยละเป็น 5 แทนที่จะเป็น 0.05 หรือนับจำนวนช่วงผิดหน่วย',
 'Match the exponent to how often the change happens: every 3 years means t/3.',
 'ให้เลขชี้กำลังตรงกับความถี่ของการเปลี่ยนแปลง เช่น ทุก 3 ปีคือ t/3',
 'Type the function and use a table to read values at specific t.','พิมพ์ฟังก์ชันแล้วใช้ตารางอ่านค่าที่ t ที่ต้องการ');
L('Polynomial remainder and factor theorems',
 'The remainder when p(x) is divided by (x − a) is p(a). (x − a) is a factor exactly when p(a) = 0. No long division needed.',
 'เศษเหลือเมื่อหาร p(x) ด้วย (x − a) คือ p(a) และ (x − a) เป็นตัวประกอบก็ต่อเมื่อ p(a) = 0 ไม่ต้องตั้งหารยาว',
 'For (x + 2) you must plug in x = −2, not 2.',
 'ถ้าตัวหารคือ (x + 2) ต้องแทน x = −2 ไม่ใช่ 2',
 'Rewrite the divisor as x − a first so the sign of a is obvious.',
 'เขียนตัวหารให้อยู่ในรูป x − a ก่อน จะเห็นเครื่องหมายของ a ชัดเจน');
L('Radical equations and extraneous solutions',
 'Isolate the radical, square both sides, solve, then check every answer in the original equation. Squaring can create extraneous solutions that do not work.',
 'แยกรากออกมาไว้ข้างเดียว ยกกำลังสองทั้งสองข้าง แก้สมการ แล้วตรวจทุกคำตอบในสมการเดิม การยกกำลังสองอาจสร้างคำตอบเกินที่ใช้ไม่ได้',
 'Forgetting to check. A solution that makes the right side negative cannot equal a square root.',
 'ลืมตรวจคำตอบ คำตอบที่ทำให้ข้างขวาติดลบใช้ไม่ได้ เพราะรากที่สองไม่เป็นลบ',
 'Test each answer choice in the original equation; it is often faster than solving.',
 'ลองแทนตัวเลือกแต่ละข้อในสมการเดิม มักเร็วกว่าการแก้สมการ',
 'Graph both sides as two functions; real solutions are exactly where they cross.','วาดทั้งสองข้างเป็นสองฟังก์ชัน คำตอบจริงคือจุดที่ตัดกันเท่านั้น');
L('Function transformations',
 'f(x − h) + k shifts right h and up k. −f(x) reflects over the x-axis, f(−x) over the y-axis. a·f(x) stretches vertically by a.',
 'f(x − h) + k เลื่อนไปทางขวา h และขึ้น k −f(x) สะท้อนข้ามแกน x f(−x) สะท้อนข้ามแกน y ส่วน a·f(x) ยืดแนวตั้ง a เท่า',
 'The horizontal shift goes the opposite way from the sign: f(x + 2) moves LEFT 2.',
 'การเลื่อนแนวนอนตรงข้ามกับเครื่องหมาย: f(x + 2) เลื่อนไปทางซ้าย 2',
 'Track one point, such as the vertex, through each step.',
 'ติดตามจุดหนึ่งจุด เช่น จุดยอด ผ่านแต่ละขั้นตอน',
 'Graph the original and the transformed function together and compare.','วาดฟังก์ชันเดิมกับฟังก์ชันที่แปลงแล้วคู่กันเพื่อเทียบ');
L('Equivalent expressions',
 'Expand or factor to compare forms. Know (a + b)² = a² + 2ab + b², (a − b)(a + b) = a² − b², and combine like terms carefully.',
 'กระจายหรือแยกตัวประกอบเพื่อเทียบรูปแบบ จำ (a + b)² = a² + 2ab + b² และ (a − b)(a + b) = a² − b² และรวมพจน์คล้ายให้ระมัดระวัง',
 'Writing (a + b)² = a² + b², which leaves out the middle term 2ab.',
 'เขียน (a + b)² = a² + b² ซึ่งขาดพจน์กลาง 2ab',
 'Plug in an easy number such as x = 2 for both the question and each choice. The matching choice is the answer.',
 'แทนค่าง่ายๆ เช่น x = 2 ทั้งในโจทย์และในแต่ละตัวเลือก ตัวเลือกที่ได้ค่าตรงกันคือคำตอบ',
 'Type both expressions; if the graphs overlap exactly they are equivalent.','พิมพ์ทั้งสองนิพจน์ ถ้ากราฟทับกันพอดีแปลว่าเท่ากัน');
L('Function composition',
 'f(g(x)) means put g(x) into f wherever you see x. Work from the inside out; f(g(x)) and g(f(x)) are usually different.',
 'f(g(x)) หมายถึงแทน g(x) ลงใน f ทุกที่ที่เห็น x ทำจากข้างในออกมาข้างนอก และ f(g(x)) กับ g(f(x)) มักไม่เท่ากัน',
 'Doing the outer function first.',
 'ทำฟังก์ชันด้านนอกก่อน',
 'For a number input, compute the inner value first and write it down.',
 'ถ้าโจทย์ให้ตัวเลข ให้คำนวณค่าด้านในก่อนแล้วจดไว้',
 'Define f(x) and g(x), then type f(g(x)).','กำหนด f(x) และ g(x) แล้วพิมพ์ f(g(x))');
L('Exponent rules',
 'aᵐ·aⁿ = aᵐ⁺ⁿ, (aᵐ)ⁿ = aᵐⁿ, a⁻ⁿ = 1/aⁿ, a^(1/n) = ⁿ√a, a⁰ = 1. Convert everything to the same base before you compare exponents.',
 'aᵐ·aⁿ = aᵐ⁺ⁿ, (aᵐ)ⁿ = aᵐⁿ, a⁻ⁿ = 1/aⁿ, a^(1/n) = ⁿ√a, a⁰ = 1 แปลงให้เป็นฐานเดียวกันก่อนเทียบเลขชี้กำลัง',
 'Multiplying exponents when you should add them (same base multiplied) or the reverse.',
 'คูณเลขชี้กำลังทั้งที่ต้องบวก (ฐานเดียวกันคูณกัน) หรือกลับกัน',
 'Write 8 as 2³ and 16 as 2⁴; equal bases mean you can set the exponents equal.',
 'เขียน 8 เป็น 2³ และ 16 เป็น 2⁴ ฐานเท่ากันก็ตั้งเลขชี้กำลังเท่ากันได้');
L('Rational expressions',
 'Factor the numerator and denominator, then cancel common factors. The expression is undefined where the denominator is 0, even after you cancel.',
 'แยกตัวประกอบเศษและส่วน แล้วตัดตัวประกอบร่วม นิพจน์จะไม่นิยามเมื่อส่วนเป็น 0 แม้ตัดกันไปแล้วก็ตาม',
 'Cancelling terms instead of factors: (x + 3)/3 is not x + 1.',
 'ตัดพจน์แทนที่จะตัดตัวประกอบ: (x + 3)/3 ไม่เท่ากับ x + 1',
 'Look for a difference of squares or a common factor first.',
 'มองหากำลังสองต่างกันหรือตัวประกอบร่วมก่อน');
L('Complex numbers',
 'i² = −1. Multiply like binomials, then replace i² with −1. The conjugate of a + bi is a − bi, and (a + bi)(a − bi) = a² + b².',
 'i² = −1 คูณเหมือนทวินาม แล้วแทน i² ด้วย −1 สังยุคของ a + bi คือ a − bi และ (a + bi)(a − bi) = a² + b²',
 'Leaving i² in the answer, or getting the sign wrong in −bi · −di.',
 'ปล่อย i² ไว้ในคำตอบ หรือคิดเครื่องหมายของ −bi · −di ผิด',
 'Real parts first, imaginary parts second, and always write the answer as a + bi.',
 'จัดส่วนจริงก่อน ส่วนจินตภาพทีหลัง และเขียนคำตอบในรูป a + bi เสมอ',
 'Desmos handles i directly: type (3+2i)(1−4i).','Desmos รองรับ i โดยตรง พิมพ์ (3+2i)(1−4i) ได้เลย');
L('Exponential functions in context',
 'In f(t) = a·bᵗ, a is the starting value and b is the growth factor per step. b > 1 grows, 0 < b < 1 decays. Growth of 8% per step means b = 1.08.',
 'ใน f(t) = a·bᵗ ค่า a คือค่าเริ่มต้น และ b คือตัวคูณการเติบโตต่อหนึ่งช่วง b > 1 คือเพิ่ม 0 < b < 1 คือลด เติบโต 8% ต่อช่วงหมายถึง b = 1.08',
 'Reading b = 1.08 as “increases by 1.08” instead of “increases by 8%.”',
 'อ่าน b = 1.08 ว่า “เพิ่มขึ้น 1.08” แทนที่จะเป็น “เพิ่มขึ้น 8%”',
 'Set t = 0 to see the initial value; set t = 1 to see the factor.',
 'แทน t = 0 เพื่อดูค่าเริ่มต้น แทน t = 1 เพื่อดูตัวคูณ');

/* ---------------- Math: Problem-Solving & Data ---------------- */
L('Percentages and percent change',
 'Percent change = (new − old)/old × 100. “Of” means multiply. Successive changes multiply: +20% then −20% is ×1.2 ×0.8 = ×0.96, a 4% drop.',
 'ร้อยละที่เปลี่ยน = (ใหม่ − เก่า)/เก่า × 100 คำว่า “ของ” คือการคูณ การเปลี่ยนต่อเนื่องให้คูณกัน เช่น +20% แล้ว −20% คือ ×1.2 ×0.8 = ×0.96 ลดลง 4%',
 'Dividing by the new value instead of the original.',
 'หารด้วยค่าใหม่แทนที่จะหารด้วยค่าเดิม',
 'Turn percents into multipliers (1.15, 0.85) and chain them.',
 'แปลงร้อยละเป็นตัวคูณ (1.15, 0.85) แล้วคูณต่อกัน');
L('Mean, median and spread',
 'Mean = sum ÷ count. The median is the middle value (average the two middle ones for an even count) and resists outliers. Adding a value far above the rest raises the mean more than the median.',
 'ค่าเฉลี่ย = ผลรวม ÷ จำนวน มัธยฐานคือค่ากลาง (ถ้าจำนวนข้อมูลเป็นคู่ให้เฉลี่ยสองค่ากลาง) และไม่ไวต่อค่าสุดโต่ง การเพิ่มค่าที่สูงกว่าชุดข้อมูลมากจะดันค่าเฉลี่ยขึ้นมากกว่ามัธยฐาน',
 'Not sorting the data before finding the median.',
 'ไม่เรียงข้อมูลก่อนหามัธยฐาน',
 'For “new mean” questions, work with totals: new total = old total + new value.',
 'โจทย์ค่าเฉลี่ยใหม่ ให้คิดจากผลรวม: ผลรวมใหม่ = ผลรวมเก่า + ค่าที่เพิ่ม');
L('Two-way tables and probability',
 'Probability = favorable ÷ total of the group being asked about. For “given that” questions the denominator is only that group, not the whole table.',
 'ความน่าจะเป็น = จำนวนที่สนใจ ÷ จำนวนรวมของกลุ่มที่ถูกถาม ถ้าโจทย์พูดว่า “ในกลุ่มที่…” ตัวหารคือเฉพาะกลุ่มนั้น ไม่ใช่ทั้งตาราง',
 'Dividing by the grand total when the question restricts to a row or column.',
 'หารด้วยผลรวมทั้งตารางทั้งที่โจทย์จำกัดอยู่เฉพาะแถวหรือคอลัมน์',
 'Circle the group named after “of” or “given”; that total is your denominator.',
 'วงกลมกลุ่มที่อยู่หลังคำว่า “ของ” หรือ “ในกลุ่ม” ผลรวมของกลุ่มนั้นคือตัวหาร');
L('Weighted averages',
 'Weighted mean = (value₁ × weight₁ + value₂ × weight₂ + …) ÷ total weight. It sits closer to the value with the larger weight.',
 'ค่าเฉลี่ยถ่วงน้ำหนัก = (ค่า₁ × น้ำหนัก₁ + ค่า₂ × น้ำหนัก₂ + …) ÷ น้ำหนักรวม จะอยู่ใกล้ค่าที่มีน้ำหนักมากกว่า',
 'Averaging the values without the weights.',
 'เฉลี่ยค่าโดยไม่ใช้น้ำหนัก',
 'Sanity check: the answer must lie between the smallest and largest value.',
 'ตรวจสอบเบื้องต้น: คำตอบต้องอยู่ระหว่างค่าที่น้อยที่สุดและมากที่สุด');
L('Rates and unit conversion',
 'Multiply by conversion factors written as fractions so unwanted units cancel. Squared or cubed units need the factor squared or cubed.',
 'คูณด้วยตัวคูณแปลงหน่วยที่เขียนเป็นเศษส่วนเพื่อให้หน่วยที่ไม่ต้องการตัดกันไป หน่วยกำลังสองหรือกำลังสามต้องยกกำลังตัวคูณด้วย',
 'Converting once when the unit is squared (square feet to square meters needs the factor twice).',
 'แปลงเพียงครั้งเดียวทั้งที่หน่วยเป็นกำลังสอง (ตารางฟุตเป็นตารางเมตรต้องใช้ตัวคูณสองครั้ง)',
 'Write units in every step. If the units on the answer are right, the arithmetic is usually right.',
 'เขียนหน่วยในทุกบรรทัด ถ้าหน่วยของคำตอบถูก การคำนวณมักถูกด้วย');
L('Models from scatterplots',
 'The line of best fit is y = mx + b. Its slope is the predicted change in y per 1 unit of x. Residual = actual − predicted. Predict only inside the range of the data.',
 'เส้นแนวโน้มคือ y = mx + b ความชันคือค่า y ที่คาดว่าจะเปลี่ยนต่อ x หนึ่งหน่วย ส่วนต่าง (residual) = ค่าจริง − ค่าที่ทำนาย และทำนายได้เฉพาะภายในช่วงของข้อมูล',
 'Reading a slope as causation, or extrapolating far outside the data.',
 'ตีความความชันเป็นเหตุและผล หรือทำนายไกลเกินช่วงของข้อมูลมาก',
 'Count points above and below the line to judge a good fit; about half on each side.',
 'นับจุดเหนือและใต้เส้นเพื่อตัดสินว่าเส้นเหมาะสมหรือไม่ ควรอยู่สองข้างพอๆ กัน',
 'Enter the points as a table and type y1 ~ mx1 + b for the regression.','ใส่จุดเป็นตารางแล้วพิมพ์ y1 ~ mx1 + b เพื่อหาเส้นถดถอย');
L('Standard deviation',
 'Standard deviation measures how spread out data is around the mean. A data set with values farther from the mean has a larger standard deviation, even when two sets have the same mean.',
 'ส่วนเบี่ยงเบนมาตรฐานวัดความกระจายของข้อมูลรอบค่าเฉลี่ย ชุดข้อมูลที่ค่าอยู่ไกลจากค่าเฉลี่ยมากกว่าจะมี SD มากกว่า แม้ค่าเฉลี่ยจะเท่ากัน',
 'Thinking the larger mean means the larger standard deviation.',
 'คิดว่าค่าเฉลี่ยมากกว่าแปลว่า SD มากกว่า',
 'You never need to calculate it on the SAT; compare how far values sit from the center.',
 'ใน SAT ไม่ต้องคำนวณ SD ให้เทียบว่าค่าต่างๆ อยู่ห่างจากศูนย์กลางมากแค่ไหน',
 'Type stdev([list]) if you must compare numerically.','พิมพ์ stdev([รายการ]) ถ้าต้องเปรียบเทียบเป็นตัวเลข');
L('Inference and margin of error',
 'A confidence interval is estimate ± margin of error. Results from a random sample generalize to the population it was drawn from; random assignment in an experiment supports cause and effect.',
 'ช่วงความเชื่อมั่นคือค่าประมาณ ± margin of error ผลจากการสุ่มตัวอย่างขยายไปสู่ประชากรที่สุ่มมาได้ ส่วนการสุ่มจัดกลุ่มในการทดลองสนับสนุนความเป็นเหตุเป็นผล',
 'Generalizing to a bigger population than the sample came from, or claiming cause from a survey.',
 'สรุปไปยังประชากรที่ใหญ่กว่าที่สุ่มมา หรือสรุปเหตุและผลจากแบบสำรวจ',
 'Ask two questions: how was the sample chosen, and who is the conclusion about?',
 'ถามสองข้อ: เลือกตัวอย่างอย่างไร และข้อสรุปพูดถึงใคร');

/* ---------------- Math: Geometry and Trigonometry ---------------- */
L('Circles in the coordinate plane',
 '(x − h)² + (y − k)² = r² has center (h, k) and radius r. For x² + y² + bx + cy + d = 0, complete the square to find the center and radius.',
 '(x − h)² + (y − k)² = r² มีจุดศูนย์กลาง (h, k) และรัศมี r สำหรับ x² + y² + bx + cy + d = 0 ให้ทำกำลังสองสมบูรณ์เพื่อหาจุดศูนย์กลางและรัศมี',
 'Giving r² as the radius, or the center with flipped signs.',
 'ตอบ r² เป็นรัศมี หรือตอบจุดศูนย์กลางที่เครื่องหมายสลับกัน',
 'Half the x-coefficient gives h (with the opposite sign); same for y.',
 'ครึ่งหนึ่งของสัมประสิทธิ์ x ให้ค่า h (เครื่องหมายตรงข้าม) y ก็เช่นกัน',
 'Type the equation and Desmos draws the circle; tap the center.','พิมพ์สมการ Desmos จะวาดวงกลม แล้วแตะที่จุดศูนย์กลาง');
L('Right triangle trigonometry',
 'sin = opposite/hypotenuse, cos = adjacent/hypotenuse, tan = opposite/adjacent. For complementary angles, sin(x) = cos(90° − x).',
 'sin = ด้านตรงข้าม/ด้านตรงข้ามมุมฉาก (ด้านยาวสุด) cos = ด้านประชิด/ด้านตรงข้ามมุมฉาก tan = ด้านตรงข้าม/ด้านประชิด และสำหรับมุมที่รวมกันได้ 90° จะได้ sin(x) = cos(90° − x)',
 'Mixing up opposite and adjacent because the triangle is drawn upside down.',
 'สลับด้านตรงข้ามกับด้านประชิดเพราะรูปสามเหลี่ยมวาดกลับหัว',
 'Label the sides from the angle you are using: opposite, adjacent, hypotenuse.',
 'ติดป้ายด้านจากมุมที่ใช้: ตรงข้าม ประชิด และด้านตรงข้ามมุมฉาก',
 'Set the calculator to degree mode for sin and cos of degrees.','ตั้งเครื่องคิดเลขเป็นโหมดองศาเมื่อใช้ sin และ cos ของมุมเป็นองศา');
L('Similar figures',
 'Similar shapes have equal angles and proportional sides. Match corresponding sides in the same order. Scale factor k multiplies lengths by k, areas by k², volumes by k³.',
 'รูปคล้ายมีมุมเท่ากันและด้านเป็นสัดส่วนกัน จับคู่ด้านที่สมนัยกันตามลำดับเดียวกัน ตัวคูณ k คูณความยาวด้วย k พื้นที่ด้วย k² และปริมาตรด้วย k³',
 'Setting up the proportion with sides from different positions in each triangle.',
 'ตั้งสัดส่วนโดยใช้ด้านที่ตำแหน่งไม่ตรงกันในแต่ละสามเหลี่ยม',
 'Write “small / big = small / big” and keep the same order on both sides.',
 'เขียนในรูป “เล็ก / ใหญ่ = เล็ก / ใหญ่” และรักษาลำดับเดียวกันทั้งสองข้าง');
L('Arc length, sectors and radians',
 'Arc length = (θ/360)·2πr and sector area = (θ/360)·πr² with θ in degrees. With θ in radians: arc = rθ and area = ½r²θ.',
 'ความยาวส่วนโค้ง = (θ/360)·2πr และพื้นที่เซกเตอร์ = (θ/360)·πr² เมื่อ θ เป็นองศา ถ้า θ เป็นเรเดียน ความยาวส่วนโค้ง = rθ และพื้นที่ = ½r²θ',
 'Using the diameter in place of the radius.',
 'ใช้เส้นผ่านศูนย์กลางแทนรัศมี',
 'Find the fraction of the circle (θ/360) first, then multiply it by the whole circle’s value.',
 'หาสัดส่วนของวงกลม (θ/360) ก่อน แล้วคูณกับค่าของวงกลมทั้งวง');
L('Volume and scaling',
 'If every length is multiplied by k, volume is multiplied by k³ and surface area by k². Doubling the radius of a sphere makes the volume 8 times larger.',
 'ถ้าความยาวทุกด้านคูณด้วย k ปริมาตรจะคูณด้วย k³ และพื้นที่ผิวคูณด้วย k² เมื่อรัศมีทรงกลมเป็นสองเท่า ปริมาตรจะเป็น 8 เท่า',
 'Scaling the volume by k instead of k³.',
 'คูณปริมาตรด้วย k แทนที่จะเป็น k³',
 'Keep the exact formula only if needed; usually the ratio is all you need.',
 'ใช้สูตรเต็มเมื่อจำเป็นเท่านั้น โดยมากแค่หาอัตราส่วนก็พอ');
L('Radians and degrees',
 'π radians = 180°. Degrees to radians: multiply by π/180. Radians to degrees: multiply by 180/π. Common values: π/6 = 30°, π/4 = 45°, π/3 = 60°, π/2 = 90°.',
 'π เรเดียน = 180° แปลงองศาเป็นเรเดียนโดยคูณ π/180 แปลงเรเดียนเป็นองศาโดยคูณ 180/π ค่าที่พบบ่อย: π/6 = 30°, π/4 = 45°, π/3 = 60°, π/2 = 90°',
 'Multiplying by the wrong fraction. Check: 180° must become π, not a huge number.',
 'คูณด้วยเศษส่วนผิดข้าง ตรวจสอบ: 180° ต้องเป็น π ไม่ใช่เลขใหญ่โต',
 'If the answer should be a multiple of π, leave it as a fraction of π.',
 'ถ้าคำตอบควรเป็นจำนวนเท่าของ π ให้ทิ้งไว้เป็นเศษส่วนของ π');
L('Pythagorean theorem',
 'In a right triangle a² + b² = c², where c is the hypotenuse. Memorize the triples 3-4-5, 5-12-13, 8-15-17, 7-24-25 and their multiples.',
 'ในสามเหลี่ยมมุมฉาก a² + b² = c² เมื่อ c คือด้านตรงข้ามมุมฉาก จำชุดเลข 3-4-5, 5-12-13, 8-15-17, 7-24-25 และพหุคูณของมัน',
 'Adding the squares when you are solving for a leg (you must subtract).',
 'บวกกำลังสองทั้งที่กำลังหาด้านประกอบมุมฉาก (ต้องลบ)',
 'If two sides are 6 and 8, the third is 10 immediately: it is 3-4-5 doubled.',
 'ถ้าสองด้านคือ 6 และ 8 ด้านที่สามคือ 10 ทันที เพราะเป็น 3-4-5 คูณสอง');
L('Circle theorems',
 'An inscribed angle is half its intercepted arc (and half the central angle on the same arc). A tangent is perpendicular to the radius at the point of tangency. An angle inscribed in a semicircle is 90°.',
 'มุมในส่วนโค้งของวงกลมเท่ากับครึ่งหนึ่งของส่วนโค้งที่รองรับ (และครึ่งหนึ่งของมุมที่จุดศูนย์กลางบนส่วนโค้งเดียวกัน) เส้นสัมผัสตั้งฉากกับรัศมีที่จุดสัมผัส และมุมในครึ่งวงกลมเท่ากับ 90°',
 'Using the full arc measure as the inscribed angle.',
 'ใช้ขนาดของส่วนโค้งเต็มเป็นขนาดของมุมในส่วนโค้ง',
 'Draw the radius to the tangent point; the right angle usually unlocks the problem.',
 'ลากรัศมีไปยังจุดสัมผัส มุมฉากที่ได้มักเป็นกุญแจของโจทย์');
L('Angles in triangles',
 'Interior angles add to 180°. An exterior angle equals the sum of the two remote interior angles. In an isosceles triangle the angles opposite equal sides are equal.',
 'มุมภายในรวมกันได้ 180° มุมภายนอกเท่ากับผลบวกของมุมภายในสองมุมที่ไม่ประชิด และในสามเหลี่ยมหน้าจั่ว มุมตรงข้ามด้านที่เท่ากันจะเท่ากัน',
 'Forgetting that the three angles written with x all count, then solving for x but answering with the angle.',
 'ลืมบวกมุมทั้งสามที่เขียนด้วย x แล้วหา x ได้แต่ตอบเป็นค่า x ทั้งที่โจทย์ถามขนาดมุม',
 'Re-read the last line: does it ask for x or for the angle measure?',
 'อ่านบรรทัดสุดท้ายซ้ำ: โจทย์ถามค่า x หรือขนาดของมุม');

/* ---------------- R&W: Standard English Conventions ---------------- */
L('Subject-verb agreement',
 'The verb agrees with its subject, not with the nearest noun. Cross out the phrase between them: “The box of tools [is / are] …” The subject is “box,” so use “is.”',
 'กริยาต้องสอดคล้องกับประธาน ไม่ใช่คำนามที่อยู่ใกล้ที่สุด ให้ขีดฆ่าวลีที่คั่นอยู่: “The box of tools [is / are] …” ประธานคือ “box” จึงใช้ “is”',
 'Letting a plural noun inside “of …” or “in …” pull the verb into the plural.',
 'ปล่อยให้คำนามพหูพจน์ในวลี “of …” หรือ “in …” ดึงกริยาไปเป็นพหูพจน์',
 'Find the subject first, then decide singular or plural.',
 'หาประธานก่อน แล้วจึงตัดสินว่าเอกพจน์หรือพหูพจน์');
L('Pronoun-antecedent agreement',
 'A pronoun matches the noun it replaces in number. A company, museum or team is singular (“it,” “its”); several people are plural (“they,” “their”).',
 'สรรพนามต้องตรงกับคำนามที่แทนในเรื่องจำนวน บริษัท พิพิธภัณฑ์ หรือทีมเป็นเอกพจน์ (“it,” “its”) ส่วนคนหลายคนเป็นพหูพจน์ (“they,” “their”)',
 'Using “they” for an organization because it contains many people.',
 'ใช้ “they” กับองค์กรเพราะมีคนหลายคนอยู่ในนั้น',
 'Ask: what exactly does the pronoun point back to?',
 'ถามตัวเองว่า สรรพนามนี้ชี้กลับไปที่อะไรกันแน่');
L('Possessives and plurals',
 'Plural: no apostrophe (the dogs). Singular possessive: ’s (the dog’s bone). Plural possessive: s’ (the dogs’ bones). Its (belonging to it) has no apostrophe; it’s means it is.',
 'พหูพจน์ไม่ใช้ apostrophe (the dogs) เจ้าของเอกพจน์ใช้ ’s (the dog’s bone) เจ้าของพหูพจน์ใช้ s’ (the dogs’ bones) คำว่า its (ของมัน) ไม่มี apostrophe ส่วน it’s คือ it is',
 'Adding an apostrophe to make a plural.',
 'ใส่ apostrophe เพื่อทำให้เป็นพหูพจน์',
 'Replace it’s with “it is.” If the sentence breaks, you need its.',
 'ลองแทน it’s ด้วย “it is” ถ้าประโยคเพี้ยน แสดงว่าต้องใช้ its');
L('Commas with nonessential phrases',
 'Set off extra information (an appositive or a clause you could delete) with a pair of commas or none; never just one. Essential information gets no commas.',
 'ข้อมูลเสริมที่ตัดออกได้ (appositive หรืออนุประโยค) ให้ใส่ comma คู่หนึ่งหรือไม่ใส่เลย ห้ามใส่ตัวเดียว ส่วนข้อมูลที่จำเป็นไม่ต้องมี comma',
 'Using a single comma between a subject and its verb, or only one comma around the phrase.',
 'ใส่ comma ตัวเดียวคั่นระหว่างประธานกับกริยา หรือใส่ comma เพียงข้างเดียวของวลี',
 'Delete the phrase. If the sentence still works, it is nonessential: wrap it in commas.',
 'ลองตัดวลีทิ้ง ถ้าประโยคยังสมบูรณ์ แปลว่าเป็นข้อมูลเสริม ให้ใส่ comma ครอบทั้งสองข้าง');
L('Modifier placement',
 'A modifying phrase at the start of a sentence must describe the noun right after the comma. “Walking to school, the rain started” is wrong: the rain was not walking.',
 'วลีขยายที่อยู่ต้นประโยคต้องขยายคำนามที่ตามหลัง comma ทันที “Walking to school, the rain started” ผิด เพราะฝนไม่ได้เดิน',
 'Choosing the answer that sounds fine but puts the wrong noun next to the modifier.',
 'เลือกตัวเลือกที่ฟังดูดี แต่วางคำนามผิดไว้ติดกับวลีขยาย',
 'Ask who or what is doing the action in the opening phrase, then make that the subject.',
 'ถามว่าใครหรืออะไรเป็นผู้ทำในวลีต้นประโยค แล้วให้สิ่งนั้นเป็นประธาน');
L('Parallel structure',
 'Items in a list or comparison need the same grammatical form: “running, swimming, and cycling,” not “running, swimming, and to cycle.”',
 'รายการหรือการเปรียบเทียบต้องใช้รูปไวยากรณ์เดียวกัน: “running, swimming, and cycling” ไม่ใช่ “running, swimming, and to cycle”',
 'Fixing only the last item and leaving a mismatch earlier in the list.',
 'แก้เฉพาะรายการสุดท้ายแล้วปล่อยให้รายการก่อนหน้าไม่สอดคล้อง',
 'Read the first item and copy its pattern onto the others.',
 'อ่านรายการแรก แล้วคัดลอกรูปแบบนั้นไปใช้กับรายการอื่น');
L('Verb tense and time',
 'Choose the tense that fits the time clues: “last year” needs past, “by next June” needs future perfect, “has” and “since 2010” need present perfect. Keep tenses consistent within a time frame.',
 'เลือก tense ให้ตรงกับคำบอกเวลา: “last year” ใช้อดีต “by next June” ใช้ future perfect “since 2010” ใช้ present perfect และต้องใช้ tense สอดคล้องกันในกรอบเวลาเดียวกัน',
 'Switching tense in the middle of a sequence for no reason.',
 'เปลี่ยน tense กลางเรื่องโดยไม่มีเหตุผล',
 'Underline the time words in the sentence before you look at the choices.',
 'ขีดเส้นใต้คำบอกเวลาในประโยคก่อนดูตัวเลือก');
L('Boundaries',
 'Two complete sentences need a period, a semicolon, or a comma plus FANBOYS (for, and, nor, but, or, yet, so). A colon comes after a complete sentence and introduces a list or explanation.',
 'ประโยคสมบูรณ์สองประโยคต้องคั่นด้วยจุด semicolon หรือ comma ตามด้วย FANBOYS (for, and, nor, but, or, yet, so) ส่วน colon ตามหลังประโยคสมบูรณ์เพื่อนำรายการหรือคำอธิบาย',
 'A comma alone between two sentences (comma splice) or no punctuation at all (run-on).',
 'ใช้ comma ตัวเดียวคั่นสองประโยค (comma splice) หรือไม่ใส่เครื่องหมายเลย (run-on)',
 'Test each side of the blank: can it stand alone as a sentence? Both yes, use ; or . Only the first yes, use : or a dash.',
 'ทดสอบสองข้างของช่องว่าง ว่าอยู่ลำพังเป็นประโยคได้ไหม ถ้าได้ทั้งสองข้างใช้ ; หรือ . ถ้าได้ข้างหน้าอย่างเดียวใช้ : หรือขีด');
L('Usage and agreement',
 'Watch commonly confused words: affect (verb) and effect (noun), than and then, fewer (countable) and less (uncountable), who (subject) and whom (object), whose and who’s.',
 'ระวังคำที่สับสนบ่อย: affect (กริยา) กับ effect (นาม) than กับ then fewer (นับได้) กับ less (นับไม่ได้) who (ประธาน) กับ whom (กรรม) whose กับ who’s',
 'Choosing a word because it “sounds right.” These pairs sound alike but work differently.',
 'เลือกคำเพราะ “ฟังดูถูก” คู่คำเหล่านี้เสียงคล้ายกันแต่หน้าที่ต่างกัน',
 'Substitute he/him: if “he” fits, use who; if “him” fits, use whom.',
 'ลองแทนด้วย he/him ถ้าใช้ “he” ได้ให้ใช้ who ถ้าใช้ “him” ได้ให้ใช้ whom');

/* ---------------- R&W: Craft, Ideas, Expression ---------------- */
L('Words in context',
 'Use the clues in the sentence to predict a word BEFORE you look at the choices. Contrast words (although, but, yet) flip the meaning; support words (and, so, because) keep it.',
 'ใช้เบาะแสในประโยคเพื่อเดาคำก่อนดูตัวเลือก คำที่แสดงความขัดแย้ง (although, but, yet) จะกลับความหมาย ส่วนคำที่แสดงการสนับสนุน (and, so, because) รักษาความหมายเดิม',
 'Picking a word that is a real definition of the word but does not fit this sentence.',
 'เลือกคำที่เป็นความหมายจริงของคำนั้น แต่ไม่เข้ากับประโยคนี้',
 'Put your predicted word into the blank, then choose the choice closest to it in meaning.',
 'ใส่คำที่คุณเดาไว้ในช่องว่าง แล้วเลือกตัวเลือกที่ความหมายใกล้ที่สุด');
L('Text structure and purpose',
 'Ask what the text DOES, not what it is about: introduces, challenges, illustrates, contrasts, explains. The answer is a verb plus the specific content.',
 'ให้ถามว่าข้อความ “ทำอะไร” ไม่ใช่ “เกี่ยวกับอะไร” เช่น แนะนำ ท้าทาย ยกตัวอย่าง เปรียบต่าง อธิบาย คำตอบคือกริยาตามด้วยเนื้อหาเฉพาะ',
 'Picking an answer that is true about the topic but does not describe how the passage is built.',
 'เลือกคำตอบที่จริงเกี่ยวกับหัวข้อ แต่ไม่ได้อธิบายโครงสร้างของข้อความ',
 'Summarize each sentence in two or three words, then see how those pieces connect.',
 'สรุปแต่ละประโยคเป็นสองสามคำ แล้วดูว่าชิ้นส่วนเหล่านั้นเชื่อมกันอย่างไร');
L('Cross-text connections',
 'Read Text 1 for its claim, then ask how the author of Text 2 would respond: agree, add nuance, or disagree. Stay with what each author actually says.',
 'อ่านข้อความที่ 1 เพื่อจับข้อเรียกร้อง แล้วถามว่าผู้เขียนข้อความที่ 2 จะตอบอย่างไร เห็นด้วย เพิ่มความละเอียด หรือคัดค้าน ยึดสิ่งที่ผู้เขียนแต่ละคนพูดจริงๆ',
 'Choosing an answer that is extreme (“completely rejects”) when Text 2 only adds a limit.',
 'เลือกคำตอบที่รุนแรงเกินไป (“ปฏิเสธทั้งหมด”) ทั้งที่ข้อความที่ 2 เพียงเพิ่มข้อจำกัด',
 'Write one line for each text’s main point before reading the choices.',
 'เขียนใจความหลักของแต่ละข้อความอย่างละหนึ่งบรรทัดก่อนอ่านตัวเลือก');
L('Central ideas and details',
 'The main idea covers the whole passage, not one detail. Wrong answers are usually too narrow (one detail), too broad, or true but not stated.',
 'ใจความหลักครอบคลุมทั้งข้อความ ไม่ใช่รายละเอียดเดียว ตัวเลือกที่ผิดมักแคบเกินไป (รายละเอียดเดียว) กว้างเกินไป หรือจริงแต่ไม่ได้กล่าวไว้',
 'Choosing a choice that repeats a striking detail from the middle of the passage.',
 'เลือกตัวเลือกที่ซ้ำรายละเอียดเด่นๆ ตรงกลางข้อความ',
 'The first and last sentences often carry the main point; check that your choice fits both.',
 'ประโยคแรกและประโยคสุดท้ายมักมีใจความหลัก ตรวจว่าตัวเลือกของคุณเข้ากับทั้งสองประโยค');
L('Inferences',
 'The answer must follow from the text with no leaps. Find the sentence that gives the clue and choose the option that is certain given that clue.',
 'คำตอบต้องตามมาจากข้อความโดยไม่ต้องเดาเกินไป หาประโยคที่เป็นเบาะแส แล้วเลือกตัวเลือกที่แน่นอนเมื่อมีเบาะแสนั้น',
 'Picking something that is plausible in real life but not supported by the passage.',
 'เลือกสิ่งที่เป็นไปได้ในชีวิตจริงแต่ไม่มีข้อความสนับสนุน',
 'Ask: would I bet money this is true based only on the words given?',
 'ถามตัวเองว่า ถ้าอาศัยเฉพาะคำที่ให้มา กล้าเดิมพันไหมว่าข้อนี้จริง');
L('Command of evidence',
 'First identify exactly what the claim says. The correct evidence directly supports (or weakens) that specific claim. For tables and graphs, find the numbers that match what the claim compares.',
 'ก่อนอื่นให้ระบุให้ชัดว่าข้อกล่าวอ้างพูดว่าอะไร หลักฐานที่ถูกต้องต้องสนับสนุน (หรือลดน้ำหนัก) ข้อกล่าวอ้างนั้นโดยตรง ส่วนตารางและกราฟให้หาตัวเลขที่ตรงกับสิ่งที่ข้อกล่าวอ้างเปรียบเทียบ',
 'Choosing evidence that is related to the topic but does not test the claim.',
 'เลือกหลักฐานที่เกี่ยวกับหัวข้อ แต่ไม่ได้พิสูจน์ข้อกล่าวอ้าง',
 'Check every part of the claim: subject, comparison, and direction (higher/lower).',
 'ตรวจทุกส่วนของข้อกล่าวอ้าง: ผู้ถูกกล่าวถึง การเปรียบเทียบ และทิศทาง (มากกว่า/น้อยกว่า)');
L('Transitions',
 'Name the relationship between the two sentences first: contrast (However), result (Therefore), example (For instance), addition (Moreover, Also), sequence (Then, Finally). Then choose the word.',
 'ระบุความสัมพันธ์ระหว่างสองประโยคก่อน: ขัดแย้ง (However) ผลลัพธ์ (Therefore) ตัวอย่าง (For instance) เพิ่มเติม (Moreover, Also) ลำดับ (Then, Finally) แล้วจึงเลือกคำเชื่อม',
 'Choosing “However” whenever the sentences are about different things, even when no contrast exists.',
 'เลือก “However” ทุกครั้งที่สองประโยคพูดเรื่องต่างกัน ทั้งที่ไม่ได้ขัดแย้งกัน',
 'Cover the transition and say the relationship in plain words: “but,” “so,” “for example.”',

/* Math questions where a calculator route is usually faster (shown as a badge) */
const DESMOS_SKILLS=new Set(Object.keys(LESSONS).filter(k=>LESSONS[k].desmos));

/* ===== engine: state, no-repeat scheduler, sessions, scoring, plan ===== */
const WINDOW=30;                 // a question is locked out for the next 29 sessions
const LS_KEY='satforge.v1';
const DOMAIN_LABEL={algebra:'Algebra',advmath:'Advanced Math',data:'Problem-Solving & Data',geometry:'Geometry & Trig',craft:'Craft & Structure',ideas:'Information & Ideas',conventions:'Standard English Conventions',expression:'Expression of Ideas'};
const DOM_SEC={algebra:'math',advmath:'math',data:'math',geometry:'math',craft:'rw',ideas:'rw',conventions:'rw',expression:'rw'};
const MIX={math:{algebra:.35,advmath:.35,data:.15,geometry:.15},rw:{craft:.27,ideas:.26,conventions:.26,expression:.21}};
const DIFF_PLAN={m1:[.30,.45,.25],hard:[.05,.30,.65],easy:[.40,.50,.10],mixed:[.20,.45,.35],hardonly:[0,.25,.75],easyonly:[.55,.40,.05]};
const GEN_SKILLS={craft:['Words in context','Text structure and purpose','Cross-text connections'],ideas:['Central ideas and details','Inferences','Command of evidence'],expression:['Transitions','Rhetorical synthesis'],conventions:['Boundaries','Usage and agreement']};
const MODULE={rw:{n:27,sec:32*60},math:{n:22,sec:35*60}};
const PACE={rw:70,math:95};
const SPACING=[1,7,30];           // mistake bank: days until the next retry

function defaults(){return {v:2,sess:0,hist:{},stats:{},log:[],errors:[],answers:[],cards:{},bad:[],days:{},prior:{},diag:null,qotd:{},reasons:{},mastered:0,vocabMiss:{},
  prefs:{lang:'en',theme:'auto',testDate:'2026-12-05',target:1500,drillSize:20,timed:true,font:'serif',fontScale:1,lastRW:null,lastMath:null,onboarded:false},updatedAt:0}}
let S=defaults();
function loadAll(){
  try{const j=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(j&&(j.v===1||j.v===2))S=Object.assign(defaults(),j,{v:2,prefs:Object.assign(defaults().prefs,j.prefs||{})})}catch(e){}
  S.errors.forEach(e=>{if(e.due===undefined){e.step=0;e.due=Date.now();e.fails=1}});
}
function save(){S.updatedAt=Date.now();try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}

/* ---------- helpers ---------- */
const hashStr=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
let SEEDED=null;                 // {code,n} while building a challenge / question of the day
const rnd=()=>SEEDED?(SEEDED.n++,makeRng(hashStr(SEEDED.code+':'+SEEDED.n))):makeRng((Math.random()*4294967296)>>>0);
let R=makeRng((Math.random()*4294967296)>>>0);
function allocate(n,shares){
  const keys=Object.keys(shares),raw=keys.map(k=>shares[k]*n),base=raw.map(Math.floor);
  let left=n-base.reduce((a,b)=>a+b,0);
  const order=raw.map((v,i)=>[v-Math.floor(v),i]).sort((a,b)=>b[0]-a[0]);
  for(let i=0;i<left;i++)base[order[i%order.length][1]]++;
  const out={};keys.forEach((k,i)=>out[k]=base[i]);return out;
}
function diffSlots(n,plan){
  const c=allocate(n,{1:plan[0],2:plan[1],3:plan[2]});
  const arr=[];for(const d of [1,2,3])for(let i=0;i<c[d];i++)arr.push(d);return arr;
}
function eligible(id,sess){if(SEEDED)return true;const l=S.hist[id];return l===undefined||sess-l>=WINDOW}
function pruneHist(sess){for(const id in S.hist)if(sess-S.hist[id]>=WINDOW)delete S.hist[id]}
function finalize(q,meta){
  const out=Object.assign({},q,meta);
  for(const k of ['stem','expl','explTh','passage'])if(out[k])out[k]=fixMinus(out[k]);
  if(out.choices)out.choices=out.choices.map(fixMinus);
  if(out.ansText)out.ansText=fixMinus(out.ansText);
  return out;
}
function shuffleChoices(q){
  const idx=R.shuffle([0,1,2,3]);
  return Object.assign({},q,{choices:idx.map(i=>q.choices[i]),answer:idx.indexOf(q.answer)});
}

/* ---------- picking questions ---------- */
function tryTemplate(t,diff,sess,used){
  const d=t.diffs.includes(diff)?diff:t.diffs.reduce((a,b)=>Math.abs(b-diff)<Math.abs(a-diff)?b:a);
  for(let i=0;i<30;i++){
    let q;try{q=t.gen(rnd(),d)}catch(e){continue}
    const id=t.id+':'+q.key;
    if(used.has(id)||!eligible(id,sess))continue;
    return finalize(q,{id,section:t.section,domain:t.domain,skill:t.skill,diff:q.diff||d,time:t.time,src:'gen'});
  }
  return null;
}
function templatesFor(section,domain,skills){
  const list=section==='math'?MATH:RWT;
  return list.filter(t=>(!domain||t.domain===domain)&&(!skills||skills.includes(t.skill)));
}
function bankFor(section,domain,diff,sess,used,skills){
  const all=BANK.filter(q=>q.section===section&&(!domain||q.domain===domain)&&(SEEDED||!S.bad.includes(q.id))&&!used.has(q.id)&&eligible(q.id,sess)&&(!skills||skills.includes(q.skill)));
  if(!all.length)return null;
  const best=Math.min(...all.map(q=>Math.abs(q.diff-diff)));
  const pickFrom=all.filter(q=>Math.abs(q.diff-diff)===best);
  const q=R.pick(pickFrom);
  return finalize(shuffleChoices(q),{});
}
function pickOne(section,domain,diff,sess,used,skills){
  if(section==='math'){
    const tpls=templatesFor('math',domain,skills);
    const pref=tpls.filter(t=>t.diffs.includes(diff));
    const order=R.shuffle(pref).concat(R.shuffle(tpls.filter(t=>!pref.includes(t))));
    for(const t of order){const q=tryTemplate(t,diff,sess,used);if(q)return {q,short:false}}
    return {q:null,short:false};
  }
  const tpls=templatesFor('rw',domain,skills);
  const useGen=tpls.length>0&&R.bool(0.7);
  if(useGen){for(const t of R.shuffle(tpls)){const q=tryTemplate(t,diff,sess,used);if(q)return {q,short:false}}}
  const b=bankFor('rw',domain,diff,sess,used,skills);
  if(b)return {q:b,short:false};
  if(!useGen){for(const t of R.shuffle(tpls)){const q=tryTemplate(t,diff,sess,used);if(q)return {q,short:false}}}
  if(skills)return {q:null,short:false};
  for(const dm of R.shuffle(['craft','ideas','expression'].filter(x=>x!==domain))){
    const b2=bankFor('rw',dm,diff,sess,used,null);if(b2)return {q:b2,short:true};
  }
  for(const t of R.shuffle(RWT)){const q=tryTemplate(t,diff,sess,used);if(q)return {q,short:true}}
  return {q:null,short:true};
}
/* build a module of n questions; returns {questions, short}. opts.seed makes it reproducible and exempt from the no-repeat window */
function buildModule(section,n,planName,sess,used,opts={}){
  const savedR=R;
  if(opts.seed){SEEDED={code:String(opts.seed).toUpperCase(),n:0};R=makeRng(hashStr(SEEDED.code))}
  try{
    const plan=DIFF_PLAN[planName]||DIFF_PLAN.mixed;
    const diffs=diffSlots(n,plan);
    let domains=[];
    if(opts.domain){domains=diffs.map(()=>opts.domain)}
    else{
      const c=allocate(n,MIX[section]);
      for(const d in c)for(let i=0;i<c[d];i++)domains.push(d);
      domains=R.shuffle(domains);
    }
    const qs=[];let short=0;
    for(let i=0;i<n;i++){
      const r=pickOne(section,domains[i],diffs[i],sess,used,opts.skills);
      if(r.q){used.add(r.q.id);qs.push(r.q);if(r.short)short++}
    }
    qs.sort((a,b)=>a.diff-b.diff||R.f()-.5);
    if(!opts.seed)qs.forEach(q=>{S.hist[q.id]=sess});
    return {questions:qs,short};
  }finally{if(opts.seed){SEEDED=null;R=savedR}}
}
function newSessionIndex(){S.sess+=1;pruneHist(S.sess);return S.sess}

/* ---------- pool health ---------- */
function eligibleCount(section,domain){
  const sess=S.sess+1;
  return BANK.filter(q=>q.section===section&&(!domain||q.domain===domain)&&!S.bad.includes(q.id)&&eligible(q.id,sess)).length;
}
function readingNeeded(){return eligibleCount('rw','craft')+eligibleCount('rw','ideas')+eligibleCount('rw','expression')}

/* ---------- dates, streaks ---------- */
const pad2=n=>String(n).padStart(2,'0');
const dayKey=(d=new Date())=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
function dayRec(k=dayKey()){return S.days[k]||(S.days[k]={n:0,c:0,kinds:[]})}
function streak(){
  let d=new Date(),k=dayKey(d),n=0;
  if(!(S.days[k]&&S.days[k].n>=5))d.setDate(d.getDate()-1);
  for(;;){const r=S.days[dayKey(d)];if(r&&r.n>=5){n++;d.setDate(d.getDate()-1)}else break}
  return n;
}
function daysUntil(dateStr){
  const t=new Date(dateStr+'T00:00:00+07:00').getTime();
  return Math.ceil((t-Date.now())/86400000);
}

/* ---------- recording answers ---------- */
function recordAnswer(q,ok,sec,picked,sessIdx){
  const k=q.section+'|'+q.skill;
  const st=S.stats[k]||(S.stats[k]={a:0,c:0,t:0,sec:q.section,domain:q.domain,skill:q.skill});
  st.a++;if(ok)st.c++;st.t+=Math.min(sec,600);
  st.tt=(st.tt||0)+1;      // answers with a time sample
  S.answers.push({s:q.section,d:q.diff,ok:ok?1:0,dm:q.domain});
  if(S.answers.length>400)S.answers.splice(0,S.answers.length-400);
  const dr=dayRec();dr.n++;if(ok)dr.c++;
  if(!ok){
    const old=S.errors.find(e=>e.q.id===q.id);
    S.errors=S.errors.filter(e=>e.q.id!==q.id);
    S.errors.push({q,picked,when:Date.now(),sess:sessIdx,step:0,due:Date.now()+SPACING[0]*864e5,fails:(old?old.fails:0)+1,reason:null,slow:sec>PACE[q.section]*1.8});
    if(S.errors.length>300)S.errors.splice(0,S.errors.length-300);
    if(q.skill==='Words in context'&&q.choices){const w=q.choices[q.answer];if(w&&w.split(' ').length<=2)S.vocabMiss[w.toLowerCase()]={w,ex:q.passage,en:q.expl,when:Date.now()}}
  }
}
function clearError(id){S.errors=S.errors.filter(e=>e.q.id!==id)}
/* retry from the mistake bank: right moves it 1 -> 7 -> 30 days then retires it, wrong resets it */
function reviewResult(id,ok){
  const e=S.errors.find(x=>x.q.id===id);if(!e)return null;
  const dr=dayRec();dr.n++;if(ok)dr.c++;if(!dr.kinds.includes('review'))dr.kinds.push('review');
  if(ok){
    e.step++;
    if(e.step>=SPACING.length){clearError(id);S.mastered++;return 'mastered'}
    e.due=Date.now()+SPACING[e.step]*864e5;return 'next:'+SPACING[e.step];
  }
  e.step=0;e.fails++;e.due=Date.now()+SPACING[0]*864e5;return 'reset';
}
const dueErrors=()=>S.errors.filter(e=>e.due<=Date.now()).sort((a,b)=>a.due-b.due);
function setReason(id,reason){const e=S.errors.find(x=>x.q.id===id);if(!e)return;if(e.reason)S.reasons[e.reason]=Math.max(0,(S.reasons[e.reason]||1)-1);e.reason=reason;if(reason)S.reasons[reason]=(S.reasons[reason]||0)+1}

/* ---------- score estimates (rough) ---------- */
const WGT={1:1,2:1.6,3:2.4};
function wAcc(rows){let got=0,tot=0;rows.forEach(a=>{tot+=WGT[a.d||2];got+=a.ok*WGT[a.d||2]});return tot?got/tot:0}
const toScore=w=>Math.min(800,Math.max(200,Math.round((300+480*Math.min(1,w))/10)*10));
function estimate(section){
  const rows=S.answers.filter(a=>a.s===section).slice(-120);
  if(rows.length<12)return null;
  const est=toScore(wAcc(rows));
  return {est,lo:Math.max(200,est-40),hi:Math.min(800,est+40),n:rows.length,acc:wAcc(rows)};
}
function estimateTotal(){
  const a=estimate('rw'),b=estimate('math');
  const rw=a?a.est:S.prefs.lastRW,ma=b?b.est:S.prefs.lastMath;
  if(!rw||!ma)return null;
  return {est:rw+ma,lo:(a?a.lo:rw-40)+(b?b.lo:ma-40),hi:Math.min(1600,(a?a.hi:rw+40)+(b?b.hi:ma+40)),rw,math:ma,live:!!(a&&b)};
}
/* Bluebook-style skill bars (1-7) for the 8 content domains */
function domainBars(){
  const out={};
  for(const d in DOM_SEC){
    let a=0,c=0;
    Object.values(S.stats).forEach(s=>{if(s.domain===d){a+=s.a;c+=s.c}});
    const pri=S.prior[d];
    if(a>=6){out[d]={bars:Math.max(1,Math.min(7,Math.round(1+6*c/a))),a,acc:c/a}}
    else if(pri){out[d]={bars:pri,a,prior:true,acc:(pri-1)/6}}
    else out[d]={bars:0,a,acc:null};
  }
  return out;
}
/* how many right answers each section needs for the target */
function whatINeed(target){
  const half=Math.max(200,Math.min(800,Math.round(target/2/10)*10));
  const need=sc=>(sc-300)/480;
  const rows=[];
  [['rw',54],['math',44]].forEach(([sec,total])=>{
    const w=need(half),e=estimate(sec);
    rows.push({sec,score:half,w,right:Math.min(total,Math.ceil(w*total*0.92)),total,cur:e?e.est:null,gap:e?half-e.est:null,acc:e?e.acc:null});
  });
  return rows;
}
function sessionEst(qs,answers){
  const rows=[];qs.forEach((q,i)=>{const a=answers[i];if(a&&(a.picked!==undefined&&a.picked!==null&&a.picked!==''||a.checked))rows.push({d:q.diff,ok:a.ok?1:0})});
  return rows.length?toScore(wAcc(rows)):null;
}

/* ---------- weak topics, study plan ---------- */
function weakRanking(minA=3){
  return Object.values(S.stats).filter(s=>s.a>=minA).map(s=>({sec:s.sec,skill:s.skill,domain:s.domain,a:s.a,c:s.c,acc:s.c/s.a,avg:s.tt?s.t/s.tt:0})).sort((a,b)=>a.acc-b.acc||b.a-a.a);
}
function allSkills(){
  const set=new Map();
  MATH.forEach(x=>set.set(x.skill,{sec:'math',domain:x.domain,skill:x.skill}));
  RWT.forEach(x=>set.set(x.skill,{sec:'rw',domain:x.domain,skill:x.skill}));
  BANK.forEach(x=>set.set(x.skill,{sec:'rw',domain:x.domain,skill:x.skill}));
  return [...set.values()];
}
/* untouched skills are low priority until diagnosed; prior bars from a Bluebook import count as evidence */
function focusList(n=6){
  const w=weakRanking(3).filter(x=>x.acc<0.85);
  const seen=new Set(w.map(x=>x.skill));
  const prior=allSkills().filter(s=>!seen.has(s.skill)&&S.prior[s.domain]&&S.prior[s.domain]<=4).map(s=>({sec:s.sec,skill:s.skill,domain:s.domain,acc:(S.prior[s.domain]-1)/6,a:0}));
  return w.concat(prior).slice(0,n);
}
function buildPlan(maxDays=14){
  const left=daysUntil(S.prefs.testDate);
  const focus=focusList(6);
  const fallbackRW=['Words in context','Inferences','Transitions','Command of evidence'],fallbackM=['Quadratic equations (Vieta)','Function transformations','Two-way tables and probability'];
  const pick=(i,sec)=>{const f=focus.filter(x=>x.sec===sec);if(f.length)return f[i%f.length].skill;const fb=sec==='rw'?fallbackRW:fallbackM;return fb[i%fb.length]};
  const days=[];
  for(let i=0;i<Math.min(maxDays,Math.max(1,left));i++){
    const d=new Date();d.setDate(d.getDate()+i);
    const dow=d.getDay(),toTest=left-i,tasks=[];
    if(toTest<=1)tasks.push({kind:'cards',n:10},{kind:'review'});
    else if(toTest<=3){tasks.push({kind:'review'},{kind:'cards',n:10},{kind:'drill',section:'math',skill:pick(i,'math'),n:10})}
    else if(dow===6)tasks.push({kind:'full'});
    else if(dow===0)tasks.push({kind:'review'},{kind:'cards',n:10},{kind:'drill',section:'rw',skill:pick(i,'rw'),n:10});
    else if(dow===2||dow===4)tasks.push({kind:'module',section:'math',plan:'hard'},{kind:'cards',n:10});
    else tasks.push({kind:'drill',section:i%2?'rw':'math',skill:pick(i,i%2?'rw':'math'),n:20},{kind:'review'});
    days.push({date:d,key:dayKey(d),toTest,tasks});
  }
  return days;
}
const taskDone=(t,key=dayKey())=>{const r=S.days[key];return !!(r&&r.kinds&&r.kinds.includes(t.kind==='module'?'module':t.kind))};

/* ---------- spaced repetition for flashcards ---------- */
const BOX_DAYS=[0,1,2,4,8,16];
function cardState(w){return S.cards[w]||{box:0,due:0}}
function gradeCard(w,knew){
  const c=cardState(w);
  c.box=knew?Math.min(5,c.box+1):0;

}
const allCards=()=>VOCAB.concat(Object.values(S.vocabMiss).filter(m=>!VOCAB.some(v=>v.w===m.w)).map(m=>({w:m.w,en:m.en,th:'',ex:m.ex,mine:true})));
function dueCards(){const now=Date.now();return allCards().filter(v=>cardState(v.w).due<=now)}

const CODE_CH='23456789ABCDEFGHJKMNPQRSTUVWXYZ';
function newChallengeCode(section){let s='';for(let i=0;i<6;i++)s+=CODE_CH[Math.floor(Math.random()*CODE_CH.length)];return (section==='math'?'M':'R')+'-'+s}
function parseChallenge(code){const m=/^([RM])-?([2-9A-HJKMNP-Z]{6})$/i.exec(String(code).trim().replace(/\s/g,''));return m?{section:m[1].toUpperCase()==='M'?'math':'rw',code:m[1].toUpperCase()+'-'+m[2].toUpperCase()}:null}

/* ---------- backup code ---------- */
async function exportCode(){
  const json=JSON.stringify({v:2,S});
  const b64=u=>{let s='';u.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
  const enc=new TextEncoder().encode(json);
  try{
    const cs=new CompressionStream('gzip');const w=cs.writable.getWriter();w.write(enc);w.close();
    const buf=new Uint8Array(await new Response(cs.readable).arrayBuffer());return 'SF1.'+b64(buf);
  }catch(e){return 'SF0.'+b64(enc)}
}
async function importCode(code){
  code=String(code).trim();
  const un=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);return Uint8Array.from(bin,c=>c.charCodeAt(0))};
  let json;
  if(code.startsWith('SF1.')){
    const ds=new DecompressionStream('gzip');const w=ds.writable.getWriter();w.write(un(code.slice(4)));w.close();
    json=await new Response(ds.readable).text();
  }else if(code.startsWith('SF0.'))json=new TextDecoder().decode(un(code.slice(4)));
  else throw new Error('bad');
  const o=JSON.parse(json);if(!o||!o.S||(o.S.v!==1&&o.S.v!==2))throw new Error('bad');
  S=Object.assign(defaults(),o.S,{v:2,prefs:Object.assign(defaults().prefs,o.S.prefs||{})});save();
}
function resetAll(){S=defaults();try{localStorage.removeItem(LS_KEY)}catch(e){}}

/* ===== calculator + function grapher (a small Desmos-style tool) ===== */
const Expr=(()=>{
  const FN={sqrt:Math.sqrt,abs:Math.abs,ln:Math.log,log:Math.log10,exp:Math.exp,floor:Math.floor,ceil:Math.ceil,
    sin:null,cos:null,tan:null,asin:null,acos:null,atan:null};
  function tokenize(src){
    src=src.replace(/−/g,'-').replace(/×/g,'*').replace(/÷/g,'/').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/\s+/g,'').toLowerCase();
    const out=[];let i=0;
    while(i<src.length){
      const c=src[i];
      if(/[0-9.]/.test(c)){let j=i;while(j<src.length&&/[0-9.]/.test(src[j]))j++;out.push({t:'n',v:parseFloat(src.slice(i,j))});i=j;continue}
      if(/[a-z]/.test(c)){let j=i;while(j<src.length&&/[a-z]/.test(src[j]))j++;const w=src.slice(i,j);
        if(w in FN||['pi','e','x'].includes(w)){out.push({t:w in FN?'f':'c',v:w});i=j;continue}
        /* split unknown letters into single-letter variables (e.g. "xy") is not supported: treat each letter as x if x */
        let k=0;while(k<w.length){if(w[k]==='x'){out.push({t:'c',v:'x'});k++}else if(w.startsWith('pi',k)){out.push({t:'c',v:'pi'});k+=2}else if(w[k]==='e'){out.push({t:'c',v:'e'});k++}else throw new Error('Unknown: '+w)}
        i=j;continue}
      if('+-*/^(),'.includes(c)){out.push({t:'o',v:c});i++;continue}
      if(c==='|'){out.push({t:'o',v:'|'});i++;continue}
      throw new Error('Unexpected '+c);
    }
    /* implicit multiplication */
    const res=[];
    for(let k=0;k<out.length;k++){
      const a=out[k-1],b=out[k];
      if(a&&((a.t==='n'||a.t==='c'||(a.t==='o'&&a.v===')'))&&(b.t==='n'||b.t==='c'||b.t==='f'||(b.t==='o'&&b.v==='(')))) res.push({t:'o',v:'*'});
      res.push(b);
    }
    return res;
  }
  function compile(src,deg){
    const toks=tokenize(src);let p=0;
    const peek=()=>toks[p],eat=()=>toks[p++];
    const trig=(f)=>x=>f(deg?x*Math.PI/180:x),itrig=(f)=>x=>deg?f(x)*180/Math.PI:f(x);
    const F=Object.assign({},FN,{sin:trig(Math.sin),cos:trig(Math.cos),tan:trig(Math.tan),asin:itrig(Math.asin),acos:itrig(Math.acos),atan:itrig(Math.atan)});
    function expr(){let l=term();while(peek()&&peek().t==='o'&&(peek().v==='+'||peek().v==='-')){const op=eat().v,r=term(),a=l;l=op==='+'?x=>a(x)+r(x):x=>a(x)-r(x)}return l}
    function term(){let l=unary();while(peek()&&peek().t==='o'&&(peek().v==='*'||peek().v==='/')){const op=eat().v,r=unary(),a=l;l=op==='*'?x=>a(x)*r(x):x=>a(x)/r(x)}return l}
    function unary(){const t=peek();if(t&&t.t==='o'&&(t.v==='-'||t.v==='+')){eat();const u=unary();return t.v==='-'?x=>-u(x):u}return power()}
    function power(){const b=primary();if(peek()&&peek().t==='o'&&peek().v==='^'){eat();const e=unary();return x=>Math.pow(b(x),e(x))}return b}
    function primary(){
      const t=eat();if(!t)throw new Error('Incomplete');
      if(t.t==='n'){const v=t.v;return()=>v}
      if(t.t==='c'){if(t.v==='x')return x=>x;if(t.v==='pi')return()=>Math.PI;return()=>Math.E}
      if(t.t==='f'){const f=F[t.v];let arg;
        if(peek()&&peek().t==='o'&&peek().v==='('){eat();arg=expr();if(!peek()||peek().v!==')')throw new Error('Missing )');eat()}
        else arg=power();
        return x=>f(arg(x))}
      if(t.t==='o'&&t.v==='('){const e=expr();if(!peek()||peek().v!==')')throw new Error('Missing )');eat();return e}
      if(t.t==='o'&&t.v==='|'){const e=expr();if(!peek()||peek().v!=='|')throw new Error('Missing |');eat();return x=>Math.abs(e(x))}
      throw new Error('Unexpected '+t.v);
    }
    const f=expr();if(p<toks.length)throw new Error('Unexpected '+toks[p].v);
    return f;
  }
  return {compile};
})();

function createCalculator(t){
  let deg=false;
  const root=h('div',{class:'calc'});
  const tabs=h('div',{class:'calc-tabs',role:'tablist'});
  const bCalc=h('button',{class:'tab on',type:'button'},t('calc.calc'));
  const bGraph=h('button',{class:'tab',type:'button'},t('calc.graph'));
  tabs.append(bCalc,bGraph);
  /* --- calculator --- */
  const inp=h('input',{id:'calc-input',class:'calc-input',type:'text',autocomplete:'off',spellcheck:'false',placeholder:'2(3+4)^2 / 7',inputmode:'text','aria-label':t('calc.calc')});
  const out=h('div',{class:'calc-out','aria-live':'polite'},'=');
  const hist=h('div',{class:'calc-hist'});
  const degBtn=h('button',{class:'chip',type:'button',onclick:()=>{deg=!deg;degBtn.textContent=deg?'DEG':'RAD';run()}},'RAD');
  function fmt(v){if(!isFinite(v))return 'undefined';const r=Math.round(v*1e9)/1e9;return String(r).replace('-','−')}
  function run(){
    const s=inp.value.trim();if(!s){out.textContent='=';return null}
    try{const v=Expr.compile(s,deg)(0);out.textContent='= '+fmt(v);return v}catch(e){out.textContent='= ?';return null}
  }
  inp.addEventListener('input',run);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=run();if(v!==null){hist.prepend(h('div',{class:'calc-line'},inp.value+' = '+fmt(v)));while(hist.children.length>6)hist.lastChild.remove()}}});
  const keys=['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','^','+','(',')','π','√('];
  const pad=h('div',{class:'calc-pad'},keys.map(k=>h('button',{type:'button',class:'key',onclick:()=>{const map={'÷':'/','×':'*','−':'-','π':'pi','√(':'sqrt('};inp.value+=map[k]||k;inp.focus();run()}},k)));
  const fnRow=h('div',{class:'calc-fns'},['sin(','cos(','tan(','ln(','abs('].map(k=>h('button',{type:'button',class:'chip',onclick:()=>{inp.value+=k;inp.focus();run()}},k.replace('(',''))),
    h('button',{type:'button',class:'chip',onclick:()=>{inp.value=inp.value.slice(0,-1);run()}},'⌫'),
    h('button',{type:'button',class:'chip',onclick:()=>{inp.value='';run()}},'C'),degBtn);
  const calcPane=h('div',{class:'calc-pane'},inp,out,fnRow,pad,hist);
  /* --- grapher --- */
  const COLORS=['#2B59C3','#C9402B','#1B8A5A'];
  const fnInputs=[0,1,2].map(i=>h('input',{id:'graph-f'+i,class:'calc-input fn-input',type:'text',autocomplete:'off',spellcheck:'false',placeholder:i===0?'y = x^2 - 4x + 3':'y = …','aria-label':'f'+(i+1),style:{borderLeft:'4px solid '+COLORS[i]}}));
  const cv=h('canvas',{class:'graph-cv',width:640,height:480,'aria-label':t('calc.graph')});
  const readout=h('div',{class:'graph-readout'},t('calc.hint'));
  let view={cx:0,cy:0,sx:40};   // sx = pixels per unit
  const ctx=cv.getContext('2d');
  function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888'}
  function funcs(){
    return fnInputs.map(el=>{
      let s=el.value.trim().replace(/^y\s*=/i,'').replace(/^f\(x\)\s*=/i,'');
      if(!s)return null;try{return Expr.compile(s,false)}catch(e){return null}
    });
  }
  function draw(){
    const W=cv.width,H=cv.height,line=css('--line'),ink=css('--ink'),muted=css('--muted'),surf=css('--surface');
    ctx.clearRect(0,0,W,H);ctx.fillStyle=surf;ctx.fillRect(0,0,W,H);
    const toX=x=>W/2+(x-view.cx)*view.sx,toY=y=>H/2-(y-view.cy)*view.sx;
    const x0=view.cx-W/2/view.sx,x1=view.cx+W/2/view.sx,y0=view.cy-H/2/view.sx,y1=view.cy+H/2/view.sx;
    let step=1;const raw=60/view.sx;const mag=Math.pow(10,Math.floor(Math.log10(raw)));step=[1,2,5,10].map(m=>m*mag).find(s=>s>=raw)||mag*10;
    ctx.lineWidth=1;ctx.font='11px "IBM Plex Mono", monospace';ctx.fillStyle=muted;
    for(let x=Math.ceil(x0/step)*step;x<=x1;x+=step){const px=Math.round(toX(x))+.5;ctx.strokeStyle=Math.abs(x)<1e-9?ink:line;ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,H);ctx.stroke();if(Math.abs(x)>1e-9)ctx.fillText(String(Math.round(x*1e6)/1e6).replace('-','−'),px+3,Math.min(H-4,Math.max(12,toY(0)+12)))}
    for(let y=Math.ceil(y0/step)*step;y<=y1;y+=step){const py=Math.round(toY(y))+.5;ctx.strokeStyle=Math.abs(y)<1e-9?ink:line;ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(W,py);ctx.stroke();if(Math.abs(y)>1e-9)ctx.fillText(String(Math.round(y*1e6)/1e6).replace('-','−'),Math.min(W-34,Math.max(4,toX(0)+4)),py-3)}
    funcs().forEach((f,i)=>{
      if(!f)return;ctx.strokeStyle=COLORS[i];ctx.lineWidth=2.4;ctx.beginPath();let pen=false,prev=null;
      for(let px=0;px<=W;px+=1){const x=view.cx+(px-W/2)/view.sx;let y;try{y=f(x)}catch(e){y=NaN}
        if(!isFinite(y)||Math.abs(y)>1e6){pen=false;prev=null;continue}
        const py=toY(y);
        if(prev!==null&&Math.abs(py-prev)>H*1.5){pen=false}
        if(!pen){ctx.moveTo(px,py);pen=true}else ctx.lineTo(px,py);prev=py}
      ctx.stroke()});
  }
  [...fnInputs].forEach(el=>el.addEventListener('input',draw));
  function zoom(k){view.sx=Math.max(4,Math.min(400,view.sx*k));draw()}
  const zIn=h('button',{type:'button',class:'chip',onclick:()=>zoom(1.4)},'+'),zOut=h('button',{type:'button',class:'chip',onclick:()=>zoom(1/1.4)},'−'),zReset=h('button',{type:'button',class:'chip',onclick:()=>{view={cx:0,cy:0,sx:40};draw()}},t('calc.reset'));
  let drag=null;
  cv.style.touchAction='none';
  cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:view.cx,cy:view.cy};cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{
    const r=cv.getBoundingClientRect(),k=cv.width/r.width;
    if(drag){view.cx=drag.cx-(e.clientX-drag.x)*k/view.sx;view.cy=drag.cy+(e.clientY-drag.y)*k/view.sx;draw();return}
    const x=view.cx+((e.clientX-r.left)*k-cv.width/2)/view.sx;
    const parts=funcs().map((f,i)=>{if(!f)return null;let y;try{y=f(x)}catch(_){return null}return isFinite(y)?`f${i+1}(${(Math.round(x*100)/100)}) = ${Math.round(y*1000)/1000}`:null}).filter(Boolean);
    readout.textContent=(parts.length?parts.join('   '):`x = ${Math.round(x*100)/100}`).replace(/-/g,'−');
  });
  cv.addEventListener('pointerup',()=>{drag=null});cv.addEventListener('pointerleave',()=>{drag=null});
  cv.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15)},{passive:false});
  const graphPane=h('div',{class:'calc-pane',hidden:true},fnInputs,cv,h('div',{class:'graph-tools'},zIn,zOut,zReset),readout);
  bCalc.onclick=()=>{bCalc.classList.add('on');bGraph.classList.remove('on');calcPane.hidden=false;graphPane.hidden=true;inp.focus()};
  bGraph.onclick=()=>{bGraph.classList.add('on');bCalc.classList.remove('on');calcPane.hidden=true;graphPane.hidden=false;draw()};
  root.append(tabs,calcPane,graphPane);
  root.redraw=draw;
  return root;
}

let LANG='en';

  const d=I18N[LANG]||I18N.en;let s=(d[k]!==undefined?d[k]:(I18N.en[k]!==undefined?I18N.en[k]:k));
  if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);
  return s;
}
function h(tag,props,...kids){
  const e=document.createElement(tag);
  if(props)for(const k in props){
    const v=props[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}
  return e;
}

/* 15 weeks of activity, one single-hue ramp */
function heatmap(weeks=15){
  const end=new Date();end.setHours(12,0,0,0);
  const start=new Date(end);start.setDate(start.getDate()-((weeks-1)*7+end.getDay()));
  const cells=[];let active=0;
  for(let i=0;i<weeks*7;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    if(d>end){cells.push(h('i',{class:'hm hm-x'}));continue}
    const r=S.days[dayKey(d)],n=r?r.n:0,lv=n===0?0:n<10?1:n<30?2:n<60?3:4;
    if(n)active++;
    cells.push(h('i',{class:'hm hm'+lv,title:fmtDate(d)+' · '+n}));
  }
  return h('div',{},h('div',{class:'heat',role:'img','aria-label':t('hm.aria',{n:active})},cells),
    h('div',{class:'legend hm-leg'},h('span',{},t('hm.less')),[0,1,2,3,4].map(l=>h('i',{class:'hm hm'+l})),h('span',{},t('hm.more'))));
}

function launch(cfg){
  const sess=newSessionIndex();
  run={cfg,sess,mode:cfg.mode,practice:cfg.practice,timed:cfg.timed,title:cfg.title,used:new Set(),mods:[],mi:0,qi:0,phase:'q',started:Date.now(),short:0,review:false,confirmExit:false,timer:null,hlOn:false,elim:false};
  cfg.mods.forEach(m=>run.mods.push({spec:m,section:m.section,label:m.label,qs:null,ans:[],flag:[],time:[],hl:[],cross:[],limit:m.limit,deadline:0,done:false}));
  buildMod(0);
  if(!cur().qs.length){toast(t('run.empty'));run=null;save();go('home');return}
  save();
  startModuleRun(0);
  view='run';render();window.scrollTo(0,0);
}
function buildMod(i){
  const m=run.mods[i];if(m.qs)return;
  let plan=m.spec.plan;
  if(plan==='adapt'){
    const prev=run.mods.slice(0,i).reverse().find(x=>x.section===m.section&&x.done);
    const acc=prev?prev.correct/prev.qs.length:.7;
    plan=acc>=0.62?'hard':'easy';m.route=plan;
  }
  const r=buildModule(m.spec.section,m.spec.n,plan,run.sess,run.used,m.spec.opts||{});
  m.qs=r.questions;run.short+=r.short;m.plan=plan;
}
function startModuleRun(i){
  run.mi=i;run.qi=0;run.review=false;run.confirmExit=false;run.phase='q';
  const m=cur();m.t0=Date.now();m.deadline=run.timed&&m.limit?Date.now()+m.limit*1000:0;
  run.qStart=Date.now();
  if(run.timer)clearInterval(run.timer);
  run.timer=setInterval(tick,1000);
}
function tick(){
  if(!run||view!=='run'||run.phase!=='q'){return}
  const m=cur(),el=$('#timer');if(!el)return;
  if(m.deadline){
    const rem=(m.deadline-Date.now())/1000;
    el.textContent=fmtTime(rem);el.classList.toggle('low',rem<300);
    if(rem<=0){clearInterval(run.timer);toast(t('run.timeUp'));submitModule()}
  }else el.textContent=fmtTime((Date.now()-m.t0)/1000);
}
function stamp(){const m=cur(),now=Date.now();m.time[run.qi]=(m.time[run.qi]||0)+(now-run.qStart)/1000;run.qStart=now}
function goQ(i){stamp();run.qi=i;run.review=false;render();window.scrollTo(0,0)}
function pickAnswer(v){
  const m=cur(),a=m.ans[run.qi]||(m.ans[run.qi]={});
  if(run.practice&&a.checked)return;
  a.picked=v;render();
}
function checkAnswer(){
  const m=cur(),q=m.qs[run.qi],a=m.ans[run.qi]||(m.ans[run.qi]={});
  if(!answered(a)||a.checked)return;
  stamp();a.ok=grade(q,a.picked);a.checked=true;
  recordAnswer(q,a.ok,m.time[run.qi]||0,a.picked,run.sess);save();render();
}
function nextQ(){
  const m=cur();
  if(run.qi<m.qs.length-1)goQ(run.qi+1);
  else if(run.practice)finishRun();
  else{stamp();run.review=true;render()}
}
function submitModule(){
  stamp();const m=cur();if(m.done)return;m.done=true;
  let correct=0;
  m.qs.forEach((q,i)=>{
    const a=m.ans[i]||(m.ans[i]={});
    a.ok=answered(a)&&grade(q,a.picked);if(a.ok)correct++;
    if(!a.checked){recordAnswer(q,a.ok,m.time[i]||0,answered(a)?a.picked:null,run.sess);a.checked=true}
  });
  m.correct=correct;save();
  const nxt=run.mi+1;
  if(nxt<run.mods.length){
    if(run.mods[nxt].spec.breakBefore){run.phase='break';run.breakEnd=Date.now()+10*60*1000;view='break';if(run.timer)clearInterval(run.timer);run.timer=setInterval(breakTick,1000);render();return}
    buildMod(nxt);startModuleRun(nxt);render();window.scrollTo(0,0);
  }else finishRun();
}
function breakTick(){const el=$('#breaktimer');if(!el)return;const rem=(run.breakEnd-Date.now())/1000;el.textContent=fmtTime(rem);if(rem<=0)endBreak()}
function endBreak(){clearInterval(run.timer);buildMod(run.mi+1);view='run';startModuleRun(run.mi+1);render();window.scrollTo(0,0)}
function applyDiag(){
  const acc={};let n=0,c=0;
  run.mods.forEach(m=>m.qs&&m.qs.forEach((q,i)=>{const a=m.ans[i];const o=acc[q.domain]||(acc[q.domain]={a:0,c:0});o.a++;n++;if(a&&a.ok){o.c++;c++}}));
  for(const d in acc){const o=acc[d];if(o.a>=2)S.prior[d]=Math.max(1,Math.min(7,Math.round(1+6*o.c/o.a)))}
  S.diag={when:Date.now(),n,c};S.prefs.onboarded=true;
}
function finishRun(){
  if(run.timer)clearInterval(run.timer);
  stamp();
  run.finished=Date.now();
  let n=0,c=0,sec=0;const miss=[],mods=[],bySec={rw:{qs:[],an:[]},math:{qs:[],an:[]}};
  run.mods.forEach(m=>{
    if(!m.qs)return;let mc=0,mn=0;
    m.qs.forEach((q,i)=>{
      const a=m.ans[i];const seen=answered(a)||m.done;
      if(seen){n++;mn++;if(a&&a.ok){c++;mc++}}
      sec+=m.time[i]||0;
      if(seen&&!(a&&a.ok)&&miss.length<14)miss.push({q,picked:answered(a)?a.picked:null});
      bySec[m.section].qs.push(q);bySec[m.section].an.push(a||{});
    });
    mods.push({label:m.label,section:m.section,c:mc,n:mn,route:m.route||null});
  });
  const est={rw:sessionEst(bySec.rw.qs,bySec.rw.an),math:sessionEst(bySec.math.qs,bySec.math.an)};
  S.log.push({sess:run.sess,mode:run.mode,title:run.title,when:Date.now(),n,correct:c,sec:Math.round(sec),est,mods,miss,code:run.cfg.code||null});
  if(S.log.length>40)S.log.shift();
  const dr=dayRec(),kind=run.mode==='challenge'?'drill':run.mode;
  if(!dr.kinds.includes(kind))dr.kinds.push(kind);
  if(run.mode==='diag')applyDiag();
  save();
  view='results';render();window.scrollTo(0,0);
}

/* ---------- highlighter ---------- */
function mergeRanges(r){
  r=r.slice().sort((a,b)=>a[0]-b[0]);const o=[];
  for(const x of r){const l=o[o.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else o.push([x[0],x[1]])}
  return o;
}
function fillPassage(el,text,hl){
  el.replaceChildren();let p=0;
  mergeRanges(hl||[]).forEach(([s,e],i)=>{
    if(s>p)el.append(text.slice(p,s));
    el.append(h('mark',{class:'hl','data-i':i},text.slice(s,e)));p=e;
  });
  if(p<text.length)el.append(text.slice(p));
}
let selTimer=null;
document.addEventListener('selectionchange',()=>{
  if(!run||view!=='run'||!run.hlOn)return;
  clearTimeout(selTimer);selTimer=setTimeout(applySelection,350);
});
function applySelection(){
  const el=$('.qpass.editable'),sel=window.getSelection();
  if(!el||!run||!sel||!sel.rangeCount||sel.isCollapsed)return;
  const r=sel.getRangeAt(0);
  if(!el.contains(r.startContainer)||!el.contains(r.endContainer))return;
  const pre=document.createRange();pre.selectNodeContents(el);pre.setEnd(r.startContainer,r.startOffset);
  const s=pre.toString().length,e=s+r.toString().length;
  if(e<=s)return;
  const m=cur();m.hl[run.qi]=mergeRanges((m.hl[run.qi]||[]).concat([[s,e]]));
  sel.removeAllRanges();fillPassage(el,m.qs[run.qi].passage,m.hl[run.qi]);
}

function qBody(q,st){

  if(q.table)pane.append(tableEl(q.table));
  if(q.type==='mc'){
    pane.append(h('div',{class:'choices',role:'radiogroup','aria-label':t('q.choices')},q.choices.map((c,i)=>{
      const sel=st.picked===i,cr=st.crossed&&st.crossed[i];
      let cls='choice'+(sel?' sel':'')+(cr?' struck':'');
      if(st.reveal){if(i===q.answer)cls+=' right';else if(sel)cls+=' wrong'}
      const btn=h('button',{type:'button',role:'radio','aria-checked':sel?'true':'false',class:cls,disabled:st.reveal&&!st.onPick?true:null,onclick:()=>st.onPick&&st.onPick(i)},
        Bubble('ABCD'[i]),h('span',{class:'ctext'},c));
      if(st.elim&&st.onCross&&!st.reveal)return h('div',{class:'crow'},btn,h('button',{type:'button',class:'xb'+(cr?' on':''),'aria-pressed':cr?'true':'false','aria-label':t('q.cross',{l:'ABCD'[i]}),onclick:()=>st.onCross(i)},'⊘'));
      return btn;
    })));

    const inp=h('input',{id:'spr-input',class:'spr',type:'text',inputmode:'text',autocomplete:'off',spellcheck:'false',value:st.picked||'',placeholder:t('q.sprPh'),'aria-label':t('q.sprLabel'),disabled:st.reveal?true:null});
    inp.addEventListener('input',()=>st.onInput&&st.onInput(inp.value));
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){st.onEnter&&st.onEnter()}});
    pane.append(h('div',{class:'sprwrap'},inp,h('div',{class:'muted small'},t('q.sprHint'))));
    if(st.reveal)pane.append(h('div',{class:'sprans'},t('q.answerIs',{a:q.ansText}),h('span',{class:'muted'},' · '+t('q.yours',{a:st.picked||'—'}))));
  }

/* opts: {hl: ranges, editable: bool} */
function qLayout(q,mainEl,opts={}){
  const wrap=h('div',{class:'qwrap'+(q.passage?' two':'')});
  if(q.passage){
    const p=h('div',{class:'qpass'+(opts.editable?' editable'+(run&&run.hlOn?' hlon':''):''),tabindex:'0','aria-label':t('q.passage')});
    fillPassage(p,q.passage,opts.hl);
    if(opts.editable)p.addEventListener('click',e=>{
      const mk=e.target.closest&&e.target.closest('mark');
      if(mk&&run.hlOn){const m=cur(),i=+mk.dataset.i;const list=mergeRanges(m.hl[run.qi]||[]);list.splice(i,1);m.hl[run.qi]=list;fillPassage(p,q.passage,list)}
    });
    wrap.append(p);
  }
  wrap.append(mainEl);return wrap;
}

const REASONS=['concept','careless','time','misread','guess'];
function reasonRow(q){
  const e=S.errors.find(x=>x.q.id===q.id);if(!e)return null;
  const row=h('div',{class:'reasons'});
  const draw=()=>row.replaceChildren(h('span',{class:'muted small'},t('rs.ask')),...REASONS.map(r=>h('button',{type:'button',class:'chip'+(e.reason===r?' on':''),'aria-pressed':e.reason===r?'true':'false',onclick:()=>{setReason(q.id,e.reason===r?null:r);save();draw()}},t('rs.'+r))));

function explainBlock(q,picked,ok,o={}){
  const box=h('div',{class:'explain'});
  box.append(h('div',{class:'verdict '+(ok?'good':'bad')},ok?t('q.correct'):(answered({picked})?t('q.incorrect'):t('q.skipped'))));
  const th=LANG==='th';
  if(th&&q.explTh){
    box.append(h('p',{class:'expl',lang:'th'},q.explTh));
    box.append(h('details',{class:'lesson'},h('summary',{},t('ex.en')),h('p',{class:'expl'},q.expl)));
  }else if(th&&LESSONS[q.skill]){
    box.append(h('div',{class:'thbox',lang:'th'},h('b',{},t('les.rule')+': '),LESSONS[q.skill].ruleTh));
    box.append(h('p',{class:'expl'},h('span',{class:'muted small'},t('ex.steps')+' '),q.expl));
  }else box.append(h('p',{class:'expl'},q.expl));
  const ls=lessonBlock(q.skill);if(ls)box.append(ls);
  if(!ok&&o.reason!==false){const r=reasonRow(q);if(r)box.append(r)}
  box.append(reportRow(q));

}
function reportRow(q){
  const b=h('button',{type:'button',class:'linkb small',onclick:()=>{if(!S.bad.includes(q.id))S.bad.push(q.id);save();b.replaceWith(h('span',{class:'muted small'},t('q.reported')))}},t('q.report'));
  return h('div',{class:'row'},b);
}
