<title>SAT Forge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{
--bg:#f6f3ec;--surface:#fffdf8;--surface2:#efeadf;--ink:#1b2230;--muted:#5d6678;--line:#ddd6c6;
--accent:#2b4fb8;--accent-ink:#ffffff;--accent-soft:#e3e9fb;
--good:#17794d;--good-soft:#dff2e8;--bad:#b4321f;--bad-soft:#fae3de;--warn:#8a5a00;--warn-soft:#faefd2;
--focus:#2b4fb8;--shadow:0 1px 2px rgba(27,34,48,.06),0 6px 20px rgba(27,34,48,.06);
--r:14px;--sans:"IBM Plex Sans","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Newsreader","Noto Serif Thai",Georgia,"Times New Roman",serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#12161f;--surface:#1a202c;--surface2:#232b3a;--ink:#e9ecf3;--muted:#a0a9bb;--line:#2f384a;
--accent:#8fa8f2;--accent-ink:#0f1626;--accent-soft:#25304f;
--good:#5fd09a;--good-soft:#17382a;--bad:#ff8f7b;--bad-soft:#40201b;--warn:#f0c15a;--warn-soft:#3c2f10;
--focus:#8fa8f2;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#12161f;--surface:#1a202c;--surface2:#232b3a;--ink:#e9ecf3;--muted:#a0a9bb;--line:#2f384a;
--accent:#8fa8f2;--accent-ink:#0f1626;--accent-soft:#25304f;
--good:#5fd09a;--good-soft:#17382a;--bad:#ff8f7b;--bad-soft:#40201b;--warn:#f0c15a;--warn-soft:#3c2f10;
--focus:#8fa8f2;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);margin:0;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0 0 .4em;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.3rem)}h2{font-size:1.25rem}
p{margin:.4em 0 .8em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}.small{font-size:.85rem}.center{text-align:center;justify-content:center}
.lede{color:var(--muted);max-width:60ch}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.wrap,.top-in,.run-in,.foot{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{padding-block:20px 40px}
.shell{min-height:100vh}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.top-in{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:4px 6px;font-family:var(--serif);font-weight:700;font-size:1.2rem}
.logo{display:inline-grid;grid-template-columns:repeat(4,1fr);gap:3px}
.logo i{width:7px;height:20px;border-radius:3px;background:var(--line);display:block}
.logo i.on{background:var(--accent)}
.tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.navb{background:none;border:0;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap;display:flex;gap:6px;align-items:center}
.navb:hover{color:var(--ink)}
.navb.on{background:var(--accent-soft);color:var(--accent)}
.count{background:var(--bad);color:var(--bg);border-radius:999px;font-size:.72rem;padding:0 6px;min-width:18px;text-align:center}
.tools{display:flex;gap:6px;margin-left:auto}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem;line-height:1.3;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.5;cursor:default}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:10px;padding:10px 18px;font-weight:600;min-height:44px}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.small{padding:6px 12px;min-height:34px;font-size:.88rem}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.btn.ghost.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.linkb{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px 0}
.foot{padding-block:24px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-block:10px}.row.end{justify-content:flex-end}.row.center{justify-content:center}
.page{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.panel.empty{text-align:center;padding:32px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.split{display:grid;grid-template-columns:3fr 2fr;gap:14px}
@media (max-width:760px){.grid2,.grid3,.split{grid-template-columns:minmax(0,1fr)}}
/* home */
.home{display:flex;flex-direction:column;gap:14px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.count-block{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:4px;justify-content:center}
.count-block .eyebrow,.count-block .muted{color:inherit;opacity:.85}
.big{font-family:var(--serif);font-size:clamp(3.4rem,10vw,5.2rem);line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.unit{font-size:1.1rem;font-weight:500;margin-left:10px;font-family:var(--sans)}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.score{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);min-width:0}
.score-l{font-size:.85rem;color:var(--muted);font-weight:600}
.score-v{font-family:var(--serif);font-size:2.4rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.delta{font-size:.82rem;font-weight:600}.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.launch{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s;min-width:0}
.launch:hover{transform:translateY(-2px);border-color:var(--accent)}
.launch-k{font-family:var(--mono);font-size:.8rem;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 8px;align-self:flex-start;font-weight:600}
.launch-t{font-family:var(--serif);font-size:1.2rem;font-weight:600}
.launch-d{color:var(--muted);font-size:.9rem}
.plan{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.plan li{display:flex;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.plan li:first-child{border-top:0;padding-top:0}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-block:10px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 12px}
.stat-v{font-family:var(--serif);font-size:1.7rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-l{font-size:.78rem;color:var(--muted)}
/* forms */
.form{display:flex;flex-direction:column;gap:16px}
.field .lab{font-weight:600;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.segb{background:none;border:0;padding:8px 16px;border-right:1px solid var(--line)}.segb:last-child{border-right:0}
.segb.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.check{display:flex;gap:10px;align-items:center}
.check input{width:20px;height:20px;accent-color:var(--accent)}
input[type=text],input[type=number],input[type=date],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
label{display:block;font-weight:600;margin:12px 0 4px}.check{font-weight:400;margin:12px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:var(--r);padding:22px;width:min(480px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.warn{color:var(--warn);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* run */
.runview{min-height:100vh;display:flex;flex-direction:column}
.runtop{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:20}
.run-in{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.rt-left{flex:1;min-width:140px}.rt-t{font-family:var(--serif);font-weight:600}
.timer{font-family:var(--mono);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface2);padding:4px 12px;border-radius:8px}
.timer.low{background:var(--bad-soft);color:var(--bad)}.timer.big{font-size:3rem;padding:12px 24px;margin:16px 0}
.rt-right{display:flex;gap:6px;flex-wrap:wrap}
.banner{background:var(--warn-soft);color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.run-main{flex:1;width:100%;padding-bottom:140px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.qmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.qnum{background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 10px;font-weight:600;font-size:.85rem}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:500}
.dots{display:inline-flex;gap:3px}.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);display:block}.dots i.on{background:var(--muted)}
.qwrap{display:grid;gap:20px}.qwrap.two{grid-template-columns:1fr 1fr}
@media (max-width:820px){.qwrap.two{grid-template-columns:minmax(0,1fr)}}
.qpass{font-family:var(--serif);font-size:1.12rem;line-height:1.65;border-right:1px solid var(--line);padding-right:20px;white-space:pre-line;min-width:0}
@media (max-width:820px){.qpass{border-right:0;border-bottom:1px solid var(--line);padding:0 0 16px}}
.qmain{min-width:0}
.stem{font-size:1.06rem;margin-bottom:14px;white-space:pre-line}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;width:100%}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.right{border-color:var(--good);background:var(--good-soft)}.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.right::after{content:"✓";margin-left:auto;color:var(--good);font-weight:700}.choice.wrong::after{content:"✗";margin-left:auto;color:var(--bad);font-weight:700}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:.85rem}
.choice.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice.right .bub{background:var(--good);border-color:var(--good);color:var(--bg)}.choice.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.ctext{padding-top:2px;min-width:0;overflow-wrap:anywhere}
.spr{font-family:var(--mono);font-size:1.3rem;max-width:260px}
.sprwrap{display:flex;flex-direction:column;gap:6px}
.sprans{margin-top:10px;font-weight:600}
.tbl-wrap{overflow-x:auto;margin-block:10px;max-width:100%}
.qtable{border-collapse:collapse;min-width:260px;font-variant-numeric:tabular-nums}
.qtable th,.qtable td{border:1px solid var(--line);padding:6px 12px;text-align:center}
.qtable thead th{background:var(--surface2)}.qtable tbody th{background:var(--surface2);text-align:left;font-weight:600}
.qtable.left td,.qtable.left th{text-align:left}
.explain{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.verdict{font-weight:700;font-size:1.05rem;display:inline-flex;gap:8px;align-items:center}
.verdict.good{color:var(--good)}.verdict.bad{color:var(--bad)}
.verdict.good::before{content:"✓"}.verdict.bad::before{content:"✗"}
.expl{white-space:pre-line}
.good-note{color:var(--good);font-weight:600}
/* tutor */
.tutor{margin-top:16px;background:var(--surface2);border-radius:12px;padding:12px}
.thead{display:flex;justify-content:space-between;margin-bottom:8px}.tl{font-weight:700;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tbtns{display:flex;gap:6px;flex-wrap:wrap}
.tlog{display:flex;flex-direction:column;gap:8px;margin-block:10px}
.msg{padding:8px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;max-width:85%}
.msg.ai{background:var(--surface);border:1px solid var(--line);max-width:100%}
.msg.err{border-color:var(--bad);color:var(--bad)}
.tform{display:flex;gap:8px;margin-top:8px}.tin{flex:1}
/* run footer */
.runfoot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.runfoot .run-in{flex-wrap:nowrap;gap:10px}
.foot-mid{flex:1;overflow-x:auto;min-width:0;scrollbar-width:thin}
.navgrid{display:flex;gap:4px;width:max-content;margin-inline:auto}
.nb{width:34px;height:34px;flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;font-size:.82rem;font-weight:600;position:relative}
.nb.ans{background:var(--accent-soft);border-color:var(--accent)}
.nb.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nb.flag::after{content:"⚑";position:absolute;top:-6px;right:-3px;font-size:.7rem;color:var(--warn)}
.nb.ok{background:var(--good-soft);border-color:var(--good)}.nb.no{background:var(--bad-soft);border-color:var(--bad)}
.nb.big{width:46px;height:46px;font-size:1rem}
.bigNav{display:flex;flex-wrap:wrap;gap:8px;margin-block:12px}
.center-col{display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;flex:1;gap:8px;padding-top:12vh}
@media (max-width:620px){.runfoot .run-in{flex-wrap:wrap}.foot-mid{order:3;flex-basis:100%}.run-main{padding-bottom:170px}}
/* calculator dock */
.dock{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 170px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 40px rgba(0,0,0,.28);z-index:40;padding:10px}
@media (max-width:620px){.dock{bottom:calc(120px + env(safe-area-inset-bottom,0px))}}
.dock-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.calc-tabs{display:flex;gap:4px;margin-bottom:8px}.tab{flex:1;background:var(--surface2);border:0;border-radius:8px;padding:8px;font-weight:600}.tab.on{background:var(--accent);color:var(--accent-ink)}
.calc-input{font-family:var(--mono);margin-bottom:6px}
.calc-out{font-family:var(--mono);font-size:1.3rem;font-weight:600;min-height:1.8em;padding:4px 2px}
.calc-fns{display:flex;gap:4px;flex-wrap:wrap;margin-block:6px}
.calc-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.key{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 0;font-family:var(--mono);font-size:1.05rem;min-height:44px}
.key:active{background:var(--accent-soft)}
.calc-hist{margin-top:8px;font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.graph-cv{width:100%;height:auto;aspect-ratio:4/3;border:1px solid var(--line);border-radius:10px;display:block;margin-block:6px;background:var(--surface);cursor:grab}
.graph-tools{display:flex;gap:6px}.graph-readout{font-family:var(--mono);font-size:.82rem;color:var(--muted);min-height:2.6em;margin-top:6px}
/* results & charts */
.res-head{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
.res-big{display:flex;align-items:baseline;gap:10px}.res-big .big{font-size:4rem}.of{font-size:1.4rem;color:var(--muted)}.pct{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 12px;font-weight:700}
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:minmax(120px,40%) 1fr auto;gap:10px;align-items:center;font-size:.9rem}
@media (max-width:560px){.brow{grid-template-columns:1fr auto}.brow .meter{grid-column:1/-1;order:3}}
.bv{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.meter{display:block;height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.meter.good i{background:var(--good)}.meter.mid i{background:var(--warn)}.meter.low i{background:var(--bad)}
.pace{position:relative;height:130px;display:flex;align-items:flex-end;gap:2px;margin-block:14px 8px;border-bottom:1px solid var(--muted);padding-bottom:0}
.pbar{flex:1;min-width:3px;max-width:22px;border-radius:3px 3px 0 0;background:var(--good)}
.pbar.no{background:repeating-linear-gradient(135deg,var(--bad) 0 3px,var(--bad-soft) 3px 6px);outline:1px solid var(--bad);outline-offset:-1px}
.pline{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);pointer-events:none}
.pline em{position:absolute;right:0;top:-1.5em;font-style:normal;font-size:.75rem;color:var(--muted);background:var(--surface);padding:0 4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-bottom:8px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--good)}
.sw.no{background:repeating-linear-gradient(135deg,var(--bad) 0 3px,var(--bad-soft) 3px 6px);outline:1px solid var(--bad)}
.sw.line{background:none;border-top:2px dashed var(--muted);height:0;border-radius:0;vertical-align:3px}
details summary{cursor:pointer;color:var(--accent);margin-block:8px}

/* ===== core: rng + formatting helpers ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
/* number -> display string with true minus sign, trimmed decimals */
function num(n){

function frac(n,d){

/* polynomial pieces: poly([[coef,'x²'],[coef,'x'],[coef,'']]) */
function poly(terms){
  let out='',first=true;
  for(const [c,v] of terms){
    if(c===0) continue;
    const a=Math.abs(c);
    const body = v ? (a===1? v : a+v) : String(a);
    if(first){ out+=(c<0?'−':'')+body; first=false; }

/* build 4 multiple-choice options from numbers */
function mcNum(r,correct,wrongs,fmt=num){
  const seen=new Set([fmt(correct)]); const opts=[];
  for(const w of wrongs){
    if(!isFinite(w)) continue;
    const t=fmt(w);

/* build options from strings; wrongs may contain duplicates of the right one */

 {intro:'A gym charges a one-time sign-up fee plus a fixed monthly rate.',y:'total amount paid, in dollars',Y:'P',x:'number of months of membership',X:'n',unit:'month',sign:1,per:'the monthly rate, in dollars',start:'the sign-up fee, in dollars'},
 {intro:'A seedling is measured when it is planted and then grows at a steady rate.',y:'height of the seedling, in centimeters',Y:'h',x:'number of weeks since planting',X:'w',unit:'week',sign:1,per:'the number of centimeters the seedling grows each week',start:'the height of the seedling, in centimeters, when it was planted'},
 {intro:'A water tank is full at noon and then drains at a constant rate.',y:'volume of water remaining, in liters',Y:'V',x:'number of minutes after noon',X:'t',unit:'minute',sign:-1,per:'the number of liters the tank drains each minute',start:'the volume of water, in liters, in the tank at noon'},
 {intro:'A phone is fully charged at 8 a.m. and the battery level then falls at a steady rate.',y:'battery level, in percent',Y:'B',x:'number of hours after 8 a.m.',X:'h',unit:'hour',sign:-1,per:'the percent of battery lost each hour',start:'the battery level, in percent, at 8 a.m.'},
 {intro:'A savings account opens with an initial deposit, and the same amount is added every week.',y:'balance, in dollars',Y:'S',x:'number of weeks since the account was opened',X:'w',unit:'week',sign:1,per:'the amount, in dollars, added to the account each week',start:'the initial deposit, in dollars'},
];
T('linModel','algebra','Linear models and interpretation',[1,2],(r)=>{
  const ctx=r.pick(LIN_CTX);
  const a=r.int(3,46),b=r.int(6,120)+ (ctx.sign<0?60:0);
  const asked=r.bool()?'slope':'start';
  const eqn=ctx.sign>0?`${b} + ${a}${ctx.X}`:`${b} − ${a}${ctx.X}`;
  const n=r.int(8,15);
  const num_=asked==='slope'?a:b;
  const right=asked==='slope'?ctx.per:ctx.start;
  const other=asked==='slope'?ctx.start:ctx.per;
  return Qs(r,{key:[ctx.Y,a,b,asked,n].join(','),ans:right,
    stem:`${ctx.intro}\n\nThe equation ${ctx.Y} = ${eqn} models the ${ctx.y}, where ${ctx.X} is the ${ctx.x}. In this model, what does the number ${num_} represent?`,
    wrongs:[other,`the ${ctx.y.split(',')[0]} after ${n} ${ctx.unit}s`,`the total number of ${ctx.unit}s that have passed`],
    expl: asked==='slope'
      ? `In ${ctx.Y} = ${eqn}, the coefficient ${a} multiplies ${ctx.X}, so it is the amount ${ctx.Y} changes for each one-${ctx.unit} change in ${ctx.X}. That is ${right}.`
      : `The constant term ${b} is the value of ${ctx.Y} when ${ctx.X} = 0, which is ${right}.`});
});

T('linEq','algebra','Solving linear equations',[1,2],(r)=>{
  const x0=r.int(-9,12),a=r.int(2,8);let c=r.int(1,7);if(c===a)c++;
  const b=r.nz(-9,9);const dd=a*(x0+b)-c*x0;
  const sub=r.pick([['x',x0,'x'],['2x − 1',2*x0-1,'2x − 1'],['x + 3',x0+3,'x + 3'],['3x',3*x0,'3x']]);
  return Q(r,{key:[a,b,c,dd,sub[0]].join(','),ans:sub[1],
    stem:`${a}(x${add(b,'')}) = ${poly([[c,'x'],[dd,'']])}\n\nWhat is the value of ${sub[2]}?`,
    wrongs:[x0,-x0,sub[1]+c,sub[1]-a,x0+b],
    expl:`Distribute: ${poly([[a,'x'],[a*b,'']])} = ${poly([[c,'x'],[dd,'']])}. Move the x-terms to one side: ${a-c}x = ${num(dd-a*b)}, so x = ${num(x0)}.${sub[0]==='x'?'':` Then ${sub[2]} = ${num(sub[1])}.`}`,diff:x0%2?1:2});
});

T('budgetIneq','algebra','Linear inequalities in context',[2],(r)=>{
  const B=r.int(60,200),cn=r.int(3,9),n=r.int(3,7),pn=r.int(2,6);
  const left=B-cn*n,ans=Math.floor(left/pn);
  if(left<pn) return MATH.find(t=>t.id==='budgetIneq').gen(r);
  return Q(r,{key:[B,cn,n,pn].join(','),spr:true,ans,
    stem:`Dara has $${B} to spend on notebooks and pens. Each notebook costs $${cn} and each pen costs $${pn}. If Dara buys exactly ${n} notebooks, what is the greatest number of pens Dara can buy without going over $${B}?`,
    expl:`After ${n} notebooks Dara has $${B} − ${n}·$${cn} = $${left} left. The number of pens p must satisfy ${pn}p ≤ ${left}, so p ≤ ${num(left/pn)}. The greatest whole number is ${ans}.`});
});

T('absVal','algebra','Absolute value equations',[2,3],(r,d)=>{
  const pp=r.int(2,6),t=r.nz(-7,7),rr=r.int(3,18);
  const inner=poly([[pp,'x'],[pp*t,'']]);
  const mode=d===3?r.pick(['sum','diff']):'sum';
  const x1=(rr-pp*t)/pp,x2=(-rr-pp*t)/pp;
  const f=v=>frac(Math.round(v*pp),pp);
  if(mode==='sum')
    return Q(r,{key:[pp,t,rr,'s'].join(','),spr:true,ans:-2*t,
    stem:`What is the sum of the solutions to the equation |${inner}| = ${rr}?`,
    expl:`The expression inside the absolute value equals ${rr} or −${rr}. So ${inner} = ${rr} or ${inner} = −${rr}. The solutions are x = ${f(x1)} and x = ${f(x2)}, and their sum is ${num(-2*t)}.`});
  return Q(r,{key:[pp,t,rr,'d'].join(','),spr:true,ans:2*rr/pp,
    stem:`What is the positive difference between the two solutions to the equation |${inner}| = ${rr}?`,
    expl:`Split into ${inner} = ${rr} and ${inner} = −${rr}. The solutions are x = ${f(x1)} and x = ${f(x2)}. Their positive difference is ${ansTextOf(2*rr/pp)}.`,diff:3});
});

T('linFunc','algebra','Linear functions',[1,2],(r)=>{
  const m=r.nz(-7,9),b=r.int(-12,15),x1=r.int(0,4),x2=x1+r.int(2,5),x3=x2+r.int(2,9);
  const f=x=>m*x+b;
  return Q(r,{key:[m,b,x1,x2,x3].join(','),ans:f(x3),spr:r.bool(0.5),
    stem:`The function f is linear. f(${x1}) = ${num(f(x1))} and f(${x2}) = ${num(f(x2))}. What is the value of f(${x3})?`,
    wrongs:[f(x3)+m,f(x3)-b,m*x3,f(x2)+(x3-x2),f(x3)+2*m],
    expl:`The slope is (${num(f(x2))} − ${pn(f(x1))})/(${x2} − ${x1}) = ${num(m)}. From f(${x1}) = ${num(f(x1))}, the y-intercept is ${num(b)}, so f(x) = ${poly([[m,'x'],[b,'']])}. Then f(${x3}) = ${num(f(x3))}.`});
});

T('ticketSys','algebra','Systems of equations in context',[2],(r)=>{
  const A=r.int(8,30),C=r.int(3,A-2);const na=r.int(12,90),nc=r.int(10,90);
  const total=na+nc,rev=A*na+C*nc;
  const ctx=r.pick([['adult tickets','child tickets','A theater sold','tickets'],['standard seats','student seats','A concert hall sold','seats']]);
  return Q(r,{key:[A,C,na,nc].join(','),ans:na,spr:true,
    stem:`${ctx[2]} ${total} ${ctx[3]} for a total of $${rev}. ${ctx[0][0].toUpperCase()+ctx[0].slice(1)} cost $${A} each and ${ctx[1]} cost $${C} each. How many ${ctx[0]} were sold?`,
    expl:`Let a be the number of ${ctx[0]} and c the number of ${ctx[1]}. Then a + c = ${total} and ${A}a + ${C}c = ${rev}. Substitute c = ${total} − a: ${A}a + ${C}(${total} − a) = ${rev}, so ${A-C}a = ${rev-C*total}, giving a = ${na}.`});
});

T('quadRoots','advmath','Quadratic equations (Vieta)',[2,3],(r,d)=>{
  let p=r.nz(-9,9),q=r.nz(-9,9);if(p===q)q=p>0?p+1:p-1;if(q===0)q=2;
  const b=-(p+q),c=p*q;
  const eq=`x²${b?add(b,'x'):''}${add(c,'')} = 0`;
  const v=r.pick(d===3?['sq','sq','dif','prod']:['sq','prod']);
  if(v==='sq') return Q(r,{key:[p,q,'sq'].join(','),ans:p*p+q*q,spr:r.bool(),
    stem:`If m and n are the two solutions to the equation ${eq}, what is the value of m² + n²?`,wrongs:[b*b,c*c,b*b+2*c,Math.abs(b)+Math.abs(c)],
    expl:`By Vieta's formulas, m + n = ${num(-b)} and mn = ${num(c)}. Then m² + n² = (m + n)² − 2mn = ${b*b} − 2(${num(c)}) = ${num(p*p+q*q)}.`,diff:3});
  if(v==='dif') return Q(r,{key:[p,q,'dif'].join(','),ans:(p-q)*(p-q),spr:true,
    stem:`If m and n are the two solutions to the equation ${eq}, what is the value of (m − n)²?`,
    expl:`(m − n)² = (m + n)² − 4mn = ${b*b} − 4(${num(c)}) = ${num((p-q)*(p-q))}. (Check: the solutions are ${p} and ${q}.)`,diff:3});
  return Q(r,{key:[p,q,'prod'].join(','),ans:c*(p+q),spr:true,
    stem:`If m and n are the two solutions to the equation ${eq}, what is the value of mn(m + n)?`,
    expl:`mn = ${num(c)} and m + n = ${num(-b)}, so mn(m + n) = ${num(c)}·${num(-b)} = ${num(c*(p+q))}.`,diff:2});
});

T('discConst','advmath','Discriminant and number of solutions',[2,3],(r,d)=>{
  if(d===2||r.bool(0.4)){
    const a=r.int(1,8),r0=r.nz(-9,9),b=-2*a*r0,k=a*r0*r0;
    return Q(r,{key:[a,r0,'one'].join(','),spr:r.bool(),ans:k,
      stem:`${poly([[a,'x²'],[b,'x']])} + k = 0\n\nIn the equation above, k is a constant. If the equation has exactly one real solution, what is the value of k?`,
      wrongs:[b*b/(2*a),b*b/a,b/(2*a),k+a,-k],
      expl:`One real solution means the discriminant is zero: b² − 4ac = 0. Here ${pn(b)}² − 4(${a})(k) = 0, so ${b*b} = ${4*a}k and k = ${num(k)}.`,diff:2});
  }
  const a=r.int(1,8),b=2*r.nz(-8,8),T_=b*b/(4*a);
  const kmin=Math.floor(T_)+1;
  const good=kmin+r.int(0,3);
  const wr=[Number.isInteger(T_)?T_:Math.floor(T_),Math.floor(T_)-r.int(1,3),Math.floor(T_)-r.int(4,6),Math.floor(T_)-r.int(7,9)];
  return Q(r,{key:[a,b,'none'].join(','),ans:good,wrongs:wr,
    stem:`${poly([[a,'x²'],[b,'x']])} + k = 0\n\nIn the equation above, k is a constant. Which of the following values of k results in the equation having NO real solutions?`,
    expl:`No real solutions requires a negative discriminant: ${pn(b)}² − 4(${a})k < 0, so ${b*b} < ${4*a}k and k > ${num(T_)}. Only ${num(good)} is greater than ${num(T_)}. (If k equals ${num(T_)} exactly, the equation has one solution.)`,diff:3});
});

T('nonlinSys','advmath','Systems with a quadratic',[2,3],(r,d)=>{
  let p=r.int(-6,6),q=r.int(-6,6);if(p===q)q=p+3;
  const B=p+q,A=r.int(-8,12),C=-p*q-A;
  const eqs=`y = ${poly([[1,'x²'],[-A,'']])}\ny = ${poly([[B,'x'],[C,'']])}`;
  const v=d===3?r.pick(['sy','sy','prod']):r.pick(['dx','prod']);
  if(v==='sy'){const ans=p*p+q*q-2*A;return Q(r,{key:[p,q,A,'sy'].join(','),ans,spr:r.bool(),
    stem:`${eqs}\n\nThe system of equations above has two solutions, (x₁, y₁) and (x₂, y₂). What is the value of y₁ + y₂?`,
    wrongs:[B,C,B*B+2*C,p*p+q*q,2*C],
    expl:`Set the expressions for y equal: ${poly([[1,'x²'],[-A,'']])} = ${poly([[B,'x'],[C,'']])}, which gives ${poly([[1,'x²'],[-B,'x'],[-(A+C),'']])} = 0. Its solutions are x = ${num(p)} and x = ${num(q)}. Substituting into y = ${poly([[1,'x²'],[-A,'']])} gives y = ${num(p*p-A)} and y = ${num(q*q-A)}. The sum is ${num(ans)}.`,diff:3});}
  if(v==='dx'){const ans=Math.abs(p-q);return Q(r,{key:[p,q,A,'dx'].join(','),ans,spr:true,
    stem:`${eqs}\n\nThe system of equations above has two solutions. What is the positive difference between the x-coordinates of the solutions?`,
    expl:`Setting the right sides equal gives x² ${B?add(-B,'x'):''}${add(-(A+C),'')} = 0, which factors as (${xs(p)})(${xs(q)}) = 0. The positive difference between ${num(p)} and ${num(q)} is ${ans}.`,diff:2});}
  const ans=p*q;
  return Q(r,{key:[p,q,A,'pr'].join(','),ans,spr:r.bool(),
    stem:`${eqs}\n\nThe system of equations above has two solutions. What is the product of the x-coordinates of the solutions?`,wrongs:[B,C,-ans,A,-A-C+1],
    expl:`Setting the right sides equal gives ${poly([[1,'x²'],[-B,'x'],[-(A+C),'']])} = 0. By Vieta's formulas, the product of the roots is the constant term, ${num(-(A+C))}.`,diff:2});
});

T('vertexVal','advmath','Quadratic functions: vertex and extremes',[2,3],(r,d)=>{
  const sgn=r.bool(0.7)?1:-1,a=sgn*r.int(1,5),h=r.nz(-5,6),k=r.int(-15,15);
  const b=-2*a*h,c=a*h*h+k;
  return Q(r,{key:[a,h,k].join(','),ans:k,spr:r.bool(0.4),
    stem:`The function f is defined by f(x) = ${poly([[a,'x²'],[b,'x'],[c,'']])}. What is the ${a>0?'minimum':'maximum'} value of f(x)?`,
    wrongs:[c,h,a*h,k+h,-k],
    expl:`The vertex is at x = −b/(2a) = ${num(-b)}/${num(2*a)} = ${num(h)}. Then f(${num(h)}) = ${num(a*h*h)} + ${pn(b*h)} + ${pn(c)} = ${num(k)}. Because a is ${a>0?'positive':'negative'}, the parabola opens ${a>0?'upward':'downward'}, so this is the ${a>0?'minimum':'maximum'}.`,diff:d});
});

T('projectile','advmath','Quadratic models',[2,3],(r)=>{
  const u=r.int(2,7),v=32*u,h0=r.int(2,60);
  const hmax=h0+16*u*u;
  const v_=r.pick(['height','time']);
  if(v_==='height') return Q(r,{key:[u,h0,'h'].join(','),ans:hmax,spr:true,
    stem:`A ball is thrown upward. Its height h, in feet, t seconds after it is thrown is given by h(t) = −16t² + ${v}t + ${h0}. What is the maximum height, in feet, the ball reaches?`,
    expl:`The maximum occurs at t = −b/(2a) = ${v}/32 = ${u} seconds. Then h(${u}) = −16(${u*u}) + ${v*u} + ${h0} = ${hmax} feet.`,diff:3});
  return Q(r,{key:[u,h0,'t'].join(','),ans:u,spr:true,
    stem:`A ball is thrown upward. Its height h, in feet, t seconds after it is thrown is given by h(t) = −16t² + ${v}t + ${h0}. At how many seconds after it is thrown does the ball reach its maximum height?`,
    expl:`For h(t) = at² + bt + c, the maximum is at t = −b/(2a) = −${v}/(2·(−16)) = ${u}.`,diff:2});
});

T('expModel','advmath','Exponential growth and decay',[2],(r)=>{
  const mode=r.pick(['grow','half']);
  if(mode==='grow'){
    const f=r.pick([2,3]),dd=r.pick([2,3,4,5,6]),n=r.int(2,5),N0=r.pick([3,4,5,6,8,10,12,15,20,25]);
    const ans=N0*Math.pow(f,n),what=f===2?'doubles':'triples';
    return Q(r,{key:[f,dd,n,N0,'g'].join(','),spr:true,ans,
      stem:`A colony begins with ${N0} bacteria. The number of bacteria ${what} every ${dd} hours. How many bacteria are in the colony ${dd*n} hours after it begins?`,
      expl:`In ${dd*n} hours there are ${n} periods of ${dd} hours, so the count is multiplied by ${f} a total of ${n} times: ${N0}·${f}^${n} = ${ans}.`});
  }
  const dd=r.pick([2,3,4,5,8,10]),n=r.int(2,5),N0=r.pick([3,5,7,9,11,13,15])*Math.pow(2,n),ans=N0/Math.pow(2,n);
  return Q(r,{key:[dd,n,N0,'h'].join(','),spr:true,ans,
    stem:`A sample of a radioactive isotope has a half-life of ${dd} days. The sample has a mass of ${N0} milligrams at the start. How many milligrams remain after ${dd*n} days?`,
    expl:`${dd*n} days is ${n} half-lives, so the mass is halved ${n} times: ${N0}/2^${n} = ${N0}/${Math.pow(2,n)} = ${ans} milligrams.`});
});

T('remainder','advmath','Polynomial remainder and factor theorems',[2,3],(r,d)=>{
  const rr=r.pick([-3,-2,-1,1,2,3,4]);
  if(d===2||r.bool(0.3)){
    const a=r.nz(-8,8),b=r.nz(-8,8),c=r.nz(-9,9);const R=rr**3+a*rr*rr+b*rr+c;
    return Q(r,{key:[a,b,c,rr,'R'].join(','),ans:R,spr:r.bool(),
      stem:`What is the remainder when p(x) = ${poly([[1,'x³'],[a,'x²'],[b,'x'],[c,'']])} is divided by ${rr>0?`x − ${rr}`:`x + ${-rr}`}?`,
      wrongs:[-R,c,R+rr,p3(a,b,c,-rr)],
      expl:`By the remainder theorem, the remainder when p(x) is divided by ${xs(rr)} is p(${num(rr)}). p(${num(rr)}) = ${num(rr**3)} + ${pn(a*rr*rr)} + ${pn(b*rr)} + ${pn(c)} = ${num(R)}.`,diff:2});
  }
  const a=r.int(-6,6),k0=r.nz(-9,9),c=-(rr**3+a*rr*rr+k0*rr);
  return Q(r,{key:[a,k0,rr,'F'].join(','),ans:k0,spr:true,
    stem:`The polynomial p(x) = x³${a?add(a,'x²'):''} + kx${add(c,'')} has a factor of ${rr>0?`x − ${rr}`:`x + ${-rr}`}, where k is a constant. What is the value of k?`,
    expl:`If ${xs(rr)} is a factor, then p(${num(rr)}) = 0. So ${num(rr**3)} + ${pn(a*rr*rr)} + ${pn(rr)}k + ${pn(c)} = 0, which gives ${num(rr)}k = ${num(-(rr**3+a*rr*rr+c))} and k = ${num(k0)}.`,diff:3});
});
function p3(a,b,c,x){return x**3+a*x*x+b*x+c}

T('radEq','advmath','Radical equations and extraneous solutions',[3],(r)=>{
  let s_,e,m,tries=0;
  do{m=r.int(1,4);s_=r.int(3,13);e=r.int(-10,s_-m-1);tries++}while(((s_+e-m)%2!==0||e>=s_-m||s_===e)&&tries<400);
  if((s_+e-m)%2!==0){m=1;s_=9;e=-4}
  const b=(s_+e-m)/2,a=b*b-s_*e;
  return Q(r,{key:[s_,e,m].join(','),ans:s_,wrongs:[e,b,s_+e,-a,s_+1],
    stem:`What is the solution to the equation √(${poly([[m,'x'],[a,'']])}) = ${poly([[1,'x'],[-b,'']])}?`,
    expl:`Square both sides: ${poly([[m,'x'],[a,'']])} = (${xs(b)})², which simplifies to ${poly([[1,'x²'],[-(2*b+m),'x'],[b*b-a,'']])} = 0, or (${xs(s_)})(${xs(e)}) = 0. So x = ${num(s_)} or x = ${num(e)}. Check each: x = ${num(e)} makes the right side ${num(e-b)}, which is negative, but a square root cannot be negative, so ${num(e)} is extraneous. x = ${num(s_)} works.`,diff:3});
});

T('transform','advmath','Function transformations',[2],(r)=>{
  const px=r.int(-6,6),py=r.int(-8,8),hs=r.nz(-6,6),ks=r.nz(-7,7);
  const gx=`f(x ${hs>0?'−':'+'} ${Math.abs(hs)}) ${ks>0?'+':'−'} ${Math.abs(ks)}`;
  const pt=(x,y)=>`(${num(x)}, ${num(y)})`;
  return Qs(r,{key:[px,py,hs,ks].join(','),ans:pt(px+hs,py+ks),
    stem:`The graph of y = f(x) in the xy-plane has a vertex at ${pt(px,py)}. The function g is defined by g(x) = ${gx}. What are the coordinates of the vertex of the graph of y = g(x)?`,
    wrongs:[pt(px-hs,py+ks),pt(px+hs,py-ks),pt(px-hs,py-ks)],
    expl:`Replacing x with x ${hs>0?'−':'+'} ${Math.abs(hs)} shifts the graph ${Math.abs(hs)} units ${hs>0?'right':'left'}, and ${ks>0?'adding':'subtracting'} ${Math.abs(ks)} shifts it ${Math.abs(ks)} units ${ks>0?'up':'down'}. The vertex moves from ${pt(px,py)} to ${pt(px+hs,py+ks)}.`});
});

T('sqExpand','advmath','Equivalent expressions',[2,3],(r)=>{
  const a=r.int(2,12),b=r.nz(-15,15);
  return Q(r,{key:[a,b].join(','),ans:b*b,spr:true,
    stem:`(ax + b)² = ${poly([[a*a,'x²'],[2*a*b,'x']])} + c\n\nIn the equation above, a, b and c are constants and a > 0. What is the value of c?`,
    expl:`Expanding, (ax + b)² = a²x² + 2abx + b². Matching coefficients: a² = ${a*a}, so a = ${a} (since a > 0). Then 2ab = ${num(2*a*b)} gives b = ${num(b)}. So c = b² = ${b*b}.`,diff:3});
});

T('funcComp','advmath','Function composition',[2],(r)=>{
  const a=r.nz(-3,4),b=r.nz(-6,6),c=r.nz(-9,9),m=r.nz(-4,5),n=r.nz(-7,7),k=r.int(-3,4);
  const f=x=>a*x*x+b*x+c,g=x=>m*x+n;const ord=r.bool();
  const val=ord?f(g(k)):g(f(k));
  return Q(r,{key:[a,b,c,m,n,k,ord?1:0].join(','),ans:val,spr:true,
    stem:`f(x) = ${poly([[a,'x²'],[b,'x'],[c,'']])}\ng(x) = ${poly([[m,'x'],[n,'']])}\n\nWhat is the value of ${ord?'f(g':'g(f'}(${k}))?`,
    expl:ord?`First g(${k}) = ${num(g(k))}. Then f(${num(g(k))}) = ${num(f(g(k)))}.`:`First f(${k}) = ${num(f(k))}. Then g(${num(f(k))}) = ${num(g(f(k)))}.`,diff:2});
});

T('expRules','advmath','Exponent rules',[2],(r)=>{
  const base=r.pick([2,3]),pw=base===2?r.pick([[4,2],[8,3]]):[9,2];
  const a=r.nz(-4,6),b=r.int(1,7),c=r.int(1,5);const x=b+pw[1]*c-a;
  return Q(r,{key:[base,pw[0],a,b,c].join(','),ans:x,spr:true,

});

const ci=(x,y)=>`${num(x)} ${y<0?'−':'+'} ${Math.abs(y)===1?'':Math.abs(y)}i`;
T('complexMul','advmath','Complex numbers',[2,3],(r,d)=>{

    stem:`(${ci(a,b)})(${ci(c,dd)}) = x + yi\n\nIn the equation above, i = √(−1), and x and y are real numbers. What is the value of ${which?'x':'y'}?`,
    expl:`Use FOIL: ${pn(a)}·${pn(c)} + ${pn(a)}·${pn(dd)}i + ${pn(b)}·${pn(c)}i + ${pn(b)}·${pn(dd)}i² = ${num(a*c)} + ${pn(a*dd)}i + ${pn(b*c)}i + ${pn(b*dd)}i². Since i² = −1, the last term is ${num(-b*dd)}. Combine like terms: ${ci(re,im)}. So ${which?'x':'y'} = ${num(which?re:im)}.`,diff:d});

const fmtPi=(n,d)=>{const g=gcd(n,d)||1;n/=g;d/=g;return (n===1?'':n)+'π'+(d===1?'':'/'+d)};
const pct=n=>num(n)+'%';

T('pctSucc','data','Percentages and percent change',[2,3],(r,d)=>{
  if(d===3||r.bool(0.45)){
    const ps=[10,20,25,30,40,50,60,75,80];
    const p=r.pick(ps),q=r.pick(ps);

    const what=r.pick([['price of a jacket','increased','decreased'],['population of a town','increased','decreased'],['number of subscribers','increased','decreased']]);
    return Q(r,{key:[p,q,what[0]].join(','),ans:ch,fmt:pct,wrongs:[p-q,-(q-p)+0,(p-q)/2,ch+10,ch-5,-q],
      stem:`The ${what[0]} was ${what[1]} by ${p}% and then, a year later, ${what[2]} by ${q}%. Which of the following is the overall percent change, from the original value to the final value?`,
      expl:`Use multipliers: an increase of ${p}% multiplies by ${(1+p/100).toFixed(2)}, and a decrease of ${q}% multiplies by ${(1-q/100).toFixed(2)}. The product is ${((100+p)*(100-q)/10000).toFixed(4).replace(/0+$/,'').replace(/\.$/,'')}, so the overall change is ${pct(ch)}. Percent changes cannot simply be added or subtracted because the second one applies to a different base.`,diff:3});
  }
  const dsc=r.pick([10,20,25,30,40,50]),orig=r.int(2,30)*20;

    expl:`The sale price is ${100-dsc}% of the original, so 0.${String(100-dsc).padStart(2,'0')} × original = ${num(X)}. Dividing, original = ${num(X)}/${((100-dsc)/100).toFixed(2)} = ${num(orig)}. (Adding ${dsc}% to the sale price gives the wrong answer because the ${dsc}% was taken from the original, not the sale price.)`,diff:2});
});

      expl:`The median is the 4th value (${L[3]}), which does not change. The sum goes up by ${M2-M}, so the mean increases. The range goes from ${M-L[0]} to ${M2-L[0]}, so it increases too.`,diff:3});
  }

T('wavg','data','Weighted averages',[2,3],(r,d)=>{
  let n1,n2,m1,m2,t=0;
  do{n1=r.int(8,30);n2=r.int(5,28);m1=r.int(60,95);m2=r.int(55,98);t++}while(((n1*m1+n2*m2)%(n1+n2)!==0||m1===m2)&&t<500);
  const avg=(n1*m1+n2*m2)/(n1+n2);
  if(d===3){
    return Q(r,{key:[n1,n2,m1,m2,'r'].join(','),spr:true,ans:m2,
      stem:`A class of ${n1} students had a mean score of ${m1} on an exam. A second class took the same exam. When the scores of both classes are combined, the mean score of all ${n1+n2} students is ${num(avg)}. What was the mean score of the second class?`,
      expl:`The combined total is ${n1+n2}·${num(avg)} = ${num(avg*(n1+n2))}. The first class contributed ${n1}·${m1} = ${n1*m1}. The second class's total is ${num(avg*(n1+n2)-n1*m1)} for ${n2} students, so its mean is ${m2}.`,diff:3});
  }
  return Q(r,{key:[n1,n2,m1,m2].join(','),spr:true,ans:avg,
    stem:`One class of ${n1} students had a mean score of ${m1} on a test. Another class of ${n2} students had a mean score of ${m2} on the same test. What is the mean score of all ${n1+n2} students combined?`,
    expl:`Weight each mean by class size: (${n1}·${m1} + ${n2}·${m2})/(${n1}+${n2}) = ${n1*m1+n2*m2}/${n1+n2} = ${num(avg)}. Averaging ${m1} and ${m2} directly would ignore that the classes have different sizes.`,diff:2});
});

T('circleEq','geometry','Circles in the coordinate plane',[2,3],(r,d)=>{
  const h=r.int(-6,6),k=r.int(-6,6),rr=r.int(2,10);
  const D=-2*h,E=-2*k,F=h*h+k*k-rr*rr;
  const eq=`${poly([[1,'x²'],[1,'y²'],[D,'x'],[E,'y'],[F,'']])} = 0`;
  const v=d===3?r.pick(['hkr','hkr','c']):r.pick(['r','c']);
  if(v==='hkr') return Q(r,{key:[h,k,rr,'s'].join(','),spr:r.bool(0.6),ans:h+k+rr,
    stem:`The equation ${eq} defines a circle in the xy-plane. If the circle has center (h, k) and radius r, what is the value of h + k + r?`,
    wrongs:[h+k,rr*rr+h+k,-h-k+rr,D+E+rr],
    expl:`Complete the square: (x² ${add(D,'x').trim()}) + (y² ${add(E,'y').trim()}) = ${num(-F)} becomes (${xs(h)})² + (${xs(k,'y')})² = ${num(-F+h*h+k*k)}. The center is (${num(h)}, ${num(k)}) and r² = ${rr*rr}, so r = ${rr}. Then h + k + r = ${num(h+k+rr)}.`,diff:3});
  if(v==='r') return Q(r,{key:[h,k,rr,'r'].join(','),spr:true,ans:rr,
    stem:`(${xs(h)})² + (${xs(k,'y')})² = ${rr*rr}\n\nWhat is the radius of the circle in the xy-plane defined by the equation above?`,
    wrongs:[rr*rr,rr/2,rr*2],expl:`The standard form is (x − h)² + (y − k)² = r². Here r² = ${rr*rr}, so r = ${rr}.`,diff:2});
  const px=h+r.int(1,6),py=k+r.int(-5,5);
  const r2=(px-h)**2+(py-k)**2;
  return Q(r,{key:[h,k,px,py,'c'].join(','),spr:true,ans:r2,
    stem:`A circle in the xy-plane has center (${num(h)}, ${num(k)}) and passes through the point (${num(px)}, ${num(py)}). What is the value of r², where r is the radius of the circle?`,
    wrongs:[Math.sqrt(r2),Math.abs(px-h)+Math.abs(py-k)],
    expl:`The radius is the distance from the center to the point, so r² = (${px} − ${pn(h)})² + (${py} − ${pn(k)})² = ${(px-h)**2} + ${(py-k)**2} = ${r2}.`,diff:2});
});

const TRIPLES=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29],[9,40,41],[12,35,37],[11,60,61]];
T('rightTrig','geometry','Right triangle trigonometry',[2,3],(r,d)=>{
  if(d===3||r.bool(0.35)){
    const A=r.int(1,3),B=r.int(1,4),x0=r.int(6,14),C=90-(A+B)*x0;
    if(Math.abs(C)>50||C===0) return MATH.find(t=>t.id==='rightTrig').gen(r,2);
    return Q(r,{key:[A,B,x0,'c'].join(','),spr:true,ans:x0,
      stem:`In a right triangle, the two acute angles are labeled P and Q. sin(${A}x°) = cos(${poly([[B,'x'],[C,'']])}°), where x is a constant and both angles are acute. What is the value of x?`,
      expl:`The sine of an angle equals the cosine of its complement: sin(θ) = cos(90° − θ). So ${A}x + (${poly([[B,'x'],[C,'']])}) = 90, which gives ${A+B}x = ${num(90-C)} and x = ${x0}.`,diff:3});
  }
  const t=r.pick(TRIPLES),m=r.int(1,9),[a,b,c]=t;
  const sw=r.bool();
  const ratio=sw?`sin A = ${a}/${c}`:`cos A = ${b}/${c}`;
  const ans=sw?m*a:m*a; // side BC opposite A
  return Q(r,{key:[a,b,c,m,sw?1:0].join(','),spr:r.bool(0.5),ans,
    stem:`In right triangle ABC, the right angle is at C and ${ratio}. If AB = ${m*c}, what is the length of BC?`,
    wrongs:[m*b,m*c,m*(a+b),m*a+1],
    expl: sw?`sin A = opposite/hypotenuse = BC/AB. So BC = AB·sin A = ${m*c}·${a}/${c} = ${m*a}.`
            :`cos A = AC/AB = ${b}/${c}, so AC = ${m*b}. By the Pythagorean theorem BC = √(${m*c}² − ${m*b}²) = √${(m*c)**2-(m*b)**2} = ${m*a}.`,diff:2});
});

T('similar','geometry','Similar figures',[2],(r)=>{
  const pq=r.pick([[3,2],[5,2],[5,3],[4,3],[5,4],[7,4],[7,5],[8,5]]);
  const [p,q]=pq,u=r.int(1,3),t=r.int(2,9);
  return Q(r,{key:[p,q,u,t].join(','),spr:true,ans:p*p*t,
    stem:`Triangle ABC is similar to triangle DEF, where AB corresponds to DE. AB = ${q*u} and DE = ${p*u}. The area of triangle ABC is ${q*q*t}. What is the area of triangle DEF?`,
    wrongs:[p*q*t,q*q*t*p/q,p*t],
    expl:`The scale factor from ABC to DEF is DE/AB = ${p*u}/${q*u}, which simplifies to ${p}/${q}. Areas scale by the square of the scale factor, (${p}/${q})² = ${p*p}/${q*q}. So the area of DEF is ${q*q*t}·${p*p}/${q*q} = ${p*p*t}.`});
});

T('arcAngle','geometry','Arc length, sectors and radians',[2,3],(r,d)=>{
  if(d===2||r.bool(0.5)){
    const rr=r.pick([6,8,9,10,12,15,16,18,20,24]),a=r.int(2,22);
    if(gcd(a,rr)===rr) return MATH.find(t=>t.id==='arcAngle').gen(r,2);
    const good=fmtPi(a,rr);
    return Qs(r,{key:[rr,a,'rad'].join(','),ans:good,
      wrongs:[fmtPi(rr,a),String(num(a/rr)),fmtPi(2*a,rr),fmtPi(a*rr,1)].filter(x=>x!==good),
      stem:`In a circle with radius ${rr}, a central angle intercepts an arc of length ${a}π. What is the measure of the central angle, in radians?`,
      expl:`Arc length s = rθ when θ is in radians, so θ = s/r = ${a}π/${rr}, which is ${good} in lowest terms.`,diff:2});
  }
  const th=r.pick([30,45,60,72,90,120,135,150,180,240,270]),rr=r.int(4,18);
  const num_=th*rr*rr,good=fmtPi(num_,360);
  return Qs(r,{key:[th,rr,'sec'].join(','),ans:good,
    wrongs:[fmtPi(th*rr,180),fmtPi(th*rr*rr,180),fmtPi(th*rr,360),fmtPi(th*rr*rr,720)].filter(x=>x!==good),
    stem:`A sector of a circle has a central angle of ${th}° and a radius of ${rr}. What is the area of the sector?`,
    expl:`The sector is ${th}/360 of the full circle. The circle's area is π·${rr}² = ${rr*rr}π, so the sector's area is (${th}/360)·${rr*rr}π = ${good}.`,diff:3});
});

T('volScale','geometry','Volume and scaling',[3],(r)=>{
  const shape=r.pick([['right circular cylinder','radius','r'],['right circular cone','radius','r'],['square pyramid','base edge length','s']]);
  const ra=r.pick([2,3,4,5,0.5,1.5,2.5]),hb=r.pick([2,3,4,5,0.5,0.25,1.5]);
  const f=ra*ra*hb;
  if(f===1) return MATH.find(t=>t.id==='volScale').gen(r);
  const fm=x=>`The volume is multiplied by ${num(x)}.`;
  const formula=shape[0].includes('pyramid')?'V = (1/3)s²h':shape[0].includes('cone')?'V = (1/3)πr²h':'V = πr²h';
  return Q(r,{key:[shape[0],ra,hb].join(','),ans:f,fmt:fm,wrongs:[ra*hb,ra+hb,ra*hb*hb,ra*ra+hb,ra**3*hb],
    stem:`A ${shape[0]} has ${shape[1]==='radius'?'a radius':'a base edge length'} ${shape[2]} and a height h. A second ${shape[0]} has ${shape[1]==='radius'?'a radius':'a base edge length'} that is ${num(ra)} times that of the first and a height that is ${num(hb)} times the height of the first. By what factor is the volume of the second solid related to the volume of the first?`,
    expl:`The volume formula is ${formula}. The ${shape[1]} appears squared and the height appears once, so the new volume is ${num(ra)}² · ${num(hb)} = ${num(f)} times the original. Doubling or tripling a length that is squared changes the volume by the square of that factor.`,diff:3});
});

T('radDeg','geometry','Radians and degrees',[1],(r)=>{
  const d_=r.pick([2,3,4,5,6,9,10,12,15,18,20]);let n=r.int(1,23);
  while((180*n)%d_!==0||gcd(n,d_)!==1) n=r.int(1,23+d_);
  const ans=180*n/d_;
  return Q(r,{key:[n,d_].join(','),spr:true,ans,
    stem:`An angle measures ${fmtPi(n,d_)} radians. What is the measure of the angle, in degrees?`,
    expl:`Multiply by 180/π: ${fmtPi(n,d_)} × 180/π = ${180*n}/${d_} = ${ans}°.`});
});

T('ladder','geometry','Pythagorean theorem',[1,2],(r)=>{
  const t=r.pick(TRIPLES),m=r.int(1,6),[a,b,c]=t,ctx=r.pick(['ladder','screen','field']);
  const A=m*a,B=m*b,C=m*c;
  const txt={
    ladder:`A ladder ${C} feet long leans against a vertical wall. The base of the ladder is ${B} feet from the wall on level ground. How many feet above the ground does the top of the ladder touch the wall?`,
    screen:`The diagonal of a rectangular television screen is ${C} inches long, and the width of the screen is ${B} inches. What is the height of the screen, in inches?`,
    field:`A rectangular field has a diagonal path of length ${C} meters. One side of the field is ${B} meters long. What is the length, in meters, of the other side of the field?`}[ctx];
  return Q(r,{key:[ctx,a,b,c,m].join(','),spr:true,ans:A,wrongs:[B,C,C-B],stem:txt,
    expl:`The two sides and the diagonal form a right triangle with hypotenuse ${C}. The missing side is √(${C}² − ${B}²) = √${C*C-B*B} = ${A}.`});
});

T('inscribed','geometry','Circle theorems',[2],(r)=>{
  const th=2*r.int(15,88),mode=r.pick(['half','double']);
  if(mode==='half') return Q(r,{key:[th,'h'].join(','),spr:true,ans:th/2,
    stem:`Points A, B and C lie on a circle with center O. The measure of central angle ∠AOB is ${th}°, and C is on the major arc AB. What is the measure of inscribed angle ∠ACB, in degrees?`,
    expl:`An inscribed angle measures half of the central angle that intercepts the same arc: ${th}/2 = ${th/2}°.`});
  return Q(r,{key:[th,'d'].join(','),spr:true,ans:th,
    stem:`Points A, B and C lie on a circle with center O. The measure of inscribed angle ∠ACB is ${th/2}°, and C is on the major arc AB. What is the measure of central angle ∠AOB, in degrees?`,
    expl:`The central angle is twice the inscribed angle on the same arc: 2 × ${th/2} = ${th}°.`});
});

T('triAngles','geometry','Angles in triangles',[1,2],(r)=>{
  const x0=r.int(12,28),a=r.int(2,20),c=180-6*x0-a;
  const A=x0,B=2*x0+a,C=3*x0+c;
  if(A+B+C!==180||Math.abs(c)>60||c===0) return MATH.find(t=>t.id==='triAngles').gen(r);
  return Q(r,{key:[x0,a].join(','),spr:true,ans:Math.max(A,B,C),
    stem:`In triangle ABC, the measure of angle A is x°, the measure of angle B is ${poly([[2,'x'],[a,'']])}°, and the measure of angle C is ${poly([[3,'x'],[c,'']])}°. What is the measure, in degrees, of the largest angle of the triangle?`,
    expl:`The angles of a triangle sum to 180°: x + (${poly([[2,'x'],[a,'']])}) + (${poly([[3,'x'],[c,'']])}) = 180, so ${poly([[6,'x'],[a+c,'']])} = 180 and x = ${x0}. The angles are ${A}°, ${B}° and ${C}°, so the largest is ${Math.max(A,B,C)}°.`});
});

/* ===== Reading & Writing: Standard English Conventions generators (unlimited) ===== */
const RWT=[];
function C(id,skill,diffs,gen){RWT.push({id,domain:'conventions',skill,diffs,gen,section:'rw',time:60})}
const CONV_STEM='Which choice completes the text so that it conforms to the conventions of Standard English?';
const lcFirst=s=>s.charAt(0).toLowerCase()+s.slice(1);
function QC(r,o){
  const m=mcStr(r,o.ans,o.wrongs);
  return {key:o.key,passage:o.passage,stem:o.stem||CONV_STEM,type:'mc',choices:m.choices,answer:m.answer,expl:o.expl,diff:o.diff};
}

/* ---- subject-verb agreement with an intervening phrase ---- */
const SVA_NP=[
 ['The collection of rare maps','collection','maps',true],['The stack of unsigned contracts','stack','contracts',true],
 ['The series of public lectures','series','lectures',true],['The bundle of old letters','bundle','letters',true],
 ['The list of finalists','list','finalists',true],['The box of antique tools','box','tools',true],
 ['The array of solar panels','array','panels',true],['The set of ancient coins','set','coins',true],
 ['The bouquet of wildflowers','bouquet','wildflowers',true],['The archive of wartime photographs','archive','photographs',true],
 ['The maps in the northern archive','maps','archive',false],['The contracts on the manager’s desk','contracts','desk',false],
 ['The lectures from last spring','lectures','spring',false],['The letters inside the trunk','letters','trunk',false],
 ['The panels along the roof','panels','roof',false],['The coins from the shipwreck','coins','shipwreck',false],
 ['The tools beside the workbench','tools','workbench',false],['The finalists on the shortlist','finalists','shortlist',false],
 ['The photographs in the album','photographs','album',false],['The wildflowers by the stream','wildflowers','stream',false]
];
const SVA_REST=['displayed in the east gallery','stored in a climate-controlled vault','available to visiting scholars','protected by a team of conservators','open to the public on weekends','checked every morning for damage','kept in a locked cabinet','reserved for research use'];
const NOW=['Today,','At present,','Currently,','These days,'];
C('sva','Subject-verb agreement',[1,2],(r,d)=>{
  const [np,head,obj,sing]=r.pick(SVA_NP),rest=r.pick(SVA_REST),mk=r.pick(NOW);
  const ans=sing?'is':'are';
  return QC(r,{key:[np,rest,mk].join('|'),passage:`${mk} ${lcFirst(np)} ______ ${rest}.`,ans,
    wrongs:sing?['are','were','being']:['is','was','being'],
    expl:`The subject is “${head},” which is ${sing?'singular':'plural'}. “${obj}” is part of the phrase that follows and does not control the verb. A ${sing?'singular':'plural'} subject in the present tense takes “${ans}.” “${sing?'were':'was'}” is the wrong tense and number, and “being” cannot serve as the main verb.`,diff:d});
});

/* ---- pronoun-antecedent agreement ---- */
const PR_SING=['The museum','The software company','The university','The hospital','The bakery','The newspaper','The library','The airline','The factory','The charity'];
const PR_PLUR=['The museum curators','The engineers','The volunteers','The council members','The architects','The researchers','The farmers','The teachers'];
const PR_FRAME=[['revised','budget after the review'],['defended','decision at the public hearing'],['submitted','proposal ahead of the deadline'],['presented','findings at the annual meeting'],['updated','website over the weekend'],['announced','plans for the new season']];
const PR_TIME=['Last month,','In the spring,','Earlier this year,','After a long review,','On Tuesday,','Before the vote,'];
C('pronoun','Pronoun-antecedent agreement',[1,2],(r,d)=>{
  const sing=r.bool(),subj=r.pick(sing?PR_SING:PR_PLUR),[v,rest]=r.pick(PR_FRAME),tm=r.pick(PR_TIME);
  const ans=sing?'its':'their';
  return QC(r,{key:[subj,v,tm].join('|'),passage:`${tm} ${lcFirst(subj)} ${v} ______ ${rest}.`,ans,
    wrongs:sing?['their','it’s','they’re']:['its','it’s','they’re'],
    expl:`The pronoun refers to “${lcFirst(subj)},” which is ${sing?'singular':'plural'}, so it needs the ${sing?'singular':'plural'} possessive pronoun “${ans}.” “It’s” means “it is” or “it has,” and “they’re” means “they are,” so neither works before a noun.`,diff:d});
});

/* ---- apostrophes: plural vs possessive ---- */
const AP_NOUN=['writer','teacher','engineer','student','farmer','pilot','athlete','nurse','architect','chef','scientist','musician','mechanic','dancer'];
const AP_THING=[['essay','essays'],['design','designs'],['lesson plan','lesson plans'],['recipe','recipes'],['finding','findings'],['performance','performances'],['proposal','proposals'],['sketch','sketches']];
C('apos','Possessives and plurals',[1,2],(r,d)=>{
  const n=r.pick(AP_NOUN),[ts,tp]=r.pick(AP_THING),k=r.pick(['both','each','several']);
  if(k==='both') return QC(r,{key:[n,tp,k].join('|'),passage:`Both ______ ${tp} were recognized at the awards ceremony.`,ans:`${n}s’`,wrongs:[`${n}’s`,`${n}s`,n],
    expl:`“Both” signals more than one ${n}, and the ${tp} belong to them, so the noun must be plural and possessive: “${n}s’.” “${n}’s” is singular possessive, and “${n}s” shows no possession.`,diff:d});
  if(k==='each') return QC(r,{key:[n,ts,k].join('|'),passage:`Each ______ ${ts} was reviewed by a panel of judges.`,ans:`${n}’s`,wrongs:[`${n}s’`,`${n}s`,n],
    expl:`“Each” points to one ${n} at a time, and the ${ts} belongs to that person, so the singular possessive “${n}’s” is needed. “${n}s’” is plural possessive, which conflicts with “each.”`,diff:d});
  return QC(r,{key:[n,k].join('|'),passage:`Several ______ arrived early to set up the display.`,ans:`${n}s`,wrongs:[n,`${n}’s`,`${n}s’`],
    expl:`“Several” requires a plural noun, and nothing is owned in this sentence, so the plain plural “${n}s” is correct. An apostrophe would only be used to show possession.`,diff:d});
});

/* ---- commas around an appositive ---- */
const AP_PEOPLE=[['Priya Raman','a structural engineer'],['Marcus Bell','the team’s longtime coach'],['Dr. Lena Park','a marine biologist'],['Tomás Rivera','a former city planner'],['Aiko Tanaka','a self-taught programmer'],['Samira Haddad','the festival’s lead organizer'],['Professor Okoye','a specialist in medieval law'],['Elena Petrova','an award-winning cellist'],['Daniel Osei','the region’s chief hydrologist'],['Grace Lin','a retired schoolteacher'],['Mateo Silva','a documentary filmmaker'],['Nadia Karim','the library’s head archivist'],['Omar Haddad','a veteran wildlife photographer'],['Keiko Mori','the school’s new principal'],['Luis Ortega','a visiting economist'],['Hannah Cole','the club’s treasurer'],['Ravi Menon','a volunteer firefighter'],['Sofia Duarte','a geologist with the survey'],['Ibrahim Yusuf','the museum’s head curator'],['Mei Ling Chen','a translator of classical poetry'],['Carlos Mendes','a former Olympic swimmer'],['Beatrice Nwosu','the city’s poet laureate'],['Jonas Weber','a software architect'],['Fatima Zahra','a community health worker']];
const AP_VERB=[['presented','the committee’s final report to the council'],['reviewed','the design plan before the vote'],['summarized','the findings at the annual conference'],['approved','the revised schedule on Monday'],['defended','the proposal during the public hearing'],['published','the first survey of the region’s wetlands']];
C('appositive','Commas with nonessential phrases',[2],(r,d)=>{
  const [nm,role]=r.pick(AP_PEOPLE),[v,rest]=r.pick(AP_VERB);
  const good=`${nm}, ${role}, ${v}`;
  return QC(r,{key:[nm,v].join('|'),passage:`Yesterday, ______ ${rest}.`,ans:good,
    wrongs:[`${nm}, ${role} ${v}`,`${nm} ${role}, ${v}`,`${nm} ${role} ${v}`],
    expl:`“${role}” is an appositive: extra information that renames the subject. A nonessential phrase like this must be set off by a pair of commas, one before and one after, so that the subject and verb stay connected. The other choices omit one or both commas.`,diff:d});
});

/* ---- dangling modifiers ---- */
const DM_OPEN=['Having reviewed the data for several hours','Exhausted after the long hike','Hoping to improve the team’s results','Walking along the shore at dawn','After studying the map carefully','Determined to finish before sunset','Surprised by the early snowfall','Having trained for months'];
const DM_AGENT=['the engineer','the coach','the hikers','the lead researcher','the volunteers','the designer','the pilot','the surveyors','the students','the project manager'];
const DM_PRED=['decided to change the plan.','felt ready to continue.','wrote a detailed summary of the day.','stopped to rest for a while.','called the others to share the news.','made a few notes before moving on.'];
const DM_BAD=['the final report was due on Friday.','the schedule changed twice that week.','a new deadline was announced.','the weather turned stormy.','the instructions were unclear.','the next meeting was moved.','several errors appeared in the results.','the budget had been cut.'];
C('dangling','Modifier placement',[2,3],(r,d)=>{
  const op=r.pick(DM_OPEN),ag=r.pick(DM_AGENT),pr=r.pick(DM_PRED);
  const good=`${ag} ${pr}`;
  const bad=r.sample(DM_BAD,3);
  return QC(r,{key:[op,ag,pr,bad.join(',')].join('|'),passage:`${op}, ______`,ans:good,wrongs:bad,
    expl:`An opening phrase like “${lcFirst(op)}” describes a person or group who does something, so the noun right after the comma must be that person or group. “${ag}” can carry out that action; the other subjects (reports, schedules, weather, and so on) cannot, which would leave the modifier dangling.`,diff:d});
});

/* ---- parallel structure ---- */
const PAR=[['hike','hiking'],['swim','swimming'],['paint','painting'],['bake','baking'],['cycle','cycling'],['read','reading'],['write','writing'],['dance','dancing'],['garden','gardening'],['sail','sailing'],['sketch','sketching'],['cook','cooking'],['climb','climbing'],['travel','traveling'],['volunteer','volunteering'],['code','coding']];
const PAR_LEAD=['Her favorite weekend activities include','The summer camp offers classes in','Over the break, Ravi spent his time','The club’s members spend Saturdays'];
C('parallel','Parallel structure',[2],(r,d)=>{
  const [a,b,c]=r.sample(PAR,3),lead=r.pick(PAR_LEAD);
  const form=(w)=>w[1];
  const passage=lead==='Over the break, Ravi spent his time'?`${lead} ${form(a)}, ${form(b)}, and ______.`:
                lead==='The club’s members spend Saturdays'?`${lead} ${form(a)}, ${form(b)}, and ______.`:`${lead} ${form(a)}, ${form(b)}, and ______.`;
  return QC(r,{key:[lead,a[0],b[0],c[0]].join('|'),passage,ans:c[1],wrongs:[`to ${c[0]}`,c[0],`${c[0]}s`],
    expl:`Items in a list should have the same grammatical form. “${a[1]}” and “${b[1]}” are -ing forms, so the last item should be “${c[1]}.” “to ${c[0]},” “${c[0]},” and “${c[0]}s” would break the parallel pattern.`,diff:d});
});

/* ---- verb tense with a clear time marker ---- */
const TN=[['test','tested','the water samples'],['repair','repaired','the damaged roof'],['measure','measured','the depth of the river'],['record','recorded','every interview'],['inspect','inspected','the bridge supports'],['survey','surveyed','the entire coastline'],['revise','revised','the opening chapter'],['clean','cleaned','the laboratory equipment']];
const TN_MK=['Last winter,','Two years ago,','In 1998,','Yesterday,','Last spring,','In the summer of 2019,'];
const TN_SUBJ=['the crew','the specialist','the team','the technician'];
C('tense','Verb tense and time',[1],(r,d)=>{
  const [b,p,o]=r.pick(TN),mk=r.pick(TN_MK),sj=r.pick(TN_SUBJ);
  return QC(r,{key:[b,mk,sj].join('|'),passage:`${mk} ${sj} ______ ${o}.`,ans:p,wrongs:[`${b}s`,`will ${b}`,`has ${p}`],
    expl:`“${mk.replace(/,$/,'')}” places the action in the past, so the verb must be in the simple past tense: “${p}.” The present (“${b}s”), future (“will ${b}”), and present perfect (“has ${p}”) all conflict with that time marker.`,diff:d});
});
