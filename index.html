/* ---------- Craft & Structure: purpose, structure, cross-text ---------- */
B('craft','Text structure and purpose',2,'In the early 2000s, urban planners in Medellín, Colombia, built cable cars linking hillside neighborhoods to the city’s metro. Residents who once spent hours commuting could reach downtown in minutes. Some skeptics doubted the project’s value, but a later survey found that nearby neighborhoods saw rising employment and declining violence.',Q_PURP,['To describe a transportation project and report its apparent effects','To argue that cable cars should replace subways in all large cities','To compare Medellín’s metro system with those of other cities','To criticize skeptics of large public works'],0,'The text describes what was built, then reports what happened afterward. It does not argue for replacing subways or compare systems, and the skeptics are mentioned only briefly.');
B('craft','Text structure and purpose',2,'Linguists once assumed that children acquire grammar mainly by imitating adults. Yet children routinely say things they have never heard, such as “I goed to the park,” applying a regular rule to a verb that does not follow it. This pattern suggests that children are not merely copying but actively inferring rules.','Which choice best describes the function of the second sentence in the text?',['It presents evidence that complicates the assumption described in the first sentence.','It defends the assumption described in the first sentence.','It introduces a theory unrelated to the first sentence.','It defines a term that was used in the first sentence.'],0,'The first sentence states an old assumption. The second gives a pattern (children’s errors) that the assumption cannot easily explain, so it complicates the assumption.');
B('craft','Text structure and purpose',3,'In her poem “Inventory,” Wang Lian lists the contents of her grandmother’s kitchen (chipped bowls, a dented kettle, a jar of salted plums) before ending abruptly with the line “None of these are the thing itself.” The list-like form leads readers to expect completeness, and the final line withholds it.',Q_PURP,['To explain how a poem’s form creates an expectation and then undercuts it','To argue that lists are the most effective structure for poetry','To summarize the history of the poet’s family','To criticize the poem for lacking a clear ending'],0,'The text explains how the list form sets up an expectation of completeness and how the last line denies it. The other choices claim more than the text supports.');
B('craft','Text structure and purpose',2,'Dr. Kamala Reddy studies how bees navigate. For decades, researchers believed bees relied mainly on the sun’s position. Reddy’s team, however, trained bees to fly through a tunnel lined with moving stripes and found that the insects misjudged distances when the stripes moved, indicating that they also gauge distance by how quickly scenery passes.','Which choice best describes the overall structure of the text?',['It introduces a researcher, states a longstanding belief, and then describes an experiment that revises it.','It states a hypothesis, rejects it, and proposes a policy.','It describes an experiment and then lists unanswered questions.','It compares two researchers’ opposing methods.'],0,'The text names the researcher, gives the older belief about the sun, then describes an experiment showing bees also use visual flow. The other structures do not appear.');
B('craft','Text structure and purpose',3,'The 1848 journal entry records a farmer’s alarm at watching a neighbor’s wheat vanish to locusts in a single afternoon. The writer speculates that the swarm came from the dry prairie to the west and fears the same fate for his own fields. Only at the entry’s close does he mention that his own wheat, harvested a week earlier, was spared.','Which choice best describes the overall structure of the text?',['It describes a distressing event, offers a possible cause, and then reveals a fortunate detail.','It poses a question, offers three answers, and chooses one.','It praises a farming method and then lists its drawbacks.','It narrates a conflict between two neighbors and its resolution.'],0,'The text moves from the locust attack to a guess about its origin and ends with the detail that the writer’s own wheat was already harvested.');
B('craft','Cross-text connections',2,'Text 1: Economist Dana Whitfield argues that remote work increases productivity because employees lose less time to commuting and report fewer interruptions.\nText 2: Organizational researcher Paul Ngata cautions that most studies of remote productivity rely on self-reports, which may overstate gains; studies using objective output measures find smaller improvements.','Based on the texts, how would Ngata most likely respond to Whitfield’s claim?',['By suggesting that the productivity gains may be real but smaller than self-reported evidence implies','By arguing that remote workers are less productive than office workers','By agreeing that commuting time is the only factor affecting productivity','By claiming that objective output cannot be measured'],0,'Ngata says objective measures still show improvements, only smaller ones. He does not say remote workers are less productive or that output cannot be measured.');
B('craft','Cross-text connections',2,'Text 1: Many ecologists propose reintroducing wolves to the Scottish Highlands to reduce overgrazing by deer, which would allow native woodland to regrow.\nText 2: Farmers’ groups warn that wolves would threaten livestock and argue that fencing deer out of regenerating woodland is cheaper and safer.','Based on the texts, how would the authors of Text 2 most likely respond to the proposal in Text 1?',['By suggesting that a less risky approach could achieve the same goal','By denying that overgrazing harms woodland','By supporting the reintroduction if livestock were compensated','By arguing that deer populations are too small to matter'],0,'Text 2 accepts the goal (woodland regrowth) but proposes fencing as a cheaper, safer alternative. It does not deny overgrazing or discuss compensation.');
B('craft','Cross-text connections',3,'Text 1: Historian Alma Reyes contends that the printing press caused the Reformation by placing cheap pamphlets in the hands of ordinary readers.\nText 2: Historian Ivo Berg grants that the press accelerated the Reformation but notes that discontent with church authority had been growing for a century before Gutenberg.','Based on the texts, how would Berg most likely characterize Reyes’s claim?',['As overstating the press’s role by overlooking earlier causes','As correct because the press was the only factor','As irrelevant to the history of the Reformation','As supported by evidence that discontent began after the press'],0,'Berg agrees the press mattered but stresses earlier discontent, so he would say Reyes gives the press too much credit as the cause.');

/* ---------- Information & Ideas ---------- */
B('ideas','Central ideas and details',2,'When astronomer Henrietta Leavitt catalogued thousands of variable stars in the early 1900s, she noticed that the brighter ones pulsed more slowly. This relationship allowed astronomers to calculate distances to faraway galaxies, transforming estimates of the universe’s size. Yet for years, Leavitt’s contribution was credited largely to male colleagues.',Q_MAIN,['Leavitt’s discovery about star brightness transformed astronomy even though she received little credit at first.','Leavitt catalogued more stars than any other astronomer of her time.','Male astronomers had developed the method for measuring galaxy distances before Leavitt.','Variable stars are the most accurate tool for measuring any distance.'],0,'The passage describes a discovery that changed astronomy and notes that she was under-credited. The other choices add claims the passage does not make.');
B('ideas','Central ideas and details',2,'Urban “heat islands” form because pavement and dark roofs absorb sunlight and release it as heat after dark. Some cities have begun painting roofs white and planting trees along streets. In one pilot neighborhood, afternoon temperatures dropped by an average of two degrees, though residents noted that the trees took several years to provide meaningful shade.',Q_MAIN,['Cities can reduce heat islands with reflective roofs and trees, though some benefits take time.','Pavement is the only cause of urban heat islands.','White roofs are more effective than trees in every neighborhood.','Residents generally oppose planting trees in cities.'],0,'The passage explains the cause, describes two fixes, and notes that trees take years to help. The other choices overstate or contradict it.');
B('ideas','Central ideas and details',1,'The Arctic tern makes the longest migration of any animal, flying from its breeding grounds in the Arctic to the Antarctic and back each year. Over its roughly thirty-year life, a single tern may travel the equivalent of three round trips to the Moon. Because it follows the summer on both ends of the planet, it sees more daylight than any other creature.',Q_MAIN,['The Arctic tern’s yearly migration is the longest of any animal and gives it unusual exposure to daylight.','The Arctic tern lives longer than most migratory birds.','Antarctic summers are longer than Arctic summers.','Terns fly to the Moon during migration.'],0,'The passage’s focus is the tern’s record-length migration and the daylight it experiences. The other choices misread details (the Moon comparison is only a measure of distance).');
B('ideas','Central ideas and details',3,'Philosopher Amara Obi argues that memory is less like a recording than like a story retold. Each time we recall an event, she says, we rebuild it from fragments, and the rebuilding is shaped by what we know and feel at the moment of recall. This does not make memory worthless, Obi insists; it makes it a living process that can be revised, for better or worse.',Q_MAIN,['Obi holds that memory is a reconstructive process that changes with each recall.','Obi believes that memories are accurate recordings that never change.','Obi argues that memory is unreliable and should be ignored.','Obi claims that emotion has no effect on memory.'],0,'Obi describes memory as rebuilt at each recall and explicitly says this does not make it worthless. The other choices contradict her view.');
B('ideas','Central ideas and details',2,'Beekeepers in the Ethiopian highlands have long hung hollow log hives from tall trees. Researchers who compared these hives with box hives on the ground found that the hanging hives were far less likely to be raided by honey badgers, and the bees in them produced honey at nearly the same rate. The team suggests that elevated hives may be a low-cost protection for apiaries in other regions with ground predators.',Q_MAIN,['Hanging hives protect bees from ground predators without reducing honey production much, and may be useful elsewhere.','Box hives produce much more honey than hanging hives.','Honey badgers are found only in the Ethiopian highlands.','Beekeepers in Ethiopia no longer use log hives.'],0,'The passage reports that hanging hives resisted badgers with similar honey output and suggests wider use. The other choices contradict or exceed the text.');
B('ideas','Inferences',2,'A team of ecologists compared two meadows: one mowed twice each summer and one left unmowed. The mowed meadow held far more flowering plant species, probably because mowing kept a few tall grasses from shading out smaller plants. If this explanation is correct, a third meadow in which tall grasses were removed by hand but never mowed would most likely ______',Q_INF,['hold more flowering species than the unmowed meadow','hold fewer flowering species than the unmowed meadow','hold exactly the same species as the mowed meadow','hold no flowering species at all'],0,'If the benefit comes from removing tall grasses, hand-removal should have a similar effect, so more flowering species than in the unmowed meadow.');
B('ideas','Inferences',2,'Records show that the population of the mill town doubled between 1850 and 1860, yet the number of newly built houses barely changed. This suggests that ______',Q_INF,['many new residents shared existing homes','the town’s population actually declined','most residents built their own houses without records','the mill had closed during the decade'],0,'More people but almost no new houses implies more people per house. The other options conflict with the stated population growth.');
B('ideas','Inferences',3,'Researchers found that people who read printed books before bed fell asleep faster than people who read on glowing tablets. Because the two groups read the same text for the same time, the difference is unlikely to be due to content. The researchers therefore suspect that ______',Q_INF,['light from the tablets interfered with sleep','printed books are more interesting than tablets','people who read tablets are more tired','reading itself prevents sleep'],0,'With content and time held constant, the remaining difference is the device and its light. The other choices are not supported.');
B('ideas','Inferences',2,'Historian Nia Adeyemi notes that the city’s earliest newspapers were printed in English, but court records from the same decades are filled with Spanish and Portuguese names. She concludes that English-language newspapers probably ______',Q_INF,['did not reach much of the city’s population','were written mainly by Spanish speakers','were more popular than court records','were printed without any readers'],0,'A population with Spanish and Portuguese names suggests many residents did not read English, so English papers reached only part of the city.');
B('ideas','Inferences',1,'Every student in Ms. Alvarez’s chemistry class who completed the lab report also attended the review session. Ravi did not attend the review session. Therefore, ______',Q_INF,['Ravi did not complete the lab report','Ravi completed the lab report','Ravi failed the class','Ravi was absent from class'],0,'If completing the report guarantees attending the review, then not attending means he could not have completed the report.');
B('ideas','Inferences',3,'Zoologists tracked two groups of migrating storks. Birds carrying small GPS tags arrived at their wintering grounds on average two days later than untagged birds. To decide whether the tags caused the delay, the zoologists would most need to know whether ______',Q_INF,['the tagged and untagged birds were similar in age and health before tagging','the tags were manufactured in the same country','the wintering grounds were warm','the untagged birds were counted by the same observers'],0,'If the groups differed in age or health beforehand, that could explain the delay instead of the tags, so comparing them is essential.');
B('ideas','Inferences',2,'In a city where the average daily temperature rose steadily over thirty years, annual sales of air conditioners also rose steadily. A reporter concludes that rising temperatures caused the sales increase. The reporter’s conclusion would be weakened if ______',Q_INF,['the number of households also doubled over the same thirty years','air conditioners became more energy efficient','summer rainfall was unchanged','the city’s name changed'],0,'More households could by itself explain higher sales, offering an alternative explanation to temperature.');
B('ideas','Command of evidence',2,'A researcher claims that students who sleep at least eight hours before an exam score higher than students who sleep six hours or fewer.','Which finding, if true, would most directly support the researcher’s claim?',['Students who slept at least eight hours scored an average of 11 points higher on the same exam than students who slept six hours or fewer.','Students who slept at least eight hours reported feeling more relaxed than other students.','Students who scored highest on the exam also had the highest grade point averages.','Students who slept six hours or fewer attended more study sessions.'],0,'Only the first choice compares exam scores between the two sleep groups, which is exactly what the claim states.');
B('ideas','Command of evidence',3,'A historian argues that the 1884 library reform widened public access to books in the port city, rather than merely benefiting scholars.','Which quotation from the library’s records, if true, would most directly support the historian’s argument?',['“In the year after reform, 2,300 borrowers registered, most listing occupations such as dockworker and seamstress.”','“The reform was debated by the board for three months.”','“The library’s catalog now lists 4,000 volumes in six languages.”','“Scholars at the university praised the new reading room.”'],0,'Registrations by dockworkers and seamstresses show non-scholars gaining access, directly supporting the claim of wider public access.');
B('ideas','Command of evidence',2,'A biologist hypothesizes that the bright color of a certain frog warns predators that the frog is toxic.','Which finding would most directly support the biologist’s hypothesis?',['Predators that attacked the frog quickly spat it out and avoided similar frogs afterward.','The frog’s color is brighter in the morning than at night.','The frog lives mainly in wet areas.','Female frogs lay eggs under leaves.'],0,'Predators learning to avoid the colored frog after a bad experience shows the color serves as a warning of toxicity.');
B('ideas','Command of evidence',3,'The table below summarizes a survey of 400 commuters.\n\nMode: Train — 160 commuters, average commute 42 minutes\nMode: Bus — 140 commuters, average commute 55 minutes\nMode: Bicycle — 100 commuters, average commute 28 minutes\n\nA city planner claims that cyclists have the shortest average commute of the three groups.','Which choice most effectively uses data from the table to support the planner’s claim?',['The average commute for the 100 cyclists was 28 minutes, shorter than the 42-minute and 55-minute averages for train and bus commuters.','Train commuters were the largest group, with 160 people.','The bus group’s average commute was 55 minutes.','The survey included 400 commuters in total.'],0,'The claim compares average commute times, and only the first choice does that for all three groups.');
B('ideas','Command of evidence',2,'In his letters, the explorer wrote that the expedition “lacked proper winter clothing” and that “several men were badly frostbitten before the first snow.” A historian claims that poor preparation harmed the expedition.','Which additional quotation from the letters would most directly support the historian’s claim?',['“Had we packed the furs the quartermaster recommended, our suffering would have been far lighter.”','“The mountains were among the most beautiful I have ever seen.”','“We reached the river on the fourth of October.”','“The cook prepared a fine stew for the evening meal.”'],0,'The first quotation links the lack of recommended gear directly to suffering, supporting the claim that poor preparation caused harm.');

const TR_WORDS={contrast:'However,',example:'For example,',result:'As a result,',addition:'Moreover,',similar:'Similarly,'};
const TR_POOL={contrast:['As a result,','For example,','Similarly,','Moreover,'],example:['However,','As a result,','Similarly,','In contrast,'],result:['However,','For example,','Similarly,','In contrast,'],addition:['However,','As a result,','In contrast,','Meanwhile,'],similar:['However,','As a result,','In contrast,','Nevertheless,']};
const TR=[
 ['contrast','The city’s bike-share program was expected to reduce car traffic downtown.','Traffic counts have barely changed since its launch.'],

 ['contrast','The study found that students who used the app improved their vocabulary scores.','Their grammar scores showed no measurable change.'],

 ['contrast','Many people assume that glaciers move too slowly to observe directly.','Time-lapse cameras on Greenland’s coast have recorded ice fronts retreating several meters in a single day.'],
 ['contrast','Maria expected the hike to take three hours.','It took nearly six after the trail washed out.'],
 ['example','Some animals use tools in surprising ways.','New Caledonian crows bend twigs into hooks to pull insects from crevices.'],

 ['example','Everyday objects can inspire great architecture.','The domes of the Eden Project in England were modeled on the structure of soap bubbles.'],
 ['example','Certain materials change their properties when heated.','Shape-memory alloys return to a preset form once warmed past a threshold temperature.'],
 ['example','Language can shape how people remember events.','Witnesses who heard the word “smashed” estimated higher car speeds than those who heard “hit.”'],

];
TR.forEach(([rel,s1,s2])=>{
  const good=TR_WORDS[rel];
  const lc=/^(New|Portuguese|Spanish|Dr\.)/.test(s2)?s2:s2.charAt(0).toLowerCase()+s2.slice(1);
  const wrongs=TR_POOL[rel].slice(0,3);
  const expl={contrast:`The second sentence contrasts with the expectation set by the first, so “However” fits. “As a result,” “For example,” and “Similarly,” each signal a different relationship.`,
    example:`The second sentence gives a specific instance of the general claim in the first, so “For example” is correct.`,
    result:`The second sentence describes an outcome of the first, so “As a result” is correct.`,
    addition:`The second sentence adds another supporting point to the first, so “Moreover” fits. The other choices signal contrast, a result, or a timing relationship.`,
    similar:`Both sentences describe parallel cases of the same kind, so “Similarly” is correct. A contrast word would wrongly suggest the cases differ.`}[rel];
  BANK.push({rel,id:'B'+String(BANK.length+1).padStart(3,'0'),section:'rw',domain:'expression',skill:'Transitions',diff:rel==='similar'?3:rel==='addition'?2:rel==='contrast'?2:1,
    passage:`${s1} ______ ${lc}`,stem:Q_TRANS,type:'mc',choices:[good,...wrongs],answer:0,expl,src:'bank',time:45});
});

/* ---------- Expression of Ideas: rhetorical synthesis ---------- */
function RS(diff,notes,goal,choices,expl){B('expression','Rhetorical synthesis',diff,notes.map(n=>'• '+n).join('\n'),`The student wants ${goal} Which choice most effectively uses relevant information from the notes to accomplish this goal?`,choices,0,expl)}
RS(2,['The Hanok is a traditional Korean house.','Hanok are built with wood, stone, and paper-covered doors.','Many hanok have ondol, a floor-heating system that sends smoke from the kitchen fire beneath the rooms.','Ondol has been used in Korea for roughly two thousand years.'],'to explain how a feature of the Hanok keeps the house warm.',['Many hanok have ondol, a system that sends smoke from the kitchen fire beneath the rooms to heat the floors.','Hanok are built with wood, stone, and paper-covered doors.','Ondol has been used in Korea for roughly two thousand years.','The Hanok is a traditional Korean house.'],'The goal is how a feature warms the house. Only the first choice explains the heating mechanism. The others describe materials, history, or the house generally.');
RS(2,['The Great Green Wall is an African reforestation project.','It aims to restore degraded land across the Sahel region.','Planting began in 2007.','About 18 percent of the planned restoration has been completed, according to a 2020 report.'],'to indicate how much progress has been made on the project.',['A 2020 report states that about 18 percent of the planned restoration has been completed.','The Great Green Wall is an African reforestation project.','The project aims to restore degraded land across the Sahel region.','Planting began in 2007.'],'The goal is progress made, which only the first choice quantifies. Others give definition, aim, or start date.');
RS(3,['Pianist Lucia Moreno won first prize at the 2019 Warsaw competition.','She was the first competitor from her country to win.','She performed Chopin’s Étude in C minor, Op. 10, No. 12.','Judges praised the clarity of her left-hand playing.'],'to emphasize what made her a historic winner, for readers unfamiliar with the competition.',['Pianist Lucia Moreno won first prize at the 2019 Warsaw competition, becoming the first competitor from her country to do so.','Pianist Lucia Moreno performed Chopin’s Étude in C minor, Op. 10, No. 12.','Judges at the 2019 Warsaw competition praised the clarity of Lucia Moreno’s left-hand playing.','Lucia Moreno is a pianist who competed in Warsaw.'],'“Historic” depends on being the first from her country to win. The first choice combines the win with that distinction and explains the context.');
RS(2,['Coral reefs cover less than one percent of the ocean floor.','They support about a quarter of all marine species.','Rising ocean temperatures cause corals to expel the algae they depend on, a process called bleaching.','Bleached corals can recover if temperatures drop soon enough.'],'to explain why rising temperatures threaten coral reefs.',['Rising ocean temperatures cause corals to expel the algae they depend on, a process called bleaching.','Coral reefs cover less than one percent of the ocean floor.','Bleached corals can recover if temperatures drop soon enough.','Coral reefs support about a quarter of all marine species.'],'The goal is the threat posed by temperature. The bleaching sentence names the mechanism; the others give size, importance, or a possibility of recovery.');
RS(3,['Two studies examined whether background music affects reading comprehension.','Study A (2016) found that comprehension scores were lower with lyrical music than in silence.','Study B (2018) found no difference in scores between instrumental music and silence.','Both studies involved college students.'],'to compare the findings of the two studies.',['Study A found lower comprehension with lyrical music than in silence, whereas Study B found no difference between instrumental music and silence.','Both studies involved college students.','Study A was conducted in 2016, and Study B was conducted in 2018.','Two studies examined whether background music affects reading comprehension.'],'A comparison requires placing the two findings side by side, which only the first choice does.');
RS(1,['Mount Kilimanjaro is the tallest mountain in Africa.','Its summit is 5,895 meters above sea level.','Three volcanic cones form the mountain.','Thousands of people attempt to climb it each year.'],'to state the mountain’s height.',['Mount Kilimanjaro’s summit is 5,895 meters above sea level.','Three volcanic cones form Mount Kilimanjaro.','Thousands of people attempt to climb Mount Kilimanjaro each year.','Mount Kilimanjaro is in Africa.'],'Only the first choice gives a height, which is the goal.');

/* ---------- Standard English Conventions (hand-written word-level items) ---------- */
const CONV_ITEMS=[
 [1,'The new regulations will ______ how small farms report their annual income.',['affect','effect','affected','effects'],0,'“Affect” is the verb meaning “to influence.” “Effect” is usually a noun meaning “result.”'],
 [1,'Her second album was more successful ______ her first.',['than','then','that','though'],0,'“Than” is used to compare. “Then” refers to time.'],
 [2,'The scientist ______ experiment failed last year has already begun a new study.',['whose','who’s','who','whom'],0,'“Whose” is the possessive form (her experiment). “Who’s” means “who is” or “who has.”'],
 [1,'The library has ______ computers than it did a decade ago, but the ones that remain are faster.',['fewer','less','lesser','least'],0,'Computers can be counted, so “fewer” is correct. “Less” is used with quantities that are not counted.'],
 [2,'The coach praised the players ______ had practiced all summer.',['who','whom','which','whose'],0,'The pronoun is the subject of “had practiced” and refers to people, so “who” is correct.'],
 [2,'The population of Lisbon is larger than ______ of Porto.',['that','those','it','them'],0,'The pronoun replaces “the population” (singular), so “that” is correct.'],
 [2,'Each of the winning designs ______ displayed in the lobby.',['is','are','were','have been'],0,'“Each” is singular and takes “is,” even though “designs” (inside the phrase) is plural.'],
 [3,'Neither the director nor the actors ______ aware of the schedule change until noon.',['were','was','is','has been'],0,'With “neither … nor,” the verb agrees with the closer subject, “actors” (plural), and the sentence is in the past tense: “were.”'],
];

 [2,'Marta rehearsed her speech for hours ______ her brother tested her with difficult questions.',';'],
 [2,'The northern route is shorter ______ the southern route is far safer in winter.',';'],
 [2,'The harbor was quiet at dawn ______ by noon it was crowded with fishing boats.',';'],
 [2,'Some students prefer studying at night ______ others do their best work early in the morning.',';'],
 [3,'The experiment confirmed the hypothesis ______ it also raised new questions about the method.',';'],
 [1,'The recipe requires only three ingredients ______ flour, butter, and sugar.',':'],
 [1,'The committee had one goal ______ to finish the report before the deadline.',':'],
 [2,'The suitcase held everything she needed for the trip ______ two sweaters, a camera, and a worn map.',':'],
 [2,'There are three planets visible tonight ______ Venus, Jupiter, and Saturn.',':'],
 [2,'One quality defined the winning design ______ simplicity.',':'],
 [2,'Only one thing could save the project ______ more funding.',':']

BOUND.forEach(([diff,passage,right])=>{
  const sem=right===';';
  const ex=sem?'Both sides of the blank are complete sentences that are related but do not explain one another. A semicolon joins two independent clauses. A comma alone creates a comma splice, a colon would imply that the second clause explains or lists the first, and no punctuation creates a run-on sentence.'
              :'What follows the blank is a list or a short explanation, not a complete sentence, and the part before the blank is a complete sentence. A colon correctly introduces it. A semicolon needs a complete sentence on both sides.';
  const wrong=[';',':',',',''].filter(x=>x!==right).map(x=>x||'(no punctuation)').map(x=>x==='(no punctuation)'?x:x);
  B('conventions','Boundaries',diff,passage,CONV_STEM,[right,...wrong],0,ex);
});
CONV_ITEMS.forEach(c=>B('conventions','Usage and agreement',c[0],c[1],CONV_STEM,c[2],c[3],c[4]));

}

[1,'The bakery’s new menu was an immediate success, and the owner credited the ______ response from customers for her decision to open a second location.',['enthusiastic','indifferent','hesitant','confused'],'An immediate success leading to a second location implies a very positive response: “enthusiastic.”','เมนูใหม่ประสบความสำเร็จทันทีและนำไปสู่สาขาที่สอง แปลว่าลูกค้าตอบรับดีมาก คือ “enthusiastic”'],
[2,'Years of drought left the once-lush valley ______, its riverbed cracked and its fields bare.',['barren','fertile','crowded','sheltered'],'A dry valley with cracked riverbed and bare fields is “barren.” “Fertile” is the opposite of the description.','หุบเขาที่แล้งจัด พื้นแม่น้ำแตกร้าว ทุ่งโล่ง คือ “barren” (แห้งแล้ง) ส่วน fertile ตรงข้าม'],
[3,'The critic called the novel’s ending ______, noting that it tied up every plot thread so neatly that the final chapter felt predictable.',['formulaic','enigmatic','experimental','tragic'],'An ending that resolves everything neatly and predictably follows a pattern, which is “formulaic.”','ตอนจบที่ผูกทุกเรื่องจนเรียบร้อยและเดาได้ แสดงว่าทำตามสูตร คือ “formulaic”'],
[2,'Researchers were careful to ______ their claims, noting that the sample was small and that the results would need to be confirmed by larger studies.',['qualify','exaggerate','abandon','publicize'],'Noting limits on a claim is “qualifying” it. “Exaggerate” would be the opposite of being careful.','การระบุข้อจำกัดของข้อกล่าวอ้างคือการ “qualify” ส่วน exaggerate ตรงข้ามกับความระมัดระวัง'],
[2,'Unlike her ______ brother, who spoke to everyone at the party, Dana spent the evening quietly in a corner.',['gregarious','solitary','anxious','secretive'],'“Unlike” signals contrast with Dana’s quietness, so her brother was sociable: “gregarious.”','“Unlike” บอกความตรงข้ามกับความเงียบของ Dana พี่ชายจึงชอบเข้าสังคม คือ “gregarious”'],
[2,'The treaty’s language was deliberately ______, allowing each side to interpret key terms in whatever way best served its interests.',['vague','exact','forceful','lengthy'],'If each side can interpret terms its own way, the wording must be unclear: “vague.”','ถ้าแต่ละฝ่ายตีความได้ตามใจ แปลว่าถ้อยคำไม่ชัดเจน คือ “vague”'],
[3,'Dr. Okafor’s ______ commitment to her patients was evident in the late nights she spent reviewing their charts long after her shift had ended.',['unwavering','grudging','temporary','theoretical'],'Working late after her shift shows steady, firm dedication: “unwavering.”','การทำงานดึกหลังเลิกกะแสดงความทุ่มเทที่มั่นคงไม่สั่นคลอน คือ “unwavering”'],
[2,'The museum’s director dismissed the rumor as ______, pointing out that there was no evidence the painting had ever left the building.',['unfounded','accurate','inevitable','persuasive'],'With no evidence, the rumor has no basis: “unfounded.”','เมื่อไม่มีหลักฐาน ข่าวลือก็ไม่มีมูล คือ “unfounded”'],
[1,'After three failed attempts, the team’s ______ finally paid off when the rocket reached orbit.',['persistence','carelessness','generosity','hesitation'],'Success after repeated failures rewards “persistence.”','ความสำเร็จหลังล้มเหลวหลายครั้งเป็นผลของ “persistence” (ความพยายามไม่ย่อท้อ)'],
[3,'The poet’s early work is marked by ______: she rarely used a word where a gesture would do, and many of her poems are only a few lines long.',['economy','excess','vagueness','flamboyance'],'Using as few words as possible is “economy.” “Excess” and “flamboyance” are the opposite.','การใช้คำให้น้อยที่สุดคือ “economy” (ความประหยัดถ้อยคำ) ส่วน excess และ flamboyance ตรงข้าม'],
[2,'Critics found the film’s plot ______, so full of coincidences that it was hard to believe any of it.',['implausible','predictable','lengthy','sincere'],'A plot full of coincidences that is hard to believe is “implausible.”','โครงเรื่องที่เต็มไปด้วยเรื่องบังเอิญจนเชื่อยาก คือ “implausible”'],
[3,'The ambassador’s ______ tone, which acknowledged the other delegation’s concerns without conceding any points, helped keep the talks from collapsing.',['diplomatic','blunt','sarcastic','dismissive'],'Acknowledging concerns while giving nothing away is “diplomatic.” “Blunt,” “sarcastic,” and “dismissive” would likely have ended the talks.','การยอมรับข้อกังวลโดยไม่ยอมถอยคือท่าทีแบบ “diplomatic” ส่วนที่เหลือมีแนวโน้มทำให้การเจรจาล่ม'],
[1,'The cat’s ______ movements, slow and careful as it stalked the bird, made no sound on the wooden floor.',['stealthy','clumsy','frantic','playful'],'Slow, careful, silent movement while hunting is “stealthy.”','การเคลื่อนไหวช้า ระวัง ไม่มีเสียงขณะล่า คือ “stealthy” (แอบเงียบ)'],
[2,'The new library was designed to be ______: its flexible walls and movable shelves can be rearranged for lectures, quiet study, or community events.',['versatile','ornate','secluded','imposing'],'Flexible walls and movable shelves serve many uses, which is “versatile.”','ผนังที่ยืดหยุ่นและชั้นวางที่ย้ายได้ใช้ได้หลายอย่าง คือ “versatile”'],
[2,'The scientist’s hypothesis seemed ______ at first, resting on a single observation, but each new experiment lent it more support.',['tenuous','conclusive','obvious','popular'],'Resting on a single observation makes it weak: “tenuous.” The word “but” signals that support later grew.','การอาศัยการสังเกตเพียงครั้งเดียวทำให้อ่อนแอ คือ “tenuous” และ “but” บอกว่าภายหลังมีหลักฐานเพิ่ม'],
[2,'The town’s annual fair, once a small gathering, has grown so ______ that organizers now need four separate parking areas.',['sprawling','intimate','tedious','secretive'],'Needing four parking areas shows a very large event, so “sprawling.” “Intimate” means small and close.','การต้องใช้ที่จอดรถสี่แห่งแสดงว่างานใหญ่มาก คือ “sprawling” ส่วน intimate หมายถึงเล็กและใกล้ชิด'],
[3,'Although the committee’s decision appeared ______ to outsiders, insiders knew it followed months of careful deliberation.',['impulsive','calculated','unanimous','delayed'],'“Although” signals contrast with careful deliberation, so to outsiders it looked hasty: “impulsive.”','“Although” บอกความตรงข้ามกับการไตร่ตรองอย่างรอบคอบ คนนอกจึงเห็นว่าเป็นการตัดสินใจหุนหัน คือ “impulsive”'],
[1,'The ______ smell of freshly baked bread drifted from the kitchen and drew the whole family to the table.',['inviting','faint','sour','stale'],'A smell that draws everyone to the table is pleasant and tempting: “inviting.”','กลิ่นที่ดึงทุกคนมาที่โต๊ะคือกลิ่นน่าดึงดูด คือ “inviting”'],
[2,'To ______ the damage from the flood, volunteers spent the weekend moving furniture to higher floors and sandbagging doorways.',['minimize','document','celebrate','ignore'],'Moving furniture and sandbagging are efforts to reduce damage: “minimize.”','การย้ายเฟอร์นิเจอร์และวางกระสอบทรายคือการลดความเสียหาย “minimize”'],
[3,'The composer was ______ about her influences, refusing to name any teachers or predecessors even when interviewers pressed her.',['evasive','boastful','forthcoming','grateful'],'Refusing to answer direct questions is “evasive.” “Forthcoming” means the opposite.','การไม่ยอมตอบคำถามตรงๆ คือ “evasive” (หลบเลี่ยง) ส่วน forthcoming ตรงข้าม'],
[2,'The journalist’s ______ questioning exposed several inconsistencies in the official’s account.',['probing','casual','rehearsed','friendly'],'Questions that expose inconsistencies dig deeply: “probing.”','คำถามที่เปิดโปงความไม่สอดคล้องคือคำถามที่เจาะลึก “probing”'],
[1,'Because the instructions were so ______, even beginners were able to assemble the shelf in under an hour.',['clear','confusing','brief','elaborate'],'Beginners succeeding quickly means the instructions were easy to follow: “clear.”','มือใหม่ประกอบเสร็จเร็ว แปลว่าคำแนะนำเข้าใจง่าย คือ “clear”'],
[3,'The explorer’s claims, long dismissed as ______, were later confirmed by satellite images of the lake she described.',['fanciful','scholarly','routine','cautious'],'Claims later proved true had been dismissed as imaginary: “fanciful.”','ข้อกล่าวอ้างที่ภายหลังพิสูจน์ว่าจริงเคยถูกมองว่าเพ้อฝัน คือ “fanciful”'],
[2,'The CEO’s decision to ______ the factory despite protests from workers suggested that she cared more about costs than about the community.',['shutter','expand','inspect','rename'],'Putting costs ahead of the community fits closing the factory: “shutter.”','การให้ความสำคัญกับต้นทุนมากกว่าชุมชนสอดคล้องกับการปิดโรงงาน “shutter”'],
[3,'The regime’s propaganda painted a ______ picture of daily life, ignoring shortages and queues that every citizen knew firsthand.',['rosy','bleak','balanced','realistic'],'Ignoring problems everyone knew about means painting an unrealistically positive picture: “rosy.”','การละเลยปัญหาที่ทุกคนรู้ดีคือการวาดภาพชีวิตที่ดีเกินจริง คือ “rosy”']
];

/* ---------- Text structure and purpose ---------- */
N('craft','Text structure and purpose',2,'For decades, urban gardens were seen as a pleasant hobby. A 2019 study of twelve cities, however, found that neighborhoods with community gardens had lower summer temperatures and higher rates of fresh-produce consumption. The authors argue that city planners should treat gardens as public infrastructure rather than amenities.',Q_PURP,['To present evidence that challenges a common view of urban gardens and to recommend a policy change','To describe the history of gardening in twelve cities','To compare community gardens with city parks','To explain how to start a community garden'],'The text states a common view, gives a study that complicates it, and ends with a recommendation. It does not give history, compare with parks, or explain how to start a garden.','ข้อความเริ่มจากมุมมองทั่วไป แล้วให้งานวิจัยที่ท้าทาย และจบด้วยข้อเสนอแนะ ไม่ได้เล่าประวัติ เปรียบเทียบกับสวนสาธารณะ หรือสอนวิธีเริ่มสวน');
N('craft','Text structure and purpose',1,'The octopus can change color in less than a second. Special cells in its skin expand and contract to reveal different pigments. This ability helps the octopus hide from predators and, in some species, communicate with other octopuses.','Which choice best describes the function of the second sentence in the text?',['It explains how the ability described in the first sentence works.','It introduces a counterargument to the first sentence.','It gives an example of a predator.','It summarizes the passage’s main conclusion.'],'The second sentence describes the skin cells that make color change possible, so it explains how the ability works.','ประโยคที่สองอธิบายเซลล์ผิวหนังที่ทำให้เปลี่ยนสีได้ จึงเป็นการอธิบายว่าความสามารถนั้นทำงานอย่างไร');
N('craft','Text structure and purpose',3,'Literary critic Samira Haddad argues that the narrator of the novel cannot be trusted. She points to a scene in which the narrator claims never to have left the village, even though an earlier chapter describes her crossing the border. Haddad does not conclude that the narrator is lying; instead, she suggests that the author wants readers to question how any storyteller selects what to remember.','Which choice best describes the overall structure of the text?',['It states a critic’s claim, gives evidence for it, and then notes a more nuanced interpretation.','It presents a problem and then lists several unrelated solutions.','It describes a historical event and then evaluates its causes.','It contrasts two critics who disagree about a novel.'],'The text states the claim (narrator unreliable), cites a scene, and then gives Haddad’s subtler reading. The other structures do not appear.','ข้อความระบุข้อกล่าวอ้างของนักวิจารณ์ (ผู้เล่าเชื่อถือไม่ได้) ยกฉากเป็นหลักฐาน แล้วจบด้วยการตีความที่ละเอียดกว่า โครงสร้างอื่นไม่ปรากฏ');
N('craft','Text structure and purpose',2,'Most people assume that the tongue has separate zones for sweet, sour, salty, and bitter tastes. This “tongue map” appears in many textbooks. Yet experiments show that every taste can be detected across the entire tongue, and the map originated from a mistranslation of a 1901 German study.',Q_PURP,['To correct a widely held belief about taste','To describe how taste buds are structured','To argue that German scientists made frequent errors','To defend the use of textbooks in classrooms'],'The passage introduces a common belief and then explains why it is mistaken, so its purpose is to correct a belief.','ข้อความเสนอความเชื่อที่แพร่หลายแล้วอธิบายว่าทำไมจึงผิด จุดประสงค์คือแก้ความเชื่อนั้น');
N('craft','Text structure and purpose',3,'In the final stanza of her poem, Ilse Moreau abandons the rhymed couplets that have governed the previous nine. The speaker, who has been describing a childhood home in tidy, musical lines, finds that she cannot remember the layout of the upstairs rooms. The sudden free verse mimics the breakdown of memory.','Which choice best states the function of the underlined portion “The sudden free verse mimics the breakdown of memory”?',['It interprets how a formal change in the poem reinforces its meaning.','It provides a definition of free verse.','It introduces an unrelated poem by the same author.','It questions whether the speaker is reliable.'],'The sentence explains what the shift in form accomplishes: the loss of structure mirrors the loss of memory.','ประโยคนี้อธิบายว่าการเปลี่ยนรูปแบบมีผลอย่างไร การสูญเสียโครงสร้างสะท้อนการสูญเสียความทรงจำ');
N('craft','Text structure and purpose',2,'Researchers at a coastal laboratory placed sensors on six oyster reefs. Over two years, reefs that were regularly cleaned of debris filtered more water than reefs left alone. The team concluded that modest human maintenance can significantly increase the benefits oyster reefs provide.','Which choice best describes the overall structure of the text?',['It describes a research setup, reports a result, and states the researchers’ conclusion.','It states a rule, gives exceptions, and recommends further study.','It compares two methods and rejects both.','It narrates a researcher’s career.'],'The text outlines what was done (sensors on reefs), what happened, and what the team concluded.','ข้อความบอกว่าทำอะไร (ติดเซนเซอร์ที่แนวหอยนางรม) ผลเป็นอย่างไร และทีมสรุปว่าอย่างไร');
N('ideas','Central ideas and details',1,'The Great Wall of China is not a single wall but a series of walls built by different dynasties over more than two thousand years. Some sections are made of stone, while others are simply packed earth. Today, several of the oldest sections have nearly disappeared.',Q_MAIN,['The Great Wall is a collection of walls built over many centuries from different materials.','The Great Wall was built entirely during one dynasty.','All sections of the Great Wall are made of stone.','The Great Wall is in perfect condition today.'],'The passage stresses that the Wall is a series of walls built at different times from different materials. The other choices contradict it.','ข้อความเน้นว่ากำแพงเป็นหลายส่วนที่สร้างต่างยุคต่างวัสดุ ตัวเลือกอื่นขัดกับข้อความ');
N('craft','Text structure and purpose',3,'The author begins her essay with a vivid description of a crowded fish market at dawn, listing the sounds, smells, and shouted prices. Only in the fourth paragraph does she reveal that the market was demolished in 1998. The delay, she says, is intentional: she wants readers to feel the loss before they understand it.','Which choice best describes the main purpose of the author’s statement about the delay?',['To explain why she structured the essay to withhold a key fact','To apologize for a flaw in the essay’s organization','To argue that fish markets should be rebuilt','To summarize the market’s history'],'The author directly says the delay is deliberate, designed to make readers feel the loss first. The statement explains her structural choice.','ผู้เขียนบอกตรงๆ ว่าการเลื่อนบอกข้อเท็จจริงเป็นความตั้งใจ ให้ผู้อ่านรู้สึกถึงการสูญเสียก่อน ประโยคนี้อธิบายเหตุผลของโครงสร้าง');
N('craft','Text structure and purpose',2,'Some economists argue that raising the minimum wage reduces employment because businesses cut jobs to save money. Others note that several recent studies found little change in employment after wage increases, since higher pay can lower turnover and boost productivity. The debate remains unresolved.','Which choice best describes the function of the underlined sentence “Others note that several recent studies found little change in employment after wage increases”?',['It presents a view that challenges the claim in the previous sentence.','It repeats the claim made in the previous sentence.','It defines the term “minimum wage.”','It gives biographical details about economists.'],'The sentence begins with “Others” and reports evidence against the earlier claim, so it challenges it.','ประโยคนี้ขึ้นต้นด้วย “Others” และรายงานหลักฐานที่ขัดกับข้อกล่าวอ้างก่อนหน้า จึงเป็นการท้าทาย');
N('craft','Text structure and purpose',3,'When chemist Alicia Fernandez first proposed that the new compound could store solar energy as heat, colleagues were skeptical. Her prototype, however, retained 95 percent of the heat it absorbed for over a month. The result has encouraged several teams to explore similar molecules, though Fernandez cautions that the compound remains too expensive for large-scale use.','Which choice best describes the overall structure of the text?',['It introduces an idea, reports evidence supporting it, and ends with a limitation.','It poses a question and answers it with three examples.','It describes a failure and then proposes a replacement.','It lists the steps of an experiment in order.'],'The text moves from the proposal to the supporting prototype result and ends with the caution about cost.','ข้อความเริ่มจากข้อเสนอ ต่อด้วยผลต้นแบบที่สนับสนุน และจบด้วยข้อจำกัดเรื่องราคา');
N('craft','Text structure and purpose',2,'Anthropologist Lena Ortiz spent two years studying how fishing families in a coastal village share their catch. She found that no one keeps records of who owes whom. Instead, social pressure and long memories sustain a system in which generosity today is expected to be repaid, in some form, tomorrow.',Q_PURP,['To explain how a community maintains a system of sharing without formal records','To criticize fishing families for poor record keeping','To argue that sharing systems always fail','To compare two villages’ fishing methods'],'The passage describes how sharing works through social pressure and memory rather than records. The other choices do not match.','ข้อความอธิบายว่าระบบแบ่งปันดำเนินไปด้วยแรงกดดันทางสังคมและความทรงจำ ไม่ใช่บันทึก ตัวเลือกอื่นไม่ตรง');
N('craft','Text structure and purpose',1,'Mount Fuji is Japan’s tallest peak. Thousands of people climb it every summer, when the weather is mildest. Climbing outside the official season is discouraged because of snow, ice, and sudden storms.',Q_PURP,['To provide basic information about a mountain and when it is safest to climb','To persuade readers to climb Mount Fuji in winter','To compare Mount Fuji with other volcanoes','To describe the geological formation of Mount Fuji'],'The text gives general facts and the safest climbing season. It does not recommend winter climbing, compare volcanoes, or discuss geology.','ข้อความให้ข้อมูลพื้นฐานและฤดูที่ปลอดภัยที่สุดในการปีน ไม่ได้ชวนปีนหน้าหนาว เปรียบเทียบภูเขาไฟ หรืออธิบายธรณีวิทยา');
N('craft','Text structure and purpose',3,'The playwright’s stage directions are famously sparse, usually a single line noting a setting or a pause. Directors have long debated whether this sparseness reflects confidence in the dialogue or an unwillingness to constrain the performers. Recent archival discoveries suggest a third possibility: the playwright wrote the directions in the margins of a typescript that was later lost.','Which choice best describes the function of the last sentence?',['It introduces a new explanation that differs from the two described earlier.','It rejects the debate described in the second sentence.','It provides a definition of “stage directions.”','It supports the first explanation with a quotation.'],'The last sentence offers “a third possibility” beyond the two explanations in the previous sentence.','ประโยคสุดท้ายเสนอ “ความเป็นไปได้ที่สาม” นอกเหนือจากสองคำอธิบายก่อนหน้า');
N('craft','Text structure and purpose',2,'Beavers are often called ecosystem engineers. By building dams, they create ponds that provide habitat for fish, amphibians, and waterfowl. The ponds also trap sediment, which improves the quality of water flowing downstream. These effects have led some conservationists to reintroduce beavers to areas where they had disappeared.','Which choice best describes the overall structure of the text?',['It gives a label, explains the effects that justify it, and mentions a practical result.','It argues against reintroducing beavers.','It compares beavers with other animals that build dams.','It tells the story of one particular beaver.'],'The text introduces the label “ecosystem engineers,” lists effects of dam building, and ends with conservation use.','ข้อความแนะนำคำเรียก “วิศวกรระบบนิเวศ” แล้วบอกผลของการสร้างเขื่อน และจบด้วยการนำไปใช้ในงานอนุรักษ์');

/* ---------- Cross-text connections ---------- */
function X(diff,t1,t2,stem,choices,expl,th){N('craft','Cross-text connections',diff,'Text 1: '+t1+'\nText 2: '+t2,stem,choices,expl,th)}
X(2,'Many educators believe that homework builds responsibility and reinforces classroom learning, and they argue that students who complete it regularly tend to earn better grades.','Researcher Mina Park notes that the studies linking homework to higher grades cannot show that homework caused the improvement, since motivated students may be both more likely to do homework and more likely to earn good grades.','Based on the texts, how would Park most likely respond to the educators’ claim in Text 1?',['By pointing out that the evidence cited does not establish that homework causes better grades','By agreeing that homework is the main cause of good grades','By arguing that grades are not important','By claiming that students never benefit from homework'],'Park questions whether the correlation shows causation, because a third factor (motivation) could explain both. She does not deny every benefit.','Park ตั้งคำถามว่าความสัมพันธ์ไม่ได้พิสูจน์ว่าเป็นสาเหตุ เพราะปัจจัยที่สาม (แรงจูงใจ) อาจอธิบายได้ทั้งสองอย่าง และไม่ได้ปฏิเสธประโยชน์ทั้งหมด');
X(3,'Biologist Tomas Reyes argues that the decline in frog populations is caused mainly by a fungal disease that spreads across continents through the pet trade.','Ecologist Priya Nair agrees that the fungus plays a role but emphasizes that habitat loss and pollution weaken frogs’ immune systems, making them more vulnerable to infection.','Based on the texts, which choice best describes a difference in the authors’ approaches to frog decline?',['Reyes focuses on a single main cause, whereas Nair stresses how several factors interact.','Reyes denies that fungus matters, whereas Nair emphasizes it.','Reyes studies frogs, whereas Nair studies only fungi.','Both authors reject the idea that frogs are declining.'],'Reyes names one main cause (fungus); Nair accepts it but adds habitat loss and pollution that increase vulnerability. The difference is single cause versus interacting causes.','Reyes ชี้สาเหตุหลักเดียว (เชื้อรา) ส่วน Nair ยอมรับแต่เพิ่มปัจจัยอื่นที่ทำให้เสี่ยงมากขึ้น ความต่างคือสาเหตุเดียวเทียบกับหลายปัจจัยที่ส่งผลร่วมกัน');
X(2,'Critic Aaron Webb praises the film’s slow pacing, saying that long silent shots invite viewers to notice small details and feel the characters’ isolation.','Critic Leah Doran finds the same long shots tedious, arguing that they delay the story without adding emotional depth.','Based on the texts, which choice best describes how the critics’ views relate?',['Webb and Doran evaluate the same stylistic feature but reach opposite judgments.','Webb and Doran agree that the film should be shorter.','Webb and Doran discuss different films.','Doran supports Webb’s argument with new evidence.'],'Both discuss the long silent shots; Webb values them, Doran finds them tedious.','ทั้งสองพูดถึงฉากยาวเงียบเหมือนกัน Webb ชื่นชม ส่วน Doran เห็นว่าน่าเบื่อ');
X(3,'Physicist Elan Ruiz proposes that a planned telescope will detect signs of life on distant planets within a decade by analyzing gases in their atmospheres.','Astronomer Hana Ito acknowledges the telescope’s power but warns that many gases once thought to signal life can also be produced by geological processes, so any detection will require careful interpretation.','Based on the texts, how would Ito most likely respond to Ruiz’s proposal?',['By agreeing that detection is possible but cautioning that the evidence may be ambiguous','By claiming the telescope cannot analyze atmospheres','By arguing that no planet outside the solar system exists','By predicting that detection will occur within a year'],'Ito acknowledges the telescope’s ability but says gases can have non-biological causes. She is cautious, not dismissive.','Ito ยอมรับความสามารถของกล้อง แต่เตือนว่าก๊าซอาจเกิดจากกระบวนการที่ไม่ใช่สิ่งมีชีวิต เธอระมัดระวัง ไม่ได้ปฏิเสธ');
X(1,'Local officials say that the new bus line will reduce commute times because it uses a dedicated lane.','Rider advocate Carlos Vega agrees that the dedicated lane will help but notes that the line’s limited number of stops may leave some neighborhoods underserved.','Based on the texts, how would Vega most likely respond to the officials’ claim?',['By agreeing that the lane is helpful while raising a concern the officials did not mention','By denying that bus lanes can save time','By demanding that the bus line be canceled','By claiming that no neighborhood needs bus service'],'Vega concedes the benefit of the lane but adds a concern (limited stops).','Vega ยอมรับว่าเลนเฉพาะช่วยได้ แต่เพิ่มข้อกังวลใหม่ (จุดจอดน้อย)');
X(2,'Historian Greta Lindqvist argues that medieval monasteries preserved knowledge by copying ancient manuscripts, ensuring that classical works survived.','Historian Omar Khalid notes that scholars in the Islamic world translated and expanded many of the same works, and that these translations later reached Europe, contributing to its intellectual revival.','Based on the texts, how would Khalid most likely respond to Lindqvist’s account?',['By suggesting that her account is incomplete because it omits another route by which knowledge was preserved','By claiming that monasteries copied no manuscripts','By arguing that knowledge was not preserved at all','By agreeing that monasteries alone preserved all classical works'],'Khalid adds a second route (Islamic scholars), implying Lindqvist’s account leaves something out.','Khalid เพิ่มเส้นทางที่สอง (นักวิชาการในโลกอิสลาม) แปลว่าคำอธิบายของ Lindqvist ยังไม่ครบ');
X(3,'Linguist Dr. Kai Ono holds that children learn language mainly by hearing it, so that the amount of speech a child hears at home strongly predicts later vocabulary.','Developmental psychologist Dr. Alma Reyes finds that the quality of interaction, such as conversational back-and-forth, predicts vocabulary better than the sheer quantity of speech.','Based on the texts, which choice best describes the relationship between the authors’ positions?',['Reyes refines Ono’s emphasis on quantity by arguing that interaction quality matters more.','Reyes rejects the idea that children learn language at all.','Ono and Reyes agree completely about what predicts vocabulary.','Ono argues that children learn language only from television.'],'Both see environment as important, but Reyes says quality, not quantity, is the better predictor.','ทั้งคู่เห็นว่าสภาพแวดล้อมสำคัญ แต่ Reyes บอกว่าคุณภาพของปฏิสัมพันธ์ทำนายได้ดีกว่าปริมาณ');
X(2,'Farmers’ association spokesperson Lena Berg says that subsidies for irrigation equipment are necessary because many small farms cannot afford the upfront costs.','Economist Raj Patel argues that irrigation subsidies often benefit large farms most, and that low-interest loans targeted at small farms would reach those who need help more efficiently.','Based on the texts, how would Patel most likely respond to Berg’s claim?',['By acknowledging the problem but proposing a different tool to address it','By denying that small farms face costs','By supporting the subsidies without changes','By arguing that irrigation is unnecessary'],'Patel accepts that small farms need help but proposes targeted loans instead of subsidies.','Patel ยอมรับว่าฟาร์มเล็กต้องการความช่วยเหลือ แต่เสนอสินเชื่อเฉพาะกลุ่มแทนเงินอุดหนุน');
X(3,'Philosopher Dara Mbeki contends that a person’s identity is fixed by their earliest memories, which shape their character for life.','Neuroscientist Dr. Paul Lang reports that memories are rewritten each time they are recalled, so that even early memories change over a lifetime.','Based on the texts, how would Lang most likely respond to Mbeki’s claim?',['By suggesting that its basis, stable early memories, is weaker than Mbeki assumes','By claiming that people have no memories','By arguing that identity depends only on genes','By agreeing that early memories never change'],'Lang says memories change when recalled, which undermines the idea that early memories are stable anchors for identity.','Lang บอกว่าความทรงจำเปลี่ยนเมื่อระลึก ซึ่งบั่นทอนแนวคิดว่าความทรงจำวัยเด็กเป็นหลักยึดที่คงที่ของตัวตน');
X(2,'Teacher Jun Park says that reading on paper helps students retain details better than reading on screens.','Researcher Dr. Neela Das cautions that many studies comparing the two formats used older, low-resolution screens, so the findings may not apply to modern devices.','Based on the texts, how would Das most likely characterize Park’s claim?',['As resting on evidence that may be out of date','As proven beyond doubt','As unrelated to reading','As contradicted by every study'],'Das does not say the claim is false, only that the evidence behind it may not apply to modern screens.','Das ไม่ได้บอกว่าข้อกล่าวอ้างผิด แต่ว่าหลักฐานอาจใช้กับจอรุ่นใหม่ไม่ได้');

/* ===== extra reading bank, part B: Information & Ideas ===== */
/* ---------- Central ideas and details ---------- */
const CI=(d,p,c,e,t)=>N('ideas','Central ideas and details',d,p,Q_MAIN,c,e,t);
CI(2,'Honeybees perform a “waggle dance” to tell hive mates where food is. The angle of the dance relative to vertical indicates the direction of the food relative to the sun, and the length of the waggle indicates the distance. Experiments in which researchers moved the food source confirmed that bees follow these signals accurately.',['Honeybees communicate the direction and distance of food through a dance that other bees can interpret.','Honeybees dance mainly to attract mates.','Researchers have never been able to test the waggle dance.','Honeybees prefer food that is close to the hive.'],'The passage explains what the dance communicates and that experiments confirm bees use it. The other choices are unsupported.','ข้อความอธิบายว่าการเต้นสื่อทิศทางและระยะทาง และการทดลองยืนยันว่าผึ้งใช้สัญญาณนี้จริง ตัวเลือกอื่นไม่มีข้อความรองรับ');
CI(1,'Many people think that lightning never strikes the same place twice. In fact, tall structures such as the Empire State Building are struck about twenty times each year. Lightning follows the path of least resistance, and a tall, pointed object offers a very attractive one.',['Lightning often strikes the same tall structures repeatedly.','Lightning never strikes the Empire State Building.','Lightning avoids tall objects.','Lightning is more common in winter.'],'The passage corrects a common belief by showing that tall structures are struck repeatedly.','ข้อความแก้ความเชื่อทั่วไปโดยแสดงว่าสิ่งก่อสร้างสูงถูกฟ้าผ่าซ้ำหลายครั้ง');
CI(3,'Economist Naledi Moyo observes that cities with strong public transit often have higher rents near stations. This, she argues, is not evidence that transit harms affordability but a sign of its value: people are willing to pay more to live where they can easily reach jobs and services. The policy challenge is to ensure that the benefits are shared widely.',['Moyo interprets higher rents near transit as a sign of transit’s value and argues that policy should spread its benefits.','Moyo believes that transit should be eliminated.','Moyo claims that rents are unrelated to location.','Moyo argues that cities should stop building stations.'],'Moyo reads the rent pattern as a sign of value, not harm, and points to sharing benefits as the challenge.','Moyo ตีความค่าเช่าที่สูงว่าเป็นสัญญาณของคุณค่าไม่ใช่ความเสียหาย และบอกว่าความท้าทายคือการกระจายประโยชน์ให้ทั่วถึง');
CI(2,'Sea otters are a keystone species along the Pacific coast. They eat sea urchins, which graze on kelp. When otter populations were hunted to near extinction, urchins multiplied and destroyed kelp forests. After otters were protected, kelp forests recovered, restoring habitat for fish and other animals.',['Sea otters help keep kelp forests healthy by controlling the urchins that eat kelp.','Sea urchins are beneficial to kelp forests.','Kelp forests grow only where otters have been hunted.','Fish populations are not affected by kelp.'],'The passage links otters to urchin control and kelp recovery, so otters keep kelp forests healthy.','ข้อความเชื่อมนากทะเลกับการควบคุมเม่นทะเลและการฟื้นของป่าเคลป์ จึงสรุปว่านากช่วยให้ป่าเคลป์สมบูรณ์');
CI(3,'Poet Yusuf Ahmed’s later work is often described as a departure from his early lyric style. Yet a close reading of his notebooks reveals that the themes of exile and memory that dominate the later poems were already present in his earliest drafts, expressed in a more guarded voice. What changed, the critic suggests, was not his subject but his willingness to address it directly.',['The critic argues that Ahmed’s later poems continue earlier themes but treat them more openly.','The critic argues that Ahmed abandoned his early themes.','The critic claims that Ahmed’s notebooks were destroyed.','The critic argues that Ahmed’s early work was his best.'],'The critic says the themes were already present early on; the change was directness. The other choices contradict this.','นักวิจารณ์บอกว่าธีมมีมาตั้งแต่ต้น สิ่งที่เปลี่ยนคือความตรงไปตรงมา ตัวเลือกอื่นขัดกับข้อความ');
CI(2,'Researchers examined the shells of marine snails collected over a century and found that modern shells were thinner than those from the early 1900s. The scientists link the change to ocean acidification, which makes it harder for snails to absorb the minerals they need to build shells. They caution that other factors may also contribute.',['Snail shells have become thinner over a century, and ocean acidification is a likely contributing cause.','Snails now build thicker shells than before.','Ocean acidification has been ruled out as a cause.','Snail shells cannot be studied over time.'],'The passage reports thinner shells and links them to acidification while noting other factors may contribute.','ข้อความรายงานว่าเปลือกบางลงและเชื่อมกับความเป็นกรดของมหาสมุทร แต่ก็บอกว่ามีปัจจัยอื่นด้วย');
CI(1,'The Sahara was once green. About 10,000 years ago, shifts in Earth’s orbit increased monsoon rainfall over North Africa, creating lakes and grasslands where people herded cattle. As the orbit shifted again, rainfall declined and the desert returned.',['Changes in Earth’s orbit once made the Sahara wet and green before drying it again.','The Sahara has always been a desert.','People never lived in the Sahara.','Monsoon rains increased after the desert returned.'],'The passage describes orbital shifts bringing rain and later drying. Other choices contradict it.','ข้อความบอกว่าวงโคจรเปลี่ยนทำให้ซาฮาราเคยเขียวชอุ่มแล้วกลับแห้ง ตัวเลือกอื่นขัดกัน');
CI(2,'In many languages, words for colors appear in a predictable order: first black and white, then red, then green or yellow, and later blue. Researchers suggest that languages add color terms as the colors become practically useful to a society, which may explain why blue, a rare color in nature, is often named last.',['Languages tend to develop color words in a regular order, possibly driven by usefulness.','All languages have the same number of color words.','Blue is the first color named in every language.','Color words are unrelated to culture.'],'The passage describes a predictable order and a proposed reason. Others misstate it.','ข้อความอธิบายลำดับการเกิดคำสีที่คาดเดาได้และเหตุผลที่เสนอ ตัวเลือกอื่นบิดเบือน');
CI(3,'Environmental historian Rosa Delgado argues that the “wilderness” celebrated in national parks was never untouched. Indigenous peoples managed many of those landscapes for millennia, setting controlled fires and tending plants. By treating the land as empty, early park founders obscured that history and sometimes forced residents out.',['Delgado argues that supposedly untouched wilderness was shaped by Indigenous management whose history parks obscured.','Delgado argues that national parks should be sold.','Delgado claims that fires have never been used to manage land.','Delgado argues that wilderness is always untouched.'],'Delgado’s point is that “wilderness” was managed land and the idea erased that history.','Delgado ชี้ว่า “ป่าดิบ” ที่จริงถูกจัดการโดยชนพื้นเมือง แต่แนวคิดนี้ลบประวัติศาสตร์ส่วนนั้น');
CI(2,'A recent survey found that people who regularly walk in green spaces report lower stress than people who walk on city streets. The difference remained even after the researchers accounted for age, income, and exercise level, which suggests that the setting itself plays a role.',['Walking in green spaces appears to reduce stress beyond the effects of exercise, age, or income.','Exercise has no effect on stress.','City streets are more relaxing than parks.','Income is the main cause of stress.'],'The finding persists after controlling for other factors, suggesting the setting matters.','ผลยังคงอยู่หลังควบคุมปัจจัยอื่น แสดงว่าสถานที่มีผลจริง');
CI(1,'The first modern Olympic Games took place in Athens in 1896. Only fourteen countries sent athletes, and all of the competitors were men. Today, more than two hundred nations participate, and women compete in nearly every sport.',['The Olympic Games have grown to include far more countries and women competitors since 1896.','The first Olympics included women.','Only fourteen countries participate today.','The Olympics were first held in Paris.'],'The passage contrasts the small, all-male 1896 Games with today’s large, inclusive ones.','ข้อความเทียบโอลิมปิก 1896 ที่เล็กและมีแต่ผู้ชายกับปัจจุบันที่ใหญ่และมีผู้หญิงเกือบทุกกีฬา');
CI(3,'Marine biologist Keiko Sato describes how the bioluminescent plankton in the bay flash when disturbed. This glow, she explains, probably evolved as a “burglar alarm”: the light attracts larger predators that may eat whatever is disturbing the plankton. Sato admits that proving this explanation requires experiments that have not yet been done.',['Sato offers a plausible but untested explanation for why plankton glow when disturbed.','Sato has proven that plankton glow to attract mates.','Sato argues that plankton never glow.','Sato claims the explanation has been confirmed by experiments.'],'Sato says the explanation is probable (“probably evolved”) but not yet proved.','Sato เสนอคำอธิบายที่เป็นไปได้ (“probably”) แต่ยังไม่ได้พิสูจน์ด้วยการทดลอง');
CI(2,'Coffee farmers in Ethiopia have adopted a technique in which cherries are dried on raised beds rather than on the ground. The beds improve airflow and reduce mold, which raises the quality of the beans and the price farmers receive. Cooperatives report that the shift required only a modest investment.',['A low-cost drying method has helped Ethiopian farmers improve bean quality and earn more.','Raised beds increase mold in coffee cherries.','Farmers received lower prices after the change.','The new technique is too costly for most farmers.'],'The passage says the method improved quality and price at modest cost.','ข้อความบอกว่าวิธีนี้เพิ่มคุณภาพและราคาด้วยการลงทุนไม่มาก');
CI(2,'Although many people picture astronauts as constantly floating, they spend several hours each day exercising. Without gravity, muscles and bones weaken quickly, so astronauts use specially designed machines to maintain strength. Even so, they often need weeks of rehabilitation after returning to Earth.',['Astronauts must exercise intensively because weightlessness weakens their bodies.','Astronauts do not need exercise in space.','Muscles grow stronger in zero gravity.','Astronauts recover immediately after returning to Earth.'],'The passage explains the exercise need and the lingering effects of weightlessness.','ข้อความอธิบายว่าต้องออกกำลังกายเพราะไร้น้ำหนักทำให้ร่างกายอ่อนแอ และยังต้องฟื้นฟูหลังกลับโลก');

/* ---------- Inferences ---------- */
const INF=(d,p,c,e,t)=>{const m=/^([\s\S]*?\s)(Which [^?]*\?)$/.exec(p);if(m)N('ideas','Inferences',d,m[1].trim(),m[2],c,e,t);else N('ideas','Inferences',d,p,Q_INF,c,e,t)};
INF(2,'Two bakeries on the same street sell nearly identical bread at the same price. Bakery A recently added an outdoor seating area, and its sales rose 20 percent over the next quarter, while Bakery B’s sales stayed flat. This suggests that ______',['customers value the experience of eating on site in addition to the quality of the bread','Bakery B’s bread is of lower quality','outdoor seating always increases sales','customers dislike bakeries without seating'],'With bread and price equal, the difference is the seating, so the added seating likely drew customers. “Always” and “lower quality” go beyond the evidence.','เมื่อขนมปังและราคาเท่ากัน ความต่างคือที่นั่ง จึงสรุปได้ว่าที่นั่งน่าจะดึงลูกค้า ส่วน “always” และ “lower quality” เกินหลักฐาน');
INF(1,'The museum is closed every Monday. Priya wants to visit on a day when the museum is open and her friend Omar is free. Omar is free only on Mondays and Wednesdays. Therefore, Priya should visit on ______',['Wednesday','Monday','Tuesday','Sunday'],'The museum is closed Mondays, and Omar is free only Mondays and Wednesdays, so Wednesday is the only day that works.','พิพิธภัณฑ์ปิดวันจันทร์ และ Omar ว่างแค่วันจันทร์กับพุธ จึงมีวันพุธวันเดียวที่ได้');
INF(3,'A study found that employees who commute by bicycle take fewer sick days than those who drive. Critics note, however, that people healthy enough to ride a bicycle to work may be less likely to get sick anyway. If the critics are correct, then the study’s finding ______',['may reflect existing health differences rather than the effect of cycling','proves that cycling prevents illness','shows that driving causes illness','demonstrates that sick days are unrelated to health'],'The critics offer an alternative explanation (healthier people choose cycling), so the correlation may not show cause.','นักวิจารณ์เสนอคำอธิบายอื่น (คนสุขภาพดีเลือกปั่นจักรยาน) ความสัมพันธ์จึงอาจไม่ใช่เหตุและผล');
INF(2,'In an experiment, students who were told that a puzzle was “very difficult” gave up after an average of four minutes. Students who were given the identical puzzle without any description worked on it for nine minutes. These results suggest that ______',['expectations about difficulty can affect how long people persist','the puzzle was easier for the second group','students who gave up were less intelligent','the description made the puzzle harder to solve'],'The puzzle was identical, so the difference in persistence came from what students were told.','ปริศนาเหมือนกัน ความต่างของความพยายามจึงมาจากสิ่งที่ถูกบอก');
INF(3,'The ancient city’s granaries were found nearly empty, yet the surrounding fields show signs of intensive cultivation. Archaeologists suspect that the city exported much of its grain. This explanation would be strengthened by evidence that ______',['the city had trade routes and storage facilities at its port','the fields were abandoned before the granaries were built','the city’s population was declining','the granaries were destroyed in a fire'],'Trade routes and port storage would show where the grain went, supporting the export explanation.','เส้นทางการค้าและโกดังที่ท่าเรือจะแสดงว่าธัญพืชไปที่ไหน สนับสนุนคำอธิบายเรื่องการส่งออก');
INF(2,'When a certain plant is attacked by caterpillars, it releases a chemical that attracts wasps. The wasps then lay eggs in the caterpillars, killing them. If a researcher blocks the plant’s ability to release the chemical, the researcher would most likely observe that ______',['more caterpillars survive on the plant','more wasps visit the plant','the plant grows faster','the caterpillars stop eating'],'Without the chemical, fewer wasps come, so more caterpillars survive.','ถ้าไม่มีสารเคมี ตัวต่อจะมาน้อยลง หนอนจึงรอดมากขึ้น');
INF(1,'Every club member who attended the workshop received a certificate. Elena did not receive a certificate. Therefore, ______',['Elena did not attend the workshop','Elena attended the workshop','Elena is not a club member','Elena lost her certificate'],'Attending guarantees a certificate, so no certificate means she did not attend (assuming she is a member).','ถ้าเข้าร่วมแล้วต้องได้ใบรับรอง การไม่ได้ใบรับรองแปลว่าไม่ได้เข้าร่วม');
INF(3,'Historians noticed that the diary entries of a ship’s captain mention fair weather on every day of a voyage during which, according to harbor records, a severe storm struck the region. One plausible explanation is that ______',['the captain wrote the entries later or avoided recording unpleasant events','the harbor records are always wrong','the ship traveled in a different ocean','the storm never happened'],'Conflicting records suggest the diary was unreliable, so a plausible explanation is that it was written later or selectively.','บันทึกขัดกันแสดงว่าไดอารี่อาจไม่น่าเชื่อถือ จึงเป็นไปได้ว่าเขียนภายหลังหรือเลือกบันทึก');
INF(2,'Researchers placed identical bird feeders in a city park and in a nearby forest. Birds in the park visited the feeders twice as often. The researchers hypothesize that forest birds find more natural food, so they have less need for feeders. Which finding would best support this hypothesis?',['Forest birds had more insects and seeds available than park birds','Park birds are larger than forest birds','The park had more benches than the forest','Forest feeders contained different seed'],'More natural food in the forest explains why forest birds need feeders less.','อาหารธรรมชาติในป่ามากกว่า จึงอธิบายว่าทำไมนกในป่าใช้ที่ให้อาหารน้อยกว่า');
INF(2,'The company reported that its profits increased by 30 percent this year. A shareholder notes that total revenue was unchanged. The shareholder most likely concludes that ______',['the company’s costs decreased','the company sold more products','the company raised its prices','the company opened new stores'],'With unchanged sales but higher profit, costs must have fallen (or prices rose); among the choices, lower costs is the supported inference. Higher prices would also change sales revenue.','ยอดขายเท่าเดิมแต่กำไรเพิ่ม แปลว่าต้นทุนลดลง');

 result:'ประโยคที่สองบอกผลลัพธ์ของประโยคแรก จึงใช้คำเชื่อมแสดงผลลัพธ์',
 addition:'ประโยคที่สองเพิ่มประเด็นในทิศทางเดียวกัน จึงใช้คำเชื่อมแสดงการเพิ่มเติม',

 time:'ประโยคที่สองเล่าสิ่งที่เกิดขึ้นภายหลังตามลำดับเวลา จึงใช้คำเชื่อมแสดงลำดับเวลา',

/* ---------- Rhetorical synthesis ---------- */
function RS2(diff,notes,goal,choices,expl,th){
  N('expression','Rhetorical synthesis',diff,notes.map(n=>'• '+n).join('\n'),`The student wants ${goal} Which choice most effectively uses relevant information from the notes to accomplish this goal?`,choices,expl,th);
}
