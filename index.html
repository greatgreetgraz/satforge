  const out=h('div',{class:'page'},h('h1',{},t('pg.title')),h('p',{class:'lede'},t('pg.lede')));
  /* estimate */
  out.append(h('div',{class:'grid3'},
    h('div',{class:'panel scorebox'},h('div',{class:'score-l'},t('est.title')),h('div',{class:'score-v'},et?et.est:'—'),h('div',{class:'muted small'},et?t('est.range',{lo:et.lo,hi:et.hi}):t('est.none'))),
    scoreCard(t('sec.rw'),S.prefs.lastRW,rw),scoreCard(t('sec.math'),S.prefs.lastMath,ma)));
  out.append(h('p',{class:'muted small'},t('pg.caveat')));
  /* Bluebook-style skill bars */
  const bars=domainBars();
  const domCol=(sec,ds)=>h('div',{},h('h3',{},t(sec==='math'?'sec.math':'sec.rw')),
    h('div',{class:'bars'},ds.map(d=>{
      const b=bars[d];
      return h('div',{class:'brow'},h('span',{class:'bl'},domLabel(d)),b.bars?sbars(b.bars):h('span',{class:'muted small'},t('pg.noBars')),h('span',{class:'bv'},b.prior?t('pg.fromImport'):b.a?b.a+' '+t('pg.qs'):''));
    })));
  out.append(h('div',{class:'panel'},h('h2',{},t('pg.skillbars')),h('p',{class:'muted small'},t('pg.skillbarsD')),
    h('div',{class:'grid2 dom'},domCol('rw',['craft','ideas','conventions','expression']),domCol('math',['algebra','advmath','data','geometry']))));
  /* what I need */
  out.append(needPanel());
  /* trend */
  out.append(h('div',{class:'panel'},h('h2',{},t('tr.title')),trendChart()));
  /* by skill */
  const rows=Object.values(S.stats).filter(s=>s.a).map(s=>Object.assign({acc:s.c/s.a,avg:s.tt?s.t/s.tt:0},s)).sort((a,b)=>a.acc-b.acc);
  [['rw','sec.rw'],['math','sec.math']].forEach(([sec,key])=>{
    const rs=rows.filter(r=>r.sec===sec);
    out.append(h('div',{class:'panel'},h('h2',{},t(key)+' · '+t('pg.bySkill')),
      rs.length?h('div',{class:'bars'},rs.map(r=>{const p=Math.round(r.acc*100);
        return h('div',{class:'brow'},h('span',{class:'bl'},skillLabel(r.skill)),bar(p,p>=80?'good':p>=60?'mid':'low'),h('span',{class:'bv'},r.c+'/'+r.a+' · '+p+'% · '+Math.round(r.avg)+'s'))})):h('p',{class:'muted'},t('pg.none'))));
  });
  out.append(h('div',{class:'panel'},h('h2',{},t('streak.title')),heatmap(26),h('p',{class:'muted small'},t('streak.best',{n:streak()}))));
  out.append(h('div',{class:'panel'},h('h2',{},t('pg.recent')),sessionRows(S.log.slice(-12).reverse())));
  return out;
}
function scoreCard(label,last,est){
  return h('div',{class:'panel scorebox'},
    h('div',{class:'score-l'},label),
    h('div',{class:'score-v'},est?est.est:(last||'—')),
    h('div',{class:'muted small'},est?t('score.est',{lo:est.lo,hi:est.hi}):t('score.none')),
    last&&est?h('div',{class:'delta '+(est.est>=last?'up':'down')},(est.est>=last?'+':'−')+Math.abs(est.est-last)+' '+t('score.vsLast')):null);
}
function needPanel(){
  const tg=S.prefs.target;
  const box=h('div',{class:'needbox'});
  const lab=h('span',{class:'big-sm',id:'need-val'},tg);
  const draw=v=>{
    const rows=whatINeed(v);
    box.replaceChildren(h('div',{class:'tbl-wrap'},h('table',{class:'qtable left'},
      h('thead',{},h('tr',{},[t('need.sec'),t('need.score'),t('need.right'),t('need.you')].map(x=>h('th',{scope:'col'},x)))),
      h('tbody',{},rows.map(r=>h('tr',{},h('th',{scope:'row'},t(r.sec==='math'?'sec.math':'sec.rw')),h('td',{},r.score),h('td',{},t('need.of',{a:r.right,b:r.total})),h('td',{},r.cur?r.cur+(r.gap>0?' (+'+r.gap+')':' ✓'):'—')))))));
  };
  draw(tg);
  const rng=h('input',{id:'need-range',type:'range',min:900,max:1600,step:10,value:tg,'aria-label':t('need.target'),oninput:e=>{const v=+e.target.value;lab.textContent=v;draw(v)},onchange:e=>{S.prefs.target=+e.target.value;save()}});
  return h('div',{class:'panel'},h('h2',{},t('need.title')),h('p',{class:'muted small'},t('need.lede')),
    h('div',{class:'row'},h('span',{},t('need.target')+': '),lab),rng,box,h('p',{class:'muted small'},t('need.note')));
}

/* ---------- pacing analytics ---------- */
function viewPacing(){
  const rows=Object.values(S.stats).filter(s=>s.tt>=3).map(s=>({sec:s.sec,skill:s.skill,avg:s.t/s.tt,target:PACE[s.sec],acc:s.c/s.a,n:s.a}));
  const out=h('div',{class:'page'},h('h1',{},t('pace.page')),h('p',{class:'lede'},t('pace.lede')));
  if(!rows.length){out.append(emptyPanel(t('pace.noData'),t('nav.practice'),()=>go('practice')));return out}
  const slowWrong=rows.filter(r=>r.avg>r.target*1.15&&r.acc<.7),fastWrong=rows.filter(r=>r.avg<=r.target*.8&&r.acc<.7),slowRight=rows.filter(r=>r.avg>r.target*1.15&&r.acc>=.7);
  const slowErr=S.errors.filter(e=>e.slow).length;
  out.append(h('div',{class:'grid3'},
    h('div',{class:'panel'},h('h3',{},t('pace.q1')),h('p',{class:'dnum'},slowWrong.length),h('p',{class:'muted small'},t('pace.q1d')),h('p',{class:'small'},slowWrong.slice(0,3).map(r=>skillLabel(r.skill)).join(' · '))),
    h('div',{class:'panel'},h('h3',{},t('pace.q2')),h('p',{class:'dnum'},fastWrong.length),h('p',{class:'muted small'},t('pace.q2d')),h('p',{class:'small'},fastWrong.slice(0,3).map(r=>skillLabel(r.skill)).join(' · '))),
    h('div',{class:'panel'},h('h3',{},t('pace.q3')),h('p',{class:'dnum'},slowRight.length),h('p',{class:'muted small'},t('pace.q3d')),h('p',{class:'small'},slowRight.slice(0,3).map(r=>skillLabel(r.skill)).join(' · ')))));
  out.append(h('p',{class:'muted small'},t('pace.slowSaved',{n:slowErr})));
  [['rw','sec.rw'],['math','sec.math']].forEach(([sec,key])=>{
    const rs=rows.filter(r=>r.sec===sec).sort((a,b)=>b.avg/b.target-a.avg/a.target);
    if(!rs.length)return;
    const maxR=Math.max(1.6,...rs.map(r=>r.avg/r.target));
    out.append(h('div',{class:'panel'},h('h2',{},t(key)),h('p',{class:'muted small'},t('pace.target',{s:PACE[sec]})),
      h('div',{class:'bars'},rs.map(r=>{const ratio=r.avg/r.target,w=Math.round(100*ratio/maxR),tw=Math.round(100/maxR);
        return h('div',{class:'brow pc'},h('span',{class:'bl'},skillLabel(r.skill)),
          h('span',{class:'meter pace-m '+(ratio>1.15?'low':ratio<.85?'good':'mid'),role:'img','aria-label':Math.round(r.avg)+'s'},h('i',{style:{width:w+'%'}}),h('b',{class:'tline',style:{left:tw+'%'}})),
          h('span',{class:'bv'},Math.round(r.avg)+'s · '+Math.round(r.acc*100)+'%'))})),
      h('div',{class:'legend'},h('span',{},h('i',{class:'sw line'}),t('res.targetL')))));
  });
  out.append(h('div',{class:'panel'},h('h2',{},t('pace.tips')),h('ul',{class:'keylist'},['t1','t2','t3','t4'].map(k=>h('li',{},t('pace.'+k))))));
  return out;
}
